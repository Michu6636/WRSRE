$ITEM_DESC "[h1]Building a bright socialist future is not enough — you also have to fight for it![/h1]

You waited for it, you wanted it — you got it.
This mod turns a peaceful city builder into a wargame.

[b]Warning![/b] The mod is in open beta. You can already play it fully in your usual Soviet Republic, but the content is not finished yet. Back up your save before running it with the mod.

[h2]What the mod adds[/h2]
[list]
[*]A new build category, "Defence". Without it you can't build a military base or call up combat units.
[*]Full control of combat units, and battles with infantry, armoured vehicles and military aircraft.
[*]The first scenarios of clashes with the enemy. Tip: if you don't want trouble, don't put your troops too close to the border with the West — they may not appreciate your friendliness.
[/list]

The debug tools are still in the mod for now (Ctrl+Shift+D): with them you can start a battle with NATO forces at any moment and spawn any vehicle.

Not every vehicle looks exactly like its name. Either way, thank you to the modders who have been uploading military vehicles for this game to the Workshop for years! Version 0.3 uses dedicated Warsaw Pact and NATO tank packs with models ported from Wargame: Red Dragon. Other models and buildings are provided by Steam Workshop creators.

[h2]How to install[/h2]
[olist]
[*]Subscribe to Frontline and all required items. Wait for the downloads to finish.
[*]Close the game and make a separate backup of your save.
[*]Open the mod folder, usually Steam\steamapps\workshop\content\784150\3835680832.
[*]Run install.bat and wait for it to finish. If asked for the game folder, select the one containing SOVIET64.exe. The game and mod can be on different drives.
[*]Start the game as usual. The main menu will show “Frontline active” and the mod version. Press F8 to switch between managing your republic and commanding your army.
[/olist]
To remove the mod, run uninstall.bat.

[h2]UPDATE 0.3 — for returning players[/h2]
Warsaw Pact and NATO tanks now come in two dedicated packs. The old models have been replaced, so several separate tank subscriptions are no longer required. This update also fixes English building names and improves the installer.

[b]After downloading the update, run install.bat again. Downloading it through Steam alone is not enough![/b]

Close the game first and wait for both new packs to download: [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3836269593]Warsaw Pact[/url] and [url=https://steamcommunity.com/sharedfiles/filedetails/?id=3836462194]NATO[/url].

[b]The mod will try to update your saves and replace old vehicles and units automatically. You MUST still make a separate backup of your save before installing![/b]
If the same vehicle is not in the new pack, it will be replaced with the closest equivalent. This covers units on the map, HQ rosters and purchased SR vehicles in Frontline saves.

Wait for the installation success message. It will also tell you the installed language: Russian for a Russian game, English for every other language. If installation fails, post the installer log in the bug reports discussion.

The installer keeps copies of changed saves in SRWar\migration_backups inside the game folder. Old models are removed from the active installation once saves no longer need them. The installer does not unsubscribe from Steam items. If you use those old vehicles in another republic without Frontline, keep their original model subscriptions.

[h2]Planned[/h2]
[list]
[*]More content (structures, military vehicles).
[*]A better thought-out system of military units.
[*]New scenarios: an oil crisis, insurgents, protracted wars.
[*]A military industry.
[*]A military research institute.
[*]World War II for Early Start.
[/list]

Idea: SAYONE. Inspired by Wargame: Red Dragon, made with the help of Claude (Anthropic). Sounds and music from Wargame: Red Dragon, © Eugen Systems.
If you'd like to help with the mod, send me a private message."
 
