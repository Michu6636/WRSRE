; SRWar historical eras (SPEC §5.2, src/eras.cpp).
; Each unit's years of service are in units.ini (years = from [to]). Here:
;   [nato_waves]  battle-group templates by unit class (as in units.ini class =), comma-separated;
;                 each slot takes a random NATO unit of that class in service in the game year,
;                 a slot with nothing in service stays empty (logged).
;   [exceptions]  allow = <unit ids>: in service whatever the year, in every scenario.
;   [scenario <id>]  allow = <unit ids>: the same, only in that scenario (now: intervention).

[nato_waves]
group  = Танк, Танк, БТР, Пехота, Пехота
group  = Танк, Танк, ПВО, БТР, Пехота
group  = Танк, Разведка, Разведка, Пехота, Пехота
group  = Танк, Разведка, Огн. поддержка, Пехота, ПВО
scout  = Вертолёт
bomber = Самолёт

[exceptions]

[scenario intervention]

; The NATO intervention (owner, 06.11): 8 waves, light vehicles with infantry first, then heavier.
; From wave 6 the offensive comes through several open NATO crossings (wave 8: three); with only one
; open, the wave there is half as big again. Riders sit in the wave's carriers and get out in a fight
; or in the sector they were sent to take.
[intervention_waves]
wave = Разведка, Разведка, БТР, БТР, Пехота, Пехота, Снабжение
wave = Разведка, Разведка, Огн. поддержка, БТР, БТР, БТР, Пехота, Пехота, Пехота
wave = Танк, Разведка, Огн. поддержка, БТР, БТР, БТР, Пехота, Пехота, Пехота, Снабжение
wave = Танк, Танк, Разведка, ПВО, БТР, БТР, БТР, Пехота, Пехота, Пехота
wave = Танк, Танк, Танк, Огн. поддержка, ПВО, БТР, БТР, БТР, Пехота, Пехота, Пехота, Снабжение
wave = Танк, Танк, Танк, Танк, Разведка, ПВО, БТР, БТР, БТР, БТР, Пехота, Пехота, Пехота, Пехота, Снабжение, Снабжение
wave = Танк, Танк, Танк, Танк, Танк, Огн. поддержка, ПВО, БТР, БТР, БТР, БТР, Пехота, Пехота, Пехота, Пехота, Снабжение
