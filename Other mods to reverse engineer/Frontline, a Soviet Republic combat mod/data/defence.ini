; «Оборона республики»: our SR buildings. tools/defence.ps1 builds them into the game's
; media_soviet/workshop_wip from models the player already has from the Steam Workshop
; (nothing of those mods is kept here): the source building's folder is copied, and in its
; building.ini the name, type and staff lines are replaced by ours.
;   source  = <workshop item>/<building folder>, or game/<building> for one of the game's own
;   name    = menu name
;   type    = SR building type line(s), separated by |
;   workers = staff that comes to work (the mod reads how many came)

[srwar_barracks]
source  = 2215572749/Barak
name    = Казарма
type    = $TYPE_CITYHALL
workers = 40

[srwar_hq_inf]
source  = 2215572749/Shtab
name    = Штаб пехоты
type    = $TYPE_CITYHALL
workers = 10

