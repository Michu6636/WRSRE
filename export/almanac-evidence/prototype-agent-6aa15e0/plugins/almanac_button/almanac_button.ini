; almanac_button - draws one extra backdrop tile beside the Economy & Trade
; row (the ninth slot). Draw only. It is not clickable and changes no native
; state, tax policy, save, or input.
;
; UTF-8, no BOM.
;
; DEFAULT OFF. Set enabled = 1 only for a supervised Windows test. With 0 the
; plugin declines at Init, the loader unloads it, and nothing is patched.
;
; Restoring: set enabled = 0 and restart the game. The plugin also restores
; the engine's original Draw import by itself if it faults during a draw.

[almanac_button]

enabled = 0
