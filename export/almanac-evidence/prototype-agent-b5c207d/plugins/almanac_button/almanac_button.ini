; almanac_button - draws one extra backdrop tile beside the Economy & Trade
; row (the ninth slot). It is not clickable and handles no input.
;
; This is NOT a change-free draw. The extra tile runs the engine's own
; C3D_PANEL2D::Draw, which can change shared UI state. See README.md in this
; folder for what is written, what is unverified, and what is still a
; Windows-test item.
;
; UTF-8, no BOM.
;
; DEFAULT OFF. Set enabled = 1 only for a supervised Windows test on a
; disposable copy of the game with a disposable save folder. With 0 the plugin
; declines at Init, the loader calls FreeLibrary on it, and nothing is patched.
;
; FAIL-STOP. If the rect pair cannot be read, written, or restored, or the extra
; Draw faults, the plugin logs a FAIL-STOP line and ends the game process. It does
; not try to repair the rect pair or the import slot. The log line is evidence
; only. Ending the process is what stops the game. See README.md for the
; Windows-side procedure that backs this up, and for the cases that are NOT
; fail-stops.
;
; Restoring after a normal test: set enabled = 0 and restart the game.
;
; If the log says RECT DIRTY, the saved rect pair could not be put back at
; 0x9BE2F0. The plugin ends the process and does not read the pair again. Treat
; that session as suspect.
;
; Faults in the engine's own draw of the eighth tile are not caught by this
; plugin. They propagate as they would without it.

[almanac_button]

enabled = 0
