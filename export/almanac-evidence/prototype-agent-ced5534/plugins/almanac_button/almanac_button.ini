; almanac_button - draws one extra backdrop tile beside the Economy & Trade
; row (the ninth slot). It is not clickable and handles no input.
;
; This is NOT a change-free draw. The extra tile runs the engine's own
; C3D_PANEL2D::Draw, which can change shared UI state. See README.md in this
; folder for what is written, what is unverified, and what is still a
; Windows-test item.
;
; UTF-8, no BOM.
;
; DEFAULT OFF. Set enabled = 1 only for a supervised Windows test. With 0 the
; plugin declines at Init, the loader calls FreeLibrary on it, and nothing is
; patched.
;
; Restoring: set enabled = 0 and restart the game. If the plugin's own code
; faults, or it cannot verify its draw target, it stops drawing and restores the
; engine's original Draw pointer, but only if that import still holds this
; plugin's detour. The log says what it found and what it did.
;
; If the log says RECT DIRTY, the plugin could not restore the rect store at
; 0x9BE2F0 after the ninth draw. Treat that session as suspect.
;
; Faults inside the engine's own Draw are not caught by this plugin.

[almanac_button]

enabled = 0
