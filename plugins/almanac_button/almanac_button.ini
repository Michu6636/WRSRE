; almanac_button - clickable ninth tile beside the Economy & Trade row.
; Draws one extra tile at the ninth slot (origin + 8 * pitch) and checks for
; a click on it (mouse over rect + click latch set, read-only). Clicking the
; ninth tile toggles a mod-owned Almanac open/close state; clicking another
; native row button closes the Almanac.
;
; This is NOT a change-free draw. The extra tile runs the engine's own
; C3D_PANEL2D::Draw, which can change shared UI state. See REPORT.md in
; export/almanac-evidence/almanac-button-own-icon-investigation/ for what is
; written, what is unverified, and what is still a Windows-test item.
;
; UTF-8, no BOM.
;
; DEFAULT ON. When this plugin is installed, the shipped setting enables the
; experimental draw hook on builds that pass its guards. Set enabled = 0 to opt
; out; Init then declines and nothing is patched. Existing INIs with 0 remain off.
; Use a disposable copy for any test; this is not a finished clickable Almanac
; button with its own icon (texture-icon ownership is unresolved).
;
; FAIL-STOP. If the rect pair cannot be read, written, or restored, or the extra
; Draw faults, the plugin logs a FAIL-STOP line and ends the game process. It does
; not try to repair the rect pair or the import slot. The log line is evidence
; only. Ending the process is what stops the game. See the plugin source header
; and README.md for the Windows-side procedure that backs this up, and for the
; cases that are NOT fail-stops.
;
; Restoring after a normal test: set enabled = 0 and restart the game.
;
; If the log says RECT DIRTY, the saved rect pair could not be put back at
; 0x9BE2F0. The plugin ends the process and does not read the pair again. Treat
; that session as suspect.
;
; Faults in the engine's own draw of the eighth tile are not caught by this
; plugin. They propagate as they would without it.
;
; Click detection requires GetMouseSolid to be resolved from C3DDLL64.dll. If it
; cannot be resolved, the plugin still arms but ninth-tile clicks are not
; detected. This does not affect the eight native buttons.

[almanac_button]

enabled = 1
