; almanac_button - draws one extra backdrop tile beside the Economy & Trade
; row (the ninth slot). It is not clickable and handles no input.
;
; This is NOT a change-free draw. The extra tile runs the engine's own
; C3D_PANEL2D::Draw, which can change shared UI state. See README.md in this
; folder for what is written, what is unverified, and what is still a
; Windows-test item.
;
; UTF-8, no BOM.
;
; DEFAULT OFF. Set enabled = 1 only for a supervised Windows test. With 0 the
; plugin declines at Init, the loader unloads it, and nothing is patched.
;
; Restoring: set enabled = 0 and restart the game. If the plugin faults during
; a draw it restores the engine's original Draw import itself, but only when it
; still owns that import slot; the log then says so.

[almanac_button]

enabled = 0
