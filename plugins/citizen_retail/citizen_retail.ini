; citizen_retail - the shop-sale loop. UTF-8, no BOM.
;
; Read by plugins\citizen_retail.dll. It walks every shop once every
; few hundred milliseconds, finds citizens with a servable demand, and
; either hands the sale to a higher plugin (the private sector) or
; charges the citizen and credits the state treasury.
;
; WHAT THIS PLUGIN DOES NOT DO
;
; It does not move goods. The base game's own shop tick moves goods from
; a shop's storage into the customer's consumed state; this plugin only
; charges money for what the base game already gave away. Refusing a
; charge does not put the goods back.
;
; The consequence is that a citizen who cannot afford anything still
; eats, still gets clothes, and still buys whatever their demands ask
; for - because the base game's shop tick does not check the wallet,
; and nothing this plugin does can make it. All this plugin can do is
; charge for what happened.

[citizen_retail]

; 0 unloads the plugin. Shops become free - the base game's own shop
; tick still moves the goods, but no money changes hands. Higher
; plugins that consume the retail service will fail to load.
enabled = 1

; One line per state sale, at most twenty per session, plus one line per
; save and per load. Enough to confirm the plugin is charging, not
; enough to flood the log. 0 = off.
probe = 1

; How often the shop walk runs, in milliseconds.
;
; The walk does not need to run every frame. A citizen standing in a
; shop for a second is caught by any of the four ticks that fall inside
; it. A larger value means less overhead and slightly more chance a
; citizen leaves the shop before being charged; a smaller value is the
; opposite.
;
;   50    every twentieth of a second. Very responsive, noticeable on
;         a heavily populated map.
;   250   the default. Four walks per second, no measurable cost.
;   1000  once a second. A citizen in a shop for a second or longer is
;         still caught; the cost of the walk is negligible.
tick_interval_ms = 250

; The minimum a sale can cost, in roubles. Anything the pricing service
; quotes below this is raised to it. Ensures a very cheap resource at a
; very small demand still produces a non-zero transaction, which is
; what keeps the flow observer and the monthly ledger meaningful.
min_cost = 0.01

; v4 USD scale (unified global currency in plugins\currency.ini): in USD
; mode min_cost divides by usd_divisor unless min_cost_usd is set (the
; _usd key wins over the divisor).
;   min_cost_usd = 0.03
usd_divisor = 50.0

; Which building types count as shops. A citizen inside one of these
; with a servable demand is charged; anywhere else, nothing happens.
;
;   3      $TYPE_SHOP       the base game's ordinary shop
;   10     $TYPE_HOTEL      a hotel - guests buy the room, not the goods
;   24     $TYPE_PUB        a pub - customers buy drinks from the $STORAGE
;
; The default is "3" - the base game's ordinary shop - which matches
; what the previous citizen_economy plugin walked. Adding "24" makes
; pub drinks cost money; adding "10" makes hotel guests pay for their
; stay. Both are safe to add at any time - no save format changes when
; the list grows.
;
; A type that is on the list but has no `$STORAGE` lines produces no
; sales, because there is nothing for the customer's demand to match.
shop_types = 3

; ---------------------------------------------------------------- v2.1 standard of living (Task 7)
;
; Wealth strata via the ABSOLUTE CPI survival basket & liquidity runway
; (docs/CPI_Survival_Basket_Investigation.md). The old relative P25/P75
; wallet percentiles are GONE - they structurally forced 25% of any
; republic into "Low" no matter how rich it was, making a 0% poverty rate
; mathematically impossible. Every citizen is now classified against ONE
; absolute number - the daily survival basket published by
; resource_pricing v5 (getCpiDailyBasket; food + meat + clothes + daily
; rent, priced live in the active currency):
;
;   runway = wallet / CPI     (days of survival)
;
;   Affluent  runway >= runway_affluent_days
;             meat x high_meat_mult, clothes x high_clothes_mult,
;             electronics x high_electronics_mult
;   Middle    runway in between -> baseline basket, untouched
;   Low       runway < runway_low_days (includes Destitute - under one
;             day of bread is runway ~0)
;             meat x low_meat_mult, clothes x low_clothes_mult,
;             electronics x low_electronics_mult (0.0 = none), and
;             - when happiness < escapism_happiness_threshold -
;             alcohol x low_alcohol_escapism_mult (poverty escapism)
;
; The destitute EVICTION stage lives in enterprise_base's rent pass
; (wallet < 1 day of bread at the next CollectResidentialRent) - this
; plugin only shapes demand. Scaling touches amountNeeded strictly once
; per citizen per absolute day, so values never compound across ticks.
;
; The old p25_default_rub / p75_default_rub keys are retired and no
; longer read. (The section name stays [standard_of_living] so existing
; INIs keep parsing for the multipliers below.)

[standard_of_living]

; 0 disables all scaling (charge the baseline basket for everyone).
sol_enabled = 1

; High-stratum luxury multipliers (runway >= runway_affluent_days).
high_meat_mult = 1.5
high_clothes_mult = 1.5
high_electronics_mult = 2.0

; Low-stratum staple multipliers (0.0 clamps that demand to zero).
low_meat_mult = 0.2
low_clothes_mult = 0.5
low_electronics_mult = 0.0

; Poverty escapism: unhappy low-runway citizens surge alcohol demand.
low_alcohol_escapism_mult = 1.8

; Happiness (person+0xE8, 0..1) below which the escapism surge fires.
escapism_happiness_threshold = 0.40

; Liquidity-runway tier thresholds, in DAYS of survival (wallet / CPI).
; Affluent at >= 30 days of basket; Low below 7 days; the band between
; is Middle (baseline, no write). 30/7 are the Master Design Doc S4.2
; defaults; raise the affluent bar to make luxury rarer, lower the low
; bar to make rationing rarer.
runway_affluent_days = 30.0
runway_low_days      = 7.0