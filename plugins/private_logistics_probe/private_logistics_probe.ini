; ---------------------------------------------------------------------------
; private_logistics_probe.ini - v0.2.3-exploratory (diagnostic probe)
;
; Enabled by default. When enabled, the probe consumes the sim_clock service
; and registers a SUB_TICK subscriber to capture read-only snapshots of ONE
; explicitly selected road DO truck:
;
;   - run/session id and observation sequence
;   - selected DO and vehicle identity (pointers)
;   - cargo resources/quantities
;   - candidate fuel-slot identity and quantity
;   - relevant raw state values (kind, state, mode, home depot)
;   - timestamp (sim day, time of day) and snapshot failures/gaps
;
; LABELLED AS EXPLORATORY TELEMETRY ONLY:
;   - NOT accumulated actual fuel burn
;   - NOT complete trip-boundary verification
;   - NOT trip-cost validation
;   - NO payments, no treasury API, no game-memory writes
;
; All .ini files in this project are UTF-8 WITHOUT BOM.
; ---------------------------------------------------------------------------

[private_logistics_probe]
; 0 = disabled (explicit opt-out). 1 = armed (default): subscribes to sim_clock ticks and
; captures read-only snapshots of one road DO truck.
enabled             = 1

; Ticks between selection/scan attempts (rate limit). 1..10000.
tick_interval       = 30

; Maximum snapshot records per session (bounded recording). 1..10000.
max_snapshots       = 1000

; Maximum queued snapshot records before drain (bounded queue). 16..4096.
max_queue           = 256

; 1 = run the labelled-synthetic accumulator exercise at Start (synth=1 records).
; 0 = off. Never enabled in a production session.
selftest            = 0

; One launch, one save. Full game exit before changing configuration.
; Enabled probe and dependencies remain pinned until process exit.
