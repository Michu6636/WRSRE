; taxes - the tax engine. UTF-8, no BOM.
;
; Read by plugins\taxes.dll. Three taxes, each with its own rate and
; its own calendar schedule. The schedules are independent: a VAT that
; settles monthly can coexist with a profit tax that settles quarterly
; and a property tax that settles yearly.
;
; If this plugin is not installed, enterprise_base treats it as "no
; tax": no VAT is charged on private-shop sales, no profit tax, no
; property tax. Removing the plugin is a valid way to run a game with
; no tax at all.

[taxes]

; 0 unloads the plugin. Any plugin that depends on the taxes service
; will then fail to load, which is the intended effect: a world with no
; tax but a consumer that expects one is not a supported configuration.
enabled = 1

; One line per settlement that actually moved money, in
; tesmioloader.log. A settlement that collected nothing logs nothing.
probe = 1

; ---------------------------------------------------------------- VAT
;
; VAT is applied on top of the retail price at a private shop. It is
; accrued the moment the sale is charged, and remitted at the schedule's
; boundary. A schedule of `instant` settles the moment a sale is
; charged - no liability is ever outstanding, and the treasury receives
; a steady drip rather than a monthly lump.

vat_rate     = 0.20
vat_schedule = monthly

; ---------------------------------------------------------------- profit tax
;
; Corporate profit tax. "Profit" is net revenue minus business costs,
; where net revenue is gross sales less VAT collected, and business
; costs are wholesale purchases, foreign imports, and wages. Capital
; expenditure (private construction) is not a deductible cost under
; this model.
;
; The period totals that feed this calculation - periodGrossSales,
; periodVatAccrued, periodWholesaleCosts, periodWagesPaid,
; periodForeignCosts - are cleared at the schedule's boundary, whether
; or not the period produced a profit.

profit_tax_rate     = 0.15
profit_tax_schedule = quarterly

; ---------------------------------------------------------------- property tax
;
; A flat per-enterprise charge. It is charged regardless of the
; enterprise's profitability, on the theory that land and buildings
; have value independent of what the business does with them.

property_tax_flat     = 250.0
property_tax_schedule = yearly

; ---------------------------------------------------------------- v4 USD scale
;
; Unified global currency (primary_currency in plugins\currency.ini).
; property_tax_flat above is RUB-denominated: in USD mode it divides by
; usd_divisor at startup unless property_tax_flat_usd is set (the _usd
; key wins over the divisor). Percentage rates need no scaling.
;   property_tax_flat_usd = 5.0
usd_divisor = 50.0

; ---------------------------------------------------------------- v2: fiscal policy
;
; Per-tax on/off switches. These are the STARTUP defaults; the City Hall
; panel (below) toggles them live for the session. A suspended tax stops
; NEW accrual immediately (retail sales charge no VAT, no profit is taxed)
; and does not settle while off; any liability accrued before the switch is
; held and settles when the tax is re-enabled.
vat_enabled         = 1
profit_tax_enabled  = 1
property_tax_enabled = 1

; Land-value property tax: scale the flat base by each building's
; environmental attractiveness (0..1, neutral 0.5 fallback):
;   Tax = property_tax_flat x (0.50 + 1.50 x attractiveness)
; so derelict industrial land pays ~0.5x and a park-adjacent villa up to ~2x
; the flat figure. 0 keeps the historic flat charge for every building.
property_land_value = 1

; ---------------------------------------------------------------- v3.2: City Hall widgets
;
; The Republic fiscal-policy dashboard, appended to the City Hall / Party HQ
; window (building type 39) via the ui_panels plugin. Requires ui_panels with
; its "cityhall" hook enabled (plugins\ui_panels.ini, enable = ...,cityhall).
;
; Collapsible (default collapsed): the panel opens as ONE row - a native
; SQUARE BUTTON tile (engine 9-patch chrome, hover highlight, gui_click
; audio, depressed while open) with "TAX" centered inside. Clicking it
; expands the full controls; clicking again collapses back to the single
; tile. When ui_panels is a v2 build, a text checkbox header is used
; instead (graceful fallback).
;
; Expanded, per tax: one rate slider (clean "Rate: 42%" / "Rate: 250.00 X"
; caption; the [-]/[+] bar is drawn by the exe at left+dpi*180) plus one
; status badge checkbox that always reads the LIVE state:
;   [X] VAT: Active      (green)  - the tax is levied;
;   [ ] VAT: Suspended   (grey)   - the tax is off.
;
; VAT and profit sliders map 0..100 to 0..50%; the property slider maps
; 0..100 to 0..property_slider_max flat units. Expanded, the dashboard
; text rows plus button + sliders + badges fill exactly 12 rows
; (= TSM_PANEL_MAX_ROWS). Without ui_panels widgets the read-only
; dashboard stays, uncollapsed.
;
; 0 removes the panel and the widgets.
city_hall_rows = 1

; Slider -/+ increment per click, in percent points (1..50, default 2).
; The legacy tune_step key is still accepted as step = fraction x 100.
tax_slider_step_pct = 2

; Property slider ceiling, in active-currency units (default 500).
property_slider_max = 500.0

; ---------------------------------------------------------------- Account Office (v4.2 macro readouts)
;
; macro_indicators (0/1): show the Accounting Office macro rows above the
; tax status rows in the City Hall window. 0 removes them entirely (the
; widget dashboard alone keeps its exact fit).
;
; The four rows are GROUND-TRUTH readouts (Task 7):
;   Cost of Living       the TRUE daily CPI survival basket -
;                        (Pfood x mult x 0.0020 t) + (Pmeat x mult x
;                        0.0006 t) + (Pclothes x mult x 0.0005 t) +
;                        real daily residential rent - priced live by
;                        resource_pricing v3 in the active currency.
;   Poverty Rate         share of citizen wallets under
;                        poverty_runway_days x the daily CPI - the SAME
;                        rationing threshold citizen_retail's Liquidity
;                        Runway classifies Low on, so the panel and the
;                        retail engine can never disagree about who is
;                        poor. A rich republic can now genuinely reach 0%.
;   Evictions (Mo)       successful relocations this month (the rent
;                        pass, including the destitute bread-day stage).
;   Commercial Solvency  share of private enterprises with positive
;                        capital, plus the investment-pool balance.
;
; Row budget with the widget dashboard expanded: 8 text + 6 widget = 14
; = TSM_PANEL_MAX_ROWS exact fit.
;
; v4.2 retires poverty_wallet_floor (the fixed 2.0 RUB wallet mark): the
; floor is now measured in DAYS of survival against the live CPI, so a
; hard-coded wallet figure would silently re-introduce the relative
; poverty trap this task removed. Old INIs carrying that key are simply
; ignored.
macro_indicators = 1

; poverty_runway_days: a citizen whose wallet holds fewer than this many
; days of the daily CPI basket counts as poor. 7 = the rationing
; threshold (citizen_retail's Low band); 14 = the Middle floor; 30 =
; counting the merely cautious as poor. 1..3650.
poverty_runway_days = 7