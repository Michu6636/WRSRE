; map_expander - scales the vanilla 20 km world limits to a larger map. UTF-8, no BOM.
;
; Pairs with a test map whose script.ini carries the SAME world size:
;   $WORLDSIZE 30000.000000 30000.000000
; The engine (terrain, camera clamp, save coordinates) follows $WORLDSIZE on
; its own; this plugin patches the six hardcoded .rdata floats in
; SOVIET64.exe that do not.

[map_expander]

; 0 unloads the plugin. The game then runs with vanilla 20 km limits, so a
; map whose script.ini says 30000 will misbehave (terrain 30 km, logic 20 km).
enabled = 1

; Desired world size in meters, one number for both axes.
; 20000.0 = vanilla (patch is a no-op but still verifies the constants).
; Values below 20000 are clamped back to 20000 with a warning.
; Above 40000 warns: projection far planes (25000/15000) and the camera Y
; clamp (4544) are NOT patched by this plugin.
world_size = 30000.0

; Before/after values for each of the six patched constants, in
; tesmioloader.log. 0 = off.
probe = 1
