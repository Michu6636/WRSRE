[republic_bank]
enabled=1
auto_overdraft_enabled=0

; Player-controlled annual nominal interest rate (0.00 .. 0.25). The City
; Hall slider maps its full 0..100 native range to 0..25%, in 1% steps.
annual_interest_rate=0.06

; Reference-RUB amounts at reference_cpi_rub, not fixed live nominal amounts.
; At runtime each is multiplied by:
;   active-currency CPI daily basket / reference_cpi_rub
; Thus rising prices raise the limits, falling prices lower them, and the CPI
; service's active-currency denomination also handles RUB/USD conversion.
max_debt_per_enterprise=100000
credit_limit=50000
cash_buffer_keep=1000

; Documented neutral resource_pricing basket: 2.15 RUB/day (the old shipped
; calibration; step 7 re-bases it). It is a reference constant, never a
; substitute for a missing live CPI.
reference_cpi_rub=2.15

; There is no usd_divisor and no neutral scale. When live CPI is unavailable
; the economic index is UNAVAILABLE and the bank refuses NEW credit until the
; basket can be priced again (economy direction D34). Existing loans keep the
; last scale that was actually derived from prices.

max_missed_months=3
