; citizen_labor - wages, employment and payday. UTF-8, no BOM.
;
; Read by plugins\citizen_labor.dll, which subscribes to sim_clock for the
; day boundary, uses currency for the actual movement of money, and
; publishes a service of its own for higher plugins (enterprise_base,
; private_shops, and the state ledger) to consume.
;
; There are no hooks in this plugin and no direct interaction with the
; game. Payroll runs once per in-game day, off sim_clock's own event.
;
; WHAT IT PAYS, AND WHEN
;
; Every citizen in a residential building is paid on their own payday
; cycle. The wage depends on where they work:
;
;   - if they have been seen at a workplace of a type the plugin
;     counts as a workplace, the daily rate resolves through the
;     Labor & Salary hierarchy:
;       workplace override -> [sector_wages] -> [wages] (legacy
;       fallback) -> default_daily_wage -> clamped UP to minimum_wage;
;   - if they are under student_age_max, they get student_stipend;
;   - if they are at or above retiree_age_min, they get
;     retiree_pension;
;   - otherwise they get unemployed_welfare.
;
; Transfers derive from minimum_wage when the *_ratio_to_min keys below
; are present; the legacy absolute values apply only as fallback.
;
; The building that counts as a workplace is any type between
; workplace_min and workplace_max, excluding any in workplace_exclude.
; The default range is 3..200 excluding 20 (customhouse) and 30
; (unknown), which matches what the old citizen_economy plugin did.

[citizen_labor]

; 0 unloads the plugin. Higher plugins that consume it will fail to
; load. The economy keeps running - the game's own wages do not exist
; to break - but no citizen earns anything through this service.
enabled = 1

; One line per payday cycle and per month transition, in
; tesmioloader.log. Also one line per wage entry at startup that differs
; from the default. 0 = off.
probe = 1

; --- in-window wage tuning (v4.1 native widgets) -----------------------------
;
; State-operated building windows gain two read-only text rows (via the
; ui_panels plugin): Status + Tune, plus two native clickable controls
; drawn by the exe itself in the same window:
;
;   Status row    Wage: X.XX [SYM] (Scope: Workplace / Sector)
;   wage slider   caption "Wage", 0..100 maps to minimum_wage ..
;                 minimum_wage + span (active-currency units), with native
;                 - / + buttons (wage_slider_step percent per click);
;                 sits at left + dpi*180 for clear [-] margin;
;   scope checkbox  [x] Apply to Whole Sector.
;
; Auto-expanding ceiling (no hard cap): span =
;   max(wage_slider_span_min, currentWage * 1.5)
; so the bar climbs with inflation instead of stopping at 12.50 RUB.
;
; Scope routing:
;   Workplace Only -> an override on THIS building, persisted by
;                     coordinates in tesmio_labor.dat across saves.
;   Whole Sector    -> the sector base wage ([sector_wages] above) for
;                     every building of the industry, runtime-only -
;                     it resets from this INI on the next world load.
;                     Any override on the inspected building is cleared
;                     so it inherits the sector rate.
;
; Both paths clamp up to minimum_wage. Private [P] buildings keep the
; enterprise_base wage rows instead - they are excluded from these.
;
; 0 removes the rows and the widgets.
in_window_rows = 1

; Slider span floor, in active-currency units (default 10.0). The live
; span is max(min, currentWage * 1.5). The legacy wage_adjust_step and
; wage_slider_span keys are still accepted as the min.
wage_slider_span_min = 10.0

; Slider -/+ increment per click, in percent points (1..50, default 2).
wage_slider_step = 2

; --- the wage table --------------------------------------------------------
;
; The daily rate for each building type, in roubles. A type with no entry
; uses default_daily_wage.
;
; The values below are the ones the previous citizen_economy plugin
; shipped with, so a game running the new architecture sees the same
; numbers it saw before. Every type in workplace_min..workplace_max is
; asked for a wage; listing one that is excluded or out of range is
; harmless (the entry is simply never read).
;
; Comments after a value are NOT supported - a value line must be just
; `type = number`.

default_daily_wage = 3.0

; --- statutory minimum wage (Labor & Salary Overhaul, M1) -----------------
;
; The legal daily floor. Every WAGE - workplace override, sector base,
; legacy [wages] type rate, global default - is clamped UP to this.
; In USD mode minimum_wage_usd wins when present; otherwise the floor is
; minimum_wage / usd_divisor. 0 or missing falls back to 2.50 RUB.
minimum_wage     = 2.50
minimum_wage_usd = 0.50

; --- social transfers as ratios of the minimum wage ----------------------
;
; When a ratio is >= 0: transfer = ratio x minimum_wage
;   welfare 0.40 x 2.50 = 1.00/day, stipend 0.60 x 2.50 = 1.50/day,
;   pension 0.80 x 2.50 = 2.00/day.
; Set a ratio to -1 to fall back to the legacy absolute values below
; (unemployed_welfare / student_stipend / retiree_pension). Transfers
; are deliberately NOT floored by minimum_wage - they are intended
; fractions of it. Only wages are floored.
welfare_ratio_to_min = 0.40
stipend_ratio_to_min = 0.60
pension_ratio_to_min = 0.80

; v4 USD scale (unified global currency). Wage/transfer figures above are
; RUB-denominated. In USD mode every effective figure divides by
; usd_divisor unless an explicit USD override exists:
;   usd_divisor                 RUB->USD divisor (default 50)
;   default_daily_wage_usd      explicit USD default (per day)
;   unemployed_welfare_usd      explicit USD welfare
;   student_stipend_usd         explicit USD stipend
;   retiree_pension_usd         explicit USD pension
;   [wages_usd]                 per-type USD overrides (same type numbers;
;                               when present, unlisted types use the USD
;                               default instead of a scaled RUB figure)
usd_divisor = 50.0
; Spec M1 USD figures (min 2.50 -> 0.50, default 3.00 -> 0.60) imply a
; factor of 5 for wages, not the treasury's 50 - so wage/transfer USD
; values are given explicitly instead of divided. minimum_wage_usd is
; up in the M1 block; this is the default wage's explicit USD twin.
default_daily_wage_usd = 0.60

; Non-wage transfers.
unemployed_welfare = 6.0
student_stipend    = 12.0
retiree_pension    = 18.0

; Age thresholds, in years. Read from the Person object at +0xD4.
student_age_max = 18.0
retiree_age_min = 60.0

; --- payday ---------------------------------------------------------------

; How often citizens are paid.
;
;   monthly   once per in-game month. The multiplier is the number of
;             days in the month, so the yearly wage does not depend on
;             how long a month is.
;   weekly    once per seven in-game days.
;   daily     every in-game day.
;
; The base game's own wage concept is per-day, so all three pay the same
; total over a year. Monthly is what the old plugin shipped with.
payday_frequency = monthly

; When 1, a wage is multiplied by the ratio of the citizen's actual
; shifts this month to twenty. A citizen who worked full time every day
; gets 1.25x (capped); a citizen who worked almost none gets 0.20x
; (floored). When 0, the wage is paid in full regardless of attendance.
;
; Only meaningful for the employed - an unemployed citizen's welfare has
; no shift count to scale by.
scale_pay_by_shifts = 1

; When 0 (the default), a citizen who has never been paid is treated as
; having been paid this cycle, so their first wage arrives on the next
; scheduled payday. When 1, they are paid the first time the payroll
; loop sees them.
;
; Setting 1 restores the behaviour of the old citizen_economy plugin,
; which is a large influx of cash when a save with many citizens is
; loaded mid-cycle. Leave it at 0 unless you want that.
pay_on_first_sight = 0

; Idle days before an employment record unseen in either daily pass
; (workplace walk or residential payroll) is evicted on the month
; boundary and skipped at save. Payroll state (last pay day, shifts)
; is untouched - this only bounds dead/emigrated IDs.
; 90 days = one fiscal quarter at the monthly payday default.
; 0 = disabled (unbounded, legacy behaviour).
prune_after_days = 90

; Idle days after which a citizen's employment record is cleared because
; they have not been seen at any workplace. The engine's worker vector
; (bld+0xBC0) contains only citizens physically on shift today, so a
; worker on a short rotation, sick leave, or holiday will legitimately be
; absent for several days. 14 days covers normal absences; lower it for a
; faster unemployment response, raise it for slower.
;
; 0 disables the grace-period check entirely. Records are still cleared
; when their workplace is demolished, decayed, or unreadable, so 0 is not
; recommended outside debugging.
employment_grace_days = 14

; --- workplace detection ---------------------------------------------------
;
; A building is a workplace if its type number is between workplace_min
; and workplace_max and not in workplace_exclude.
;
; The default range matches what the old plugin used: every workplace
; type the base game defines except for the customhouse (20) and the
; engine's unknown-type default (30), both of which carry a different
; people-vector layout.

workplace_min     = 3
workplace_max     = 200
workplace_exclude = 5,20,30,43

; --- the per-type wages ----------------------------------------------------
;
; Every type listed here overrides default_daily_wage for that building
; type. A type with no entry uses the default. The list is what a wage
; HUD reads to show "unskilled: 28 / day, factory worker: 32 / day".

[wages]
3   = 3.0      ; shop
4   = 3.0
6   = 3.2      ; factory
7   = 3.4      ; mine
8   = 3.0
17  = 3.4
18  = 3.2
19  = 3.2
21  = 3.0
22  = 3.0
23  = 3.0      ; pub
24  = 2.8
25  = 3.0
27  = 2.8
70  = 3.0
92  = 3.0

; --- industry sector base wages (Labor & Salary Overhaul, M1) -------------
;
; Six canonical sectors. A building type's sector comes from the static
; map in citizen_labor.cpp (numbers per SOVIETInstructions.txt: mine 7 =
; heavy, factory 6 = light, shop 3 = services, field/farm 8,9 = agri,
; powerplant 17/70 = infrastructure, hospital 25/school 4 = care, ...).
;
; When an entry is > 0 it OVERRIDES the [wages] table for every member
; type; delete it or set it to 0 to fall back to [wages]/default.
; Unmapped types (living 2, unknown 30) always use default_daily_wage.
; Optional [sector_wages_usd] supplies explicit USD bases; otherwise
; USD mode divides these RUB bases by usd_divisor.
[sector_wages]
heavy_industry       = 3.80   ; mining + heavy plants
infrastructure       = 3.50   ; energy, transport, storage, construction
healthcare_education = 3.20   ; hospitals, schools, universities, nurseries
light_industry       = 3.00   ; factories, production lines
services_retail      = 2.80   ; shops, pubs, culture, hospitality, civic
agriculture          = 2.60   ; fields, farms

; Explicit USD bases for the same six sectors (M1 spec factor of 5:
; 3.80 RUB -> 0.76 USD, ... 2.60 -> 0.52). Without these, USD mode would
; divide the RUB bases by usd_divisor 50, dropping every sector under
; the 0.50 USD floor and collapsing the hierarchy. Delete this section
; to fall back to divisor-based values.
[sector_wages_usd]
heavy_industry       = 0.76
infrastructure       = 0.70
healthcare_education = 0.64
light_industry       = 0.60
services_retail      = 0.56
agriculture          = 0.52
