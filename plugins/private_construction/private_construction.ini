; private_construction - autonomous private-sector building. UTF-8, no BOM.
;
; A building tagged private is built by private capital, drawn from the
; enterprise_base investment pool. The cost comes out of the pool as the
; site advances; when the pool runs dry, the site stalls.
;
; ---------------------------------------------------------------------
; HOW A COST IS DECIDED (v3.5.0)
; ---------------------------------------------------------------------
;
; Three sources exist. The plugin never estimates by itself - each
; source reads a number the game has already computed:
;
;   native   READS THE GAME'S OWN CONSTRUCTION PHASES. Every building
;            type stores its full material list and workdays on its
;            type descriptor (building+0x318 -> phases at +0x370), the
;            same data the construction panel prints. Every material is
;            priced through resource_pricing at today's market, times
;            the record's import buy multiplier (apply_buy_mult), plus
;            labour at contractor_wage_per_day, then the usual
;            cost_multiplier / contractor_markup / minimum_cost knobs.
;            No panel, no text, no language - a private site prices on
;            the tick it is tagged, in any UI language and in realistic
;            mode.
;
;   fund     THE PAY-WITH-RUBLES-OR-DOLLARS OPTION. Reads the exact
;            number the game prints in its own "Fund construction using
;            rubles / dollars" row. Perfect match by construction - it
;            is the same number the game would charge. No arithmetic at
;            all. Needs the panel opened once.
;
;   panel    THE MATERIALS AND WORKDAYS FALLBACK. Reads the material
;            quantities and workday total off the game's construction
;            panel ("Resources needed to finish entire construction"),
;            prices them through resource_pricing, labour at
;            contractor_wage_per_day. Needs the panel opened once.
;
;   auto     native, then fund, then panel. Recommended.
;
; ---------------------------------------------------------------------
; WHEN A SITE STILL WAITS FOR ITS PANEL
; ---------------------------------------------------------------------
;
; With native pricing (the normal case) a site never needs its panel
; opened - it prices on the tick it is tagged. The panel rule below
; only still applies when:
;
;   - the native layout probe failed at boot (one WARN line in the
;     log), so native is disabled for the session, or
;   - cost_source = fund or panel, or
;   - the type has no phases: length-dependent infrastructure (roads,
;     rails, pipes, wires) is not supported natively.
;
; A waiting site is harmless: it does not advance and does not drain
; the pool until it has a price.
;
; The capture is refreshed every frame the panel is open. Quantities
; change as the site advances through phases, so keeping the panel open
; briefly refreshes the figure.
;
; ---------------------------------------------------------------------
; A NOTE ON "LAST PANEL WINS" (fund/panel only)
; ---------------------------------------------------------------------
;
; The panel and fund sources share one cache: the last construction
; panel you looked at. If you open panel A, then panel B, then tag A as
; [P] with cost_source = fund/panel, the plugin will price A from B's
; numbers. native never reads that cache, so `auto` avoids the race for
; every phase-backed building.
;
; ---------------------------------------------------------------------
; CALIBRATION (probe = 1)
; ---------------------------------------------------------------------
;
; When a site is first priced, the log shows where the number came
; from, and - if both native and a fund/panel capture exist for the
; same site - a [COST] line with both totals and their ratio, so one
; session says how closely native tracks the game's own figures.

[private_construction]

; 0 unloads the plugin.
enabled = 1

; One line per site claimed, per site waiting, per site finished, per
; site stalled, and one periodic progress line per site every fifteen
; seconds.
probe = 1

; Whether to draw the construction card via ui_overlay.
show_overlay = 1

; How often the pass runs.
tick_interval_ms = 250

; How much progress the private contractor advances per in-game day.
daily_build_rate = 0.03

; The most progress one tick may commit, as a fraction of the whole
; building.
;
; The engine attaches a building's finished mesh - and drops its
; construction-phase meshes - when it observes building+0x604 cross
; 1.0, and it needs the frames around the crossing to do it. A
; fast-forward step large enough to carry a site across 1.0 inside a
; single tick hands the engine an already-finished float with no frame
; in which it saw the transition, and the final mesh can fail to
; attach: a finished, functional, invisible building.
;
; 0.02 caps one tick at 2% and is far above the normal rate (0.03/day
; at 60 s/day is ~0.0001 per 250 ms tick), so 1x play is unchanged and
; only extreme fast-forward is bounded. Lower it for a more generous
; margin; 0 disables the clamp entirely.
max_tick_advance = 0.02

; One extra log line on the tick a claimed site's progress reaches 1.0,
; carrying the step size, the day delta that produced it, the node
; pointer, the bbox pointer and the demolished flag, so a session in
; which a completed building goes invisible says why.
probe_completion = 1

; ---------------------------------------------------------------- finish handoff
;
; WHERE THE INVISIBLE-BUILDING BUG ACTUALLY IS
;
; The engine runs a building's completion side-effects - it attaches the
; finished mesh, sets the bounding box the renderer culls on, and clears
; the construction-phase decals - when its OWN construction advances the
; site across building+0x604 = 1.0. When this plugin advances a site
; itself, by writing that float, the engine does NOT run those steps: the
; building is finished, functional and INVISIBLE, with its construction
; floor decals still drawn. Bounding the size of the step does not help -
; a 0.0003 crossing finishes invisible just the same.
;
; The fix is to stop this plugin just short of 1.0 and let the engine
; take the last step. In a normal game with domestic construction on, the
; state's builders do exactly that and the building appears correctly.
;
; finish_handoff_frac   the fraction the plugin will not cross. 0.99
;                       leaves the last percent to the engine. 0 disables
;                       the handoff and restores the old behaviour (the
;                       plugin finishes the site itself, invisible risk
;                       included).
; handoff_timeout_days  how long a site may sit at the handoff ceiling
;                       WITHOUT ENGINE PROGRESS before the plugin gives up
;                       waiting and finishes it itself. v3.4.4: any forward
;                       motion of the progress float resets the clock, so
;                       this is a stall timeout, not a wall timeout.
;                       0 (v3.5.1 default, RECOMMENDED) waits forever: the
;                       private company funds and builds to 99%, then the
;                       site sits "AWAITING STATE INSPECTION" until a
;                       domestic Construction Office delivers the final
;                       workers - the State Acceptance Commission handing
;                       over the keys. A plugin-forced finish is invisible
;                       (no mesh, no bbox, decals stuck), so never let the
;                       timeout fire: keep domestic construction on and
;                       give it a CO that can reach the site. Set > 0 only
;                       as a last resort on maps with no domestic
;                       construction at all.

finish_handoff_frac = 0.99
handoff_timeout_days = 0

; ---------------------------------------------------------------- cost source
;
; One of: native | auto | fund | panel.
;
;   native   phase data only - never needs a panel, fails (site waits)
;            for types without phases (roads, rails, pipes, wires).
;   auto     native, then fund, then panel. Recommended.
;   fund     the game's own fund-row number only. Needs the panel once.
;   panel    the panel's materials block only. Needs the panel once.
;
; apply_buy_mult also applies to native pricing only: 1 multiplies each
; material's price by the resource record's import buy multiplier - what
; the border actually charges; 0 prices at the raw market price like the
; panel source does.

cost_source = auto
apply_buy_mult = 1

; ---------------------------------------------------------------- currency
;
; Which figure off the panel's "Fund construction using rubles / dollars"
; row is accepted as a site's cost. This selects the ROW LEG; the value
; charged is always converted to the pool's unit.
;
; v4 unified global currency (primary_currency in plugins\currency.ini):
; the investment pool is held in the ACTIVE currency. In USD mode the
; dollar figure is the pool unit directly and a ruble figure is divided
; by usd_to_rub; in RUB mode the ruble figure is direct and a dollar
; figure is divided by usd_to_rub as well (usd_to_rub = roubles per
; dollar).
;
;   rub      accept only the ruble figure (converted to the pool's unit).
;            A panel showing only dollars leaves the site waiting; one
;            WARN line in the log says so.
;   usd      accept only the dollar figure (converted if the pool is RUB).
;   either   prefer the ruble figure; fall back to the dollar figure.
accept_currency = rub
; ---------------------------------------------------------------- currency
;
; How many roubles one dollar is worth. Used only when the game's fund
; row shows the dollars figure instead of the roubles one, because the
; plugin's investment pool is rouble-denominated and the dollar figure
; has to be brought across. Historically the in-game rate has run
; between about 60 and 100 roubles to the dollar.
;
; Ignored when the game shows the roubles figure.

usd_to_rub = 60.0

; ---------------------------------------------------------------- labour and materials
;
; Used by the `native` and `panel` sources. The `fund` source takes its
; number whole from the game and ignores all three of these.

; The labour cost per workday, in roubles.
contractor_wage_per_day = 3.0

; A multiplier on the final total - materials plus labour.
cost_multiplier = 1.0

; A further multiplier - the contractor's margin.
contractor_markup = 1.00

; v4: contractor overhead multiplier for the labor-driven workday rate
; (heavy equipment, cranes, contractor overhead). The workday rate is
; citizen_labor's effective default wage x this value; default 2.50.
contractor_overhead_mult = 2.50

; Contractor workday billing rate when operating in USD mode (default = 13.30).
; In vanilla WRSR, funding with Western Dollars simulates hiring Western
; contractors and heavy equipment across the border, charging the turnkey
; rate of ~$13.30 USD/workday instead of domestic Soviet citizen wages.
contractor_wage_per_day_usd = 13.30

; Floor on a site's total cost.
minimum_cost = 500.0

; ---------------------------------------------------------------- v4 USD scale
;
; Unified global currency (primary_currency in plugins\currency.ini).
; When the active currency is USD, native and panel pricing take the
; game's native USD material prices (+0x5C, +0xAC buy multiplier) and
; scale the RUB figures above by usd_divisor. An explicit *_usd key
; always wins over the divisor:
;   contractor_wage_per_day_usd   USD labour per workday
;   minimum_cost_usd              USD floor on a site's total
usd_divisor = 50.0
; contractor_wage_per_day_usd = 0.06
; minimum_cost_usd = 10.0

; ---------------------------------------------------------------- exclusions
;
; Building types that are never private-constructed.
exclude_types = 0,1,20,30

; ---------------------------------------------------------------- panel-builder hook (v3.4 socket)
;
; The three keys below replace text scraping with a direct binding.
; They are EMPTY by default and the plugin runs fine without them: it
; falls back to the v3.3.4 stack scan, which works on an English
; client and is what has been running so far.
;
; WHAT THE HOOK DOES
;
; An inline hook on the construction panel's builder function reads the
; building straight out of the window argument (window+0x240), so every
; row printed while that builder runs resolves to the right building
; with no language-dependent trigger phrase and no stack scan. It also
; closes the "last panel wins" race: with the stack scan, opening panel
; A then panel B then tagging A [P] can bind A to B's captured price.
;
; HOW TO FILL THEM IN
;
;   panel_builder_rva    the RVA of the builder function's FIRST byte.
;                        Not an address inside it. The runtime probe
;                        line
;                          [ENTIRE_PRINT] caller SOVIET64.exe + 0x785837
;                        is a return address inside the caller, i.e. an
;                        anchor to start from, not the answer.
;                        `python tools/pe/pdata.py SOVIET64.exe 0x785837`
;                        resolves it to the containing function's real
;                        start and end via the PE exception directory.
;
;   panel_builder_expect the first N bytes of that function, hex,
;                        space-separated. Max 32.
;
;   panel_builder_stolen N. Must be >= 14, must be <= the number of
;                        bytes given in panel_builder_expect, and must
;                        end on an instruction boundary.
;
; THE RULE THAT IS EASY TO MISS
;
; The stolen bytes are COPIED TO A TRAMPOLINE AND EXECUTED THERE, so
; they must be POSITION-INDEPENDENT. Register-only frame setup (mov
; rax,rsp / push rbp,rsi,rdi / push r12..r15 / lea rbp,[rax-imm]) is
; fine. Anything with a [rip+disp32] operand is not: at its new address
; it computes a different address.
;
; In particular, DO NOT hook a /GS function. Its prologue ends with the
; __security_cookie load `48 8B 05 <disp32>`, and docs/07-pitfalls.md
; calls that shape "the common case, not a curiosity". Stealing 14
; bytes cuts the load in half; stealing 20 relocates it. Both crash.
; The shape to refuse looks like this - it is the real 0x7C20 prologue
; that crashed every save:
;
;   48 89 5C 24 08  57  48 81 EC 30 03 00 00  48 8B 05 ...
;   mov [rsp+8],rbx push rdi sub rsp,0x330    mov rax,[rip+...]
;
; If the builder turns out to be a /GS function, leave these keys empty
; and ask for the call-patch route instead (the technique already used
; by plugins/deposits PatchWorldSaveCall and plugins/cities PatchCall);
; it needs a small code change here, not an ini change.
;
; Two prologues from working hooks on this exact game version, both
; safe, as a reference for what "safe" looks like:
;
;   depletion, mine panel        21 bytes
;     48 8B C4 55 56 57 41 54 41 55 41 56 41 57 48 8D A8 F8 F4 FF FF
;   accumulator, electric panel  14 bytes
;     4C 8B DC 55 56 41 54 49 8D AB A8 FE FF FF
;
; IF THE EXPECT BYTES ARE WRONG
;
; The loader logs the bytes it actually found:
;
;   hook FAILED  private_construction panel builder prologue mismatch ...
;                found: 48 8B C4 55 56 ...
;
; Copy them out of the log rather than re-deriving them. A mismatch is
; declined, not forced - the plugin keeps the stack-scan fallback.
;
; FORWARDING CAVEAT
;
; The detour forwards four arguments. A builder that reads a fifth must
; not use this hook.

panel_builder_rva    = 0x7838E0
panel_builder_expect = 48 8B C4 55 56 57 41 54 41 55 41 56 41 57
panel_builder_stolen = 14