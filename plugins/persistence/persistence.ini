; persistence - the save/load event service. UTF-8, no BOM.
;
; Every plugin that has state to persist subscribes to this one. It owns
; the four CRT opener hooks the whole project uses, the atomic write and
; whole-file read helpers, and the save-directory resolver. There is
; nothing about what a plugin saves in this file - only what "a save"
; looks like to the game.
;
; If this plugin is not installed, currency and every future
; persistence-using plugin will run in memory-only mode. That is a
; supported configuration - the game plays normally, the state simply
; does not survive a save/load - and it is logged clearly so the state
; loss is never mistaken for a bug.

[persistence]

; 0 unloads the plugin. Dependent plugins keep running but log a warning
; on Start and lose their state on every load.
enabled = 1

; One line per save and per load, before any handler runs, in
; tesmioloader.log. This is the fastest way to confirm the plugin is
; alive after a game update that might have moved a file name or an
; opener. 0 = off.
probe = 1

; Which file the game opens for WRITE when a save is being written.
;
; The default is what the game's save code opens first, and it has been
; stable across every build this project has targeted. It is a setting
; rather than a constant so that a future patch which renames or
; reorders the save files can be accommodated without a rebuild.
;
; The path must end with "<sep><this file>" and be inside a folder named
; "save" for the event to fire. A name that does not match anything is
; silent - no save events fire, and every dependent plugin's state is
; lost on save without further warning.
write_trigger = stats.ini

; Which file the game opens for READ when a world is being loaded.
;
; Changed from header.bin to workers.bin to avoid firing on menu previews.
read_trigger = workers.bin