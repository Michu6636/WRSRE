; sim_clock - the calendar and tick dispatch service. UTF-8, no BOM.
;
; Every other plugin in this project consumes this one for its calendar
; and its tick. It is the only plugin that hooks C3D_TIMER::PowerTime and
; the only one that reads the game's own day and year fields. If it does
; not load, nothing above Level 0 does.
;
; There is nothing here that most users will want to change.

[sim_clock]

; 0 unloads the plugin. Every dependent plugin will then fail to load,
; which is the intended effect - running the Level 1+ set without a
; calendar service is not a supported configuration.
enabled = 1

; How many in-game days make one "month".
;
; The game has no month concept of its own: the calendar is a day of the
; year, 0..364, and an absolute year. Every plugin that wants to talk
; about months - tax periods, monthly reports, the day-per-month
; arithmetic in the treasury ledger - needs the same answer, so the
; answer lives here rather than in each of them.
;
;   30    the traditional choice. Twelve months of thirty days, and the
;         last few days of the year are treated as part of month 12.
;   28    a shorter month cycle, more paydays per year.
;   365   one month per year - useful for testing, or for a scenario
;         where "monthly" is really "annual" and "quarterly" is
;         meaningless.
;
; This is a calendar setting, not a scheduling one. A plugin's own
; `tax_schedule = monthly` reads whatever this value says a month is;
; nothing else in the codebase defines the length of one.
days_per_month = 30

; One line per pause transition, and per calendar reset (which is what a
; world load looks like to sim_clock). 0 = off.
;
; The pause lines are the fastest way to confirm the plugin is alive
; after an update that might have moved the day tick.
probe = 1