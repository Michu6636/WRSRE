; private_shops - private service fees. UTF-8, no BOM.
;
; Level 3. This plugin charges a private pub, hotel, cinema, hospital,
; church or other service building for the customers who walk in.
;
; WHAT THIS PLUGIN DOES NOT DO
;
; Retail checkout, wage payment, VAT accrual and capital accounting all
; live in enterprise_base, which owns them through two interceptors
; that fire from citizen_labor and citizen_retail. This file has no
; `markup`, no `wage_bonus` and no `tax` section for that reason.
;
; Since economy-direction step 3 (2026-11-22) this plugin also does NOT
; bill deliveries and does NOT buy stock from abroad. Goods delivered to
; a private building are settled once, company-to-company, by
; private_logistics at the native price (D16/D19). Charging a second
; 0.70 delivery bill here would settle the same goods twice. Foreign
; restocking wrote shelf contents directly, which teleported goods, so
; it is gone as well. The old `restock_types`, `wholesale_ratio` and
; `foreign_restock_*` keys are ignored if an older INI still has them.
;
; What is left is one loop:
;
;   Service fees. A pub, cinema, hospital, church or any other private
;   service charges a customer inside once per in-game day. What makes
;   someone a customer is described under service_fees.
;
; ONE-SHOT DIAGNOSTIC
;
; On the first tick after a world is loaded, every private, finished
; building is logged with its type, object name, custom name and
; whether it is a service or retail type. This is how a Workshop
; building's actual type number is discovered; a modded pub is not
; necessarily building type 24, and the base-game pub is not the only
; type that carries customers.

[private_shops]

; 0 unloads the plugin. Private buildings keep whatever stock they have
; and customers keep buying through enterprise_base's own interceptor,
; but no service charge is levied.
enabled = 1

; One line per service charge that collected money, and the one-shot
; private-building list on world load.
probe = 1

; How often the shop tick runs, in milliseconds.
tick_interval_ms = 300

; ---------------------------------------------------------------- retail set
;
; v2.9: building types whose customer sales are RETAIL. A type counts as
; retail when it is 3, is on THIS list, or has a service fee.
;
; v3.6: state procurement of private output is removed (see below), so
; this list no longer changes any money. It only labels buildings
; `[retail]` in the one-shot diagnostic dump.
;
; The default covers the service-building set: 3 shop, 4 church/modded
; shop, 10 hotel, 23/24 pub, 25 cinema, 26 sports hall, 28 hospital.
; Add any Workshop retail type that is not 3. The word `none` empties
; the list - type 3 is retail regardless, and a service fee always marks
; its type retail.

retail_types = 3,4,10,23,24,25,26,28

; v3.6 (2026-11-22): NO STATE PROCUREMENT. procurement_price_mult and
; procurement_flag_fallback were removed and are ignored if present.
; Goods are settled company-to-company by private_logistics.

; ---------------------------------------------------------------- service fees
;
; A per-visit charge for private service buildings. Format:
;
;   service_fees = <type>:<kind>:<fee>[, <type>:<kind>:<fee>]...
;
;   type    building type number. The one-shot diagnostic logs this
;           for every private building on the map.
;   kind    which citizen demand counts as "a customer", or the word
;           `any`. The base game gives a citizen exactly one of these
;           when they want a service:
;
;             1    food       (a restaurant or canteen)
;             2    meat       (a butcher, if a private one exists)
;             3    alcohol    (a pub)
;             4    religion   (a church)
;             5    culture    (a cinema, a theatre)
;             6    sport      (a sports hall)
;             10   health     (a hospital, a clinic, a doctor's office)
;
;           `any` charges every non-foreign, non-tourist citizen
;           physically inside the building once per in-game day,
;           regardless of their demands. Use it for a service whose
;           demand kind is not on the list, or for one where the
;           demand may have already been satisfied before the tick.
;   fee     roubles charged per citizen per in-game day. The charge is
;           split: the shop's capital is credited the net figure, the
;           taxes plugin is accrued VAT on the gross.
;
;           v4 USD scale (unified global currency): an optional 4th field
;           supplies the USD fee directly - `type:kind:fee:fee_usd`.
;           Without it, USD mode divides `fee` by usd_divisor below.
;
; A citizen who walks in, out and back in again the same day is
; charged once. The marker is saved with the world, so a save/reload
; mid-day does not double-charge.
;
; The default is the base game's pub at 5 roubles, which is what the
; old `pub_types = 24` / `pub_drink_price = 5.0` pair used to mean.
;
; Both 23 and 24 are listed. On save "Test 1" the base-game pub reads
; type 23 at runtime (see the type note under service_fees); 24 is kept so
; that a map where the pub really is 24 keeps working. A type with no
; buildings simply never matches - FeeForType is a linear scan over a
; two-entry array.
;
; RunServiceCharge does not need storages: it walks the people-inside
; vector at building+0xBD8. A building with no storage vector at all
; still charges, as long as it is private, finished, and its type is
; listed here.

service_fees = 23:3:3.5, 24:3:3.5

; v4: RUB->USD divisor for service_fees entries without an explicit
; :fee_usd field (default 50, ~era exchange range). Ignored in RUB mode.
usd_divisor = 50.0

; ---------------------------------------------------------------- legacy keys
;
; The previous version's `pub_types` and `pub_drink_price` keys are
; still read *only when* `service_fees` is empty above; they are then
; expanded into alcohol-kind service fees. Leave service_fees set and
; these keys have no effect. They are documented here only so a
; migration from an older ini does not silently change behaviour.

; pub_types = 24
; pub_drink_price = 5.0
