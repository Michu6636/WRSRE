; private_shops - private-sector restocking and pub service. UTF-8, no BOM.
;
; Level 3. The one plugin whose entire job is the autonomous behaviour
; of the private economy, independent of whether the state is watching.
;
; WHAT THIS PLUGIN DOES NOT DO
;
; Retail checkout, wage payment, VAT accrual and capital accounting all
; live in enterprise_base, which owns them through two interceptors
; that fire from citizen_labor and citizen_retail. This file has no
; `markup`, no `wage_bonus` and no `tax` section for that reason.
;
; What is left, and what this plugin owns, is three loops:
;
;   1. Foreign restocking. When a private building's storage falls below
;      a threshold, buy the deficit from abroad. The money leaves the
;      republic; the state treasury is not credited.
;
;   2. Wholesale delivery billing. When the state delivers stock, the
;      building pays for it at a fraction of retail, and the treasury
;      is credited.
;
;   3. Service fees. A pub, cinema, hospital, church or any other
;      private service charges a customer inside once per in-game day.
;      What makes someone a customer is described under service_fees.
;
; ONE-SHOT DIAGNOSTIC
;
; On the first tick after a world is loaded, every private, finished
; building is logged with its type, object name, custom name and
; whether either list currently applies to it. This is how a Workshop
; building's actual type number is discovered; a modded pub is not
; necessarily building type 24, and the base-game pub is not the only
; type that carries customers.

[private_shops]

; 0 unloads the plugin. Private buildings keep whatever stock they have
; and customers keep buying through enterprise_base's own interceptor,
; but no new stock arrives from abroad and no service charge is levied.
enabled = 1

; One line per restocking event, per service charge that collected
; money, and the one-shot private-building list on world load.
probe = 1

; How often the shop tick runs, in milliseconds.
tick_interval_ms = 300

; ---------------------------------------------------------------- restocking
;
; A private, finished building whose type is in this list is walked for
; storages; each storage that sits below its threshold gets restocked
; from abroad, and each delivery that arrives from the state is billed.
;
; Accepts a comma-separated list of building type numbers, or the word
; `all` (every private, finished building is walked; buildings with no
; storages simply do nothing) or `none`.
;
; The default is the base game's shop (3) and pub (24), which is what
; the previous versions assumed. A Workshop building with a different
; type number - or any service building that happens to have stock -
; needs its own entry or the `all` keyword.
;
; TYPE 23 (added). The one-shot diagnostic on save "Test 1" read the
; typedesc of the building whose object name is "pub" and got 23, not
; 24:
;
;   private_shops    type 23    obj "pub"  name "Dover Pub 2 [P]"
;
; 24 is kept alongside it. Listing a type that no building on the map
; uses costs one integer compare per building per tick and nothing
; else, so there is no reason to drop the old number - and dropping it
; would break any map where a pub really is 24.

restock_types = all

; ---------------------------------------------------------------- retail set
;
; v2.9: building types whose customer sales are RETAIL - they are never
; read as state procurement dispatch. A type counts as retail when it is
; 3, is on THIS list, has a service fee, or (when restock_types is a
; list rather than `all`) is on the restock list. Under `restock_types =
; all` the restock-list clause is disabled, so this list is what keeps a
; non-3 retail building (a hotel, a Workshop shop on a non-3 type, a pub
; with its fees cleared) from being paid twice for one sale: once by the
; retail interceptor when the customer buys, once by the treasury when
; the stock leaves.
;
; The default covers the service-building set: 3 shop, 4 church/modded
; shop, 10 hotel, 23/24 pub, 25 cinema, 26 sports hall, 28 hospital.
; Add any Workshop retail type that is not 3. The word `none` empties
; the list - type 3 is retail regardless, and a service fee always marks
; its type retail.

retail_types = 3,4,10,23,24,25,26,28

; ---------------------------------------------------------------- wholesale
; Physical deliveries are billed in full even if capital becomes negative.
; Insufficient funds must never remove goods already unloaded by a vehicle.
; This delivery-debt policy is independent of enterprise_base allow_debt
; (which gates other business activities).
;
; When the state delivers stock to a private building, the building pays
; for it at this fraction of the state retail price. 0.70 gives the
; private sector a 30% discount on retail, which combined with
; enterprise_base's `default_markup = 1.30` gives the shop a gross
; margin of 0.60 per unit.

wholesale_ratio = 0.70

; v2.8: when a NON-retail private building (factory, mine, farm - anything
; that is not type 3, a restock type, or a service-fee type) loses stock
; from an EXPORT storage between walks, the state procures that dispatched
; output at this fraction of the live retail price. Treasury pays, the
; enterprise is credited TSM_CAP_PRODUCTION (counts as revenue for the
; siphon and profit tax).
; v2.9: export storages only. Stock leaving an IMPORT or FUEL storage is
; the building consuming its own inputs - it is never credited.
procurement_price_mult = 0.90

; ---------------------------------------------------------------- foreign restocking
;
; When a private building cannot get stock from the state, it can buy
; from abroad. The money leaves the republic; the treasury is not
; credited.

; Disabled by default: use physical deliveries instead of direct stock creation.
; Set 1 only to explicitly opt in. Wholesale delivery billing remains active.
foreign_restock_enabled = 0

; Target content as a fraction of the storage's declared capacity.
; When a slot falls below this, the deficit is bought.
;
; v2.7 makes this key mean what it always said. The target is chosen
; per slot, in this order:
;
;   1. slot+0x0C (the per-slot goods limit) x this ratio, if that
;      field holds a real limit - on every shop and pub storage
;      observed so far it reads +0.000, so this branch is dead;
;   2. (storage capacity / slot count) x this ratio;
;   3. 8 t x this ratio, only if the storage declares no capacity.
;
; The divide by slot count is the point. storage+0x8C is the WHOLE
; storage's capacity, shared by every slot in it. Giving each of N
; slots `capacity x ratio` would commit N x ratio against one
; ratio-sized shelf, and RestockSlot writes slot content directly
; rather than asking the engine, so nothing downstream would catch
; the overfill. Dividing first makes the total across one storage
; `capacity x ratio`, which is the sentence above.
;
; Before v2.7 the flat 8 t of case 3 decided every restock and an
; absolute 8 t ceiling clipped the rest, so a 15 t shop restocked to
; 2.4 t per slot and a 200 t warehouse also restocked to 2.4 t per
; slot. That ceiling is gone; a large storage now costs proportionally
; more capital to fill. Lower this ratio if imports are too cheap.
foreign_restock_target = 0.10

; The markup on the foreign purchase price. 1.05 is 5% above the state
; price. 1.50 makes imports expensive; 0.80 makes them a smuggler's
; bargain.

foreign_restock_markup = 1.05

; ---------------------------------------------------------------- service fees
;
; A per-visit charge for private service buildings. Format:
;
;   service_fees = <type>:<kind>:<fee>[, <type>:<kind>:<fee>]...
;
;   type    building type number. The one-shot diagnostic logs this
;           for every private building on the map.
;   kind    which citizen demand counts as "a customer", or the word
;           `any`. The base game gives a citizen exactly one of these
;           when they want a service:
;
;             1    food       (a restaurant or canteen)
;             2    meat       (a butcher, if a private one exists)
;             3    alcohol    (a pub)
;             4    religion   (a church)
;             5    culture    (a cinema, a theatre)
;             6    sport      (a sports hall)
;             10   health     (a hospital, a clinic, a doctor's office)
;
;           `any` charges every non-foreign, non-tourist citizen
;           physically inside the building once per in-game day,
;           regardless of their demands. Use it for a service whose
;           demand kind is not on the list, or for one where the
;           demand may have already been satisfied before the tick.
;   fee     roubles charged per citizen per in-game day. The charge is
;           split: the shop's capital is credited the net figure, the
;           taxes plugin is accrued VAT on the gross.
;
;           v4 USD scale (unified global currency): an optional 4th field
;           supplies the USD fee directly - `type:kind:fee:fee_usd`.
;           Without it, USD mode divides `fee` by usd_divisor below.
;
; A citizen who walks in, out and back in again the same day is
; charged once. The marker is saved with the world, so a save/reload
; mid-day does not double-charge.
;
; The default is the base game's pub at 5 roubles, which is what the
; old `pub_types = 24` / `pub_drink_price = 5.0` pair used to mean.
;
; Both 23 and 24 are listed. On save "Test 1" the base-game pub reads
; type 23 at runtime (see the note under restock_types); 24 is kept so
; that a map where the pub really is 24 keeps working. A type with no
; buildings simply never matches - FeeForType is a linear scan over a
; two-entry array.
;
; RunServiceCharge does not need storages: it walks the people-inside
; vector at building+0xBD8. A building with no storage vector at all
; still charges, as long as it is private, finished, and its type is
; listed here.

service_fees = 23:3:3.5, 24:3:3.5

; v4: RUB->USD divisor for service_fees entries without an explicit
; :fee_usd field (default 50, ~era exchange range). Ignored in RUB mode.
usd_divisor = 50.0

; ---------------------------------------------------------------- legacy keys
;
; The previous version's `pub_types` and `pub_drink_price` keys are
; still read *only when* `service_fees` is empty above; they are then
; expanded into alcohol-kind service fees. Leave service_fees set and
; these keys have no effect. They are documented here only so a
; migration from an older ini does not silently change behaviour.

; pub_types = 24
; pub_drink_price = 5.0
