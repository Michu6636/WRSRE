; currency - the money service. UTF-8, no BOM.
;
; Every plugin above Level 0 in this project gets its citizen wallets
; and its treasury access from here. The plugin also owns the unified
; global currency toggle (see below): labelled treasury movements and
; the flow events route to the active treasury, and every consumer
; below prices, pays, taxes and ledgers in the active currency.
;
; v4 keys: primary_currency (rub|usd), starting_wallet_usd,
; starting_wallet usd divisor handling.
;
; The plugin owns no hooks of its own. It listens to the persistence
; service for save/load events; if persistence is not installed, wallets
; live in memory only for the session. See plugins/persistence.ini.

[currency]

; v4: unified global currency. `rub` (default) keeps the pre-v4 economy:
; labelled treasury ops route to game+0x588 and observers carry
; TSM_CURRENCY_RUB. `usd` routes to game+0x580 (USD) instead, and every
; consumer below prices, pays, taxes and ledgers in USD.
; Accepted: rub | usd (also dollar(s), $).
primary_currency = rub

; 0 unloads the plugin. Every dependent plugin that moves money will
; then fail to load, which is the intended effect - a currency-using
; plugin without a currency service is not a supported configuration.
enabled = 1

; What a citizen's wallet holds the first time they are seen.
;
; The base game has no per-citizen money field, so a wallet is created
; on demand the first time a citizen is queried or charged. This value
; is what a newborn, an immigrant, or a citizen from a save made before
; currency was installed starts with.
;
; Compare against the daily wage defaults in plugins/citizen_labor.ini:
; at the current defaults, roughly five to six days of unskilled work.
; A higher figure makes the very first weeks of a new game feel less
; desperate; a lower one makes the early economy bite harder.
starting_wallet = 15.0

; B5: idle days before a wallet unseen by any money movement is evicted
; from memory (month boundary) and skipped at save. The getter alone
; does not create or refresh entries - only real movement does
; (add/take/state transfers, even a broke citizen's failed purchase).
; 90 days = one fiscal quarter at the monthly payday default.
; 0 = disabled (unbounded, legacy behaviour).
prune_after_days = 90

; One line per save and per load, in tesmioloader.log. This is how a
; save/load round trip is confirmed to be working. 0 = off.
probe = 1