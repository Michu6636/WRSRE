; resource_pricing - the price and resource-lookup service. UTF-8, no BOM.
;
; Every plugin that needs to know what a resource is worth consumes this
; one. There is no hook and no state: a caller asks for a price, gets a
; price. A world load is invisible.
;
; NATIVE PRICES ONLY (economy direction D2, steps 1 and 2)
;
; The game computes a price for every resource it knows how to produce,
; and stores it in the record at +0x58 (RUB) and +0x5C (USD). That is the
; truth this service reads, every time. There is no fallback table, no
; default price and no usd divisor.
;
; When the engine has no price for a resource - a mod resource nothing
; produces, or the moments after a load - the resource is UNPRICED. getPrice
; returns 0.0f, and the service logs "ERROR UNPRICED" once per resource and
; currency. Callers must refuse the transaction or give the good for free as
; vanilla does; they must never turn UNPRICED into a made-up number (D8).
;
; To give a produced resource a different price, use [price] in
; plugins/resources.ini - that is the override mechanism, and it lives where
; the resource is declared. This service does not override anything.

[resource_pricing]

; 0 unloads the plugin. Any plugin that consumes the service will then
; fail to load, which is the intended effect - a shop without a price
; service cannot charge anything.
enabled = 1


; ---------------------------------------------------------------- v6: CPI survival basket
;
; Task 7 (absolute CPI): the daily cost of one citizen's staple survival
; basket, consumed by citizen_retail's Liquidity Runway classification
; (wallet / CPI = days of survival) and by the City Hall Cost of Living
; readout in taxes. Published as resource_pricing v6's
; getCpiDailyBasket(injectedDailyRent):
;
;   CPI = (Pfood x basket_food_tons)
;       + (Pmeat x basket_meat_tons)
;       + (Pclothes x basket_clothes_tons)
;       + daily rent
;
; P is the native price from the live engine records - the same number
; retail charges. The quantities are tonnes/day and are calibrated to
; the engine's own demand generator (docs/CPI_Survival_Basket_Investigation.md):
;
;   food     0.0020 t  midpoint of the engine's 0.0015..0.0030 age ladder
;   meat     0.0006 t  the live probe value for the demand minted at
;                      RVA 0x83817A in v1.1.1.9
;   clothes  0.0005 t  calibrated clothing wear (engine: 0.0005..0.0010)
;
; The rent term is TWO documented constants, one per currency (D35). A dollar
; is not a rouble divided by 50: native USD prices are of the same size as
; RUB prices (usually 10-30 % higher), so neither value is divided by a rate.
;
;   default_daily_rent      0.33 RUB/day = enterprise_base's residential_rent
;                           (10.0 RUB/month) / 30
;   default_daily_rent_usd  0.33 USD/day, the same size as the RUB default
;
; taxes injects the true average tenant rent instead when it computes the
; City Hall readout; citizen_retail deliberately passes 0 (Level 1 must not
; reach into enterprise_base).
;
; If default_daily_rent_usd is missing or invalid in USD mode, the basket is
; UNAVAILABLE: the RUB figure is never reused and nothing is divided. There is
; NO default basket. If food, meat or clothes has no native price,
; getCpiDailyBasket returns 0.0f (UNAVAILABLE). Callers skip CPI-dependent
; work and show UNAVAILABLE (D34); they never substitute 2.15 or any other
; number. Step 7 re-bases all of these constants on captured native prices.

[cpi_basket]
basket_food_tons    = 0.0020
basket_meat_tons    = 0.0006
basket_clothes_tons = 0.0005
default_daily_rent      = 0.33
default_daily_rent_usd  = 0.33
