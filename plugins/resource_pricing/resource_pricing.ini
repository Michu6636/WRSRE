; resource_pricing - the price and resource-lookup service. UTF-8, no BOM.
;
; Every plugin that needs to know what a resource is worth consumes this
; one. There is no hook and no state: a caller asks for a price, gets a
; price. A world load is invisible.
;
; THE TWO PRICE MECHANISMS, AND WHY BOTH EXIST
;
; The game computes a price for every resource it knows how to produce,
; and stores it in the record at +0x58 (RUB) and +0x5C (USD). That is the
; truth this service reads first, every time.
;
; A resource that nothing produces - a mod resource from
; plugins/resources.ini with no $PRODUCTION line anywhere - prices at
; zero, and the game will leave it at zero forever. There is nothing to
; compute from. This file gives such a resource a value.
;
; This is NOT the same as forcing a price. To force a price on a
; resource that IS produced - to override what the engine computes - use
; the [price] section in plugins/resources.ini. That plugin re-applies
; the override after every recompute; this one cannot, because a
; recompute would overwrite anything written here.
;
;   [price] in resources.ini        overrides a produced resource
;   [fallback_prices] here          fills in an unproduced one

[resource_pricing]

; 0 unloads the plugin. Any plugin that consumes the service will then
; fail to load, which is the intended effect - a shop without a price
; service cannot charge anything.
enabled = 1

; The price in roubles per ton for a resource that has no live price and
; is not listed in [fallback_prices] below.
;
; 500 is a middle-of-the-road figure. A user who wants every unpriced
; resource to be cheap sets it lower; one who wants a strong incentive
; to build a production chain for it sets it higher. Nothing about the
; engine depends on this - it is a bootstrap value for a resource the
; game has nothing to say about.
default = 500.0

; v4 USD scale (unified global currency). Live engine prices need no
; scaling - the game keeps +0x58 (RUB) and +0x5C (USD) natively. Only the
; fallback path below is RUB-denominated, so USD fallback answers divide
; by usd_divisor unless an explicit override exists:
;   default_usd          explicit USD default (per ton); empty = auto
;   usd_divisor          RUB->USD fallback divisor (default 50)
;   [fallback_prices_usd] per-resource USD overrides (same names)
; default_usd = 10.0
usd_divisor = 50.0

; One line the first time a resource ends up on the default, so the log
; explains why. Latched per name - the same resource will not print
; again for the rest of the session. 0 = off.
probe = 1


; ---------------------------------------------------------------- market balance
;
; v2: the Republic-wide macro order book (Victoria-3 style supply/demand).
; Producers record supply when finished goods leave an export storage or
; cross the border; consumers record demand for citizen retail wants
; (serviced or turned away) and factory input draws. At each rebalance
; boundary the service folds the accumulated totals into a clamped
; multiplier per resource:
;
;   ratio = (demand - supply) / max(1, min(demand, supply))
;   mult  = clamp(1 + market_gain * ratio, min_glut_mult, max_shortage_mult)
;
; That multiplier is applied ON TOP of the base price by the private
; economy: factory procurement payout = base * mult * 0.90, and retail
; price = base * mult * shop markup. An overproduced good floods the
; market and its multiplier collapses toward the glut floor; a scarce
; good surges toward the shortage ceiling. This is the anti-money-printer
; that stops a saturated factory from earning risk-free income.

[market_balance]

; 0 disables the whole order book. Every consumer then sees a neutral
; 1.0 multiplier and records nothing - prices behave exactly as before v2.
dynamic_market_enabled = 1

; Shortage ceiling: demand far exceeds supply -> up to +100% price.
max_shortage_mult = 2.0

; Glut floor: supply far exceeds demand -> down to -65% price.
min_glut_mult = 0.35

; Dampening on the raw imbalance ratio. 0.75 is the spec default; higher
; makes the market more volatile, 0 pins everything to base price.
market_gain = 0.75

; How often the accumulated totals fold into a new multiplier: monthly,
; weekly, quarterly or yearly.
market_rebalance_freq = monthly


; ---------------------------------------------------------------- v3: CPI survival basket
;
; Task 7 (absolute CPI): the daily cost of one citizen's staple survival
; basket, consumed by citizen_retail's Liquidity Runway classification
; (wallet / CPI = days of survival) and by the City Hall Cost of Living
; readout in taxes. Published as resource_pricing v3's
; getCpiDailyBasket(injectedDailyRent):
;
;   CPI = (Pfood x multFood x basket_food_tons)
;       + (Pmeat x multMeat x basket_meat_tons)
;       + (Pclothes x multClothes x basket_clothes_tons)
;       + daily rent
;
; P and mult come from the live engine records and the [market_balance]
; order book - the same numbers retail charges. The quantities are
; tonnes/day and are calibrated to the engine's own demand generator
; (docs/CPI_Survival_Basket_Investigation.md):
;
;   food     0.0020 t  midpoint of the engine's 0.0015..0.0030 age ladder
;   meat     0.0006 t  the live probe value for the demand minted at
;                      RVA 0x83817A in v1.1.1.9
;   clothes  0.0005 t  calibrated clothing wear (engine: 0.0005..0.0010)
;
; default_daily_rent is the neutral per-day rent used when a caller
; passes 0 - 0.33 = enterprise_base's residential_rent (10.0 RUB/month)
; divided by 30. In USD mode it divides by usd_divisor above. taxes
; injects the true average tenant rent instead when it computes the
; City Hall readout; citizen_retail deliberately passes 0 (Level 1 must
; not reach into enterprise_base).

[cpi_basket]
basket_food_tons    = 0.0020
basket_meat_tons    = 0.0006
basket_clothes_tons = 0.0005
default_daily_rent  = 0.33


; ---------------------------------------------------------------- fallback prices
;
; One line per resource. The name is the resource's own name as it
; appears in the record (case-insensitive here, exact-case inside the
; game). The price is in roubles per ton, the same unit as the game's
; own +0x58 field.
;
; These are only consulted when the engine has no live price for the
; resource. Setting one here for a resource the engine DOES price has no
; effect - the live price wins, always, because it is what the trade
; window shows.
;
; The defaults below are the same ones the old citizen_economy plugin
; used, so an existing save migrated to the new architecture sees the
; same shop prices it saw before.

[fallback_prices]
food       = 350.0
meat       = 700.0
clothes    = 1400.0
eletronics = 3800.0
alcohol    = 600.0

; v4: optional explicit USD fallback overrides (USD per ton). Only needed
; when the automatic default/usd_divisor scaling above gives the wrong
; figure for a resource - the engine's own live USD price (+0x5C) still
; wins whenever it exists.
[fallback_prices_usd]
; food       = 7.0
; meat       = 14.0
; clothes    = 28.0
; eletronics = 76.0
; alcohol    = 12.0

; ---------------------------------------------------------------- example: a mod good
;
; A mod resource that no building type produces will price at zero
; without a fallback. Uncomment and adjust to give one a value:
;
;   medicine   = 2600.0
;   furniture  = 1800.0
;
; These are the two goods the current example plugin set ships with.
; They ARE produced (medicine by the pharmaceutical plant, furniture by
; the furniture factory), so the engine computes a price for both, and
; the entries above would be dead. They are here as documentation of the
; shape, not as an active setting.