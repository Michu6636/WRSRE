; private_logistics -- simplified observed settlement. Host-tested only; native
; Test16 event coverage, fuel units and exact burn remain unproven.
;
; Goods: unloading buyer pays the verified loading seller
;   delivered_lot_quantity * global_native_price_at_loading (no market multiplier).
; Separate seller/resource/price lots are retained, including residual cargo.
; DO trip: original unloading buyer pays the vehicle-owning private DO
;   sampled_positive_task_fuel_decrease * global_fuel_price_at_observed_closure.
; Unknown starts, gaps, uncertain identities, incomplete discovery and missing
; prices are refused/unpriced. There is no extra wholesale/margin factor and no
; cargo-value freight, fragment tariff, wear, upkeep or other charge.

[private_logistics]
enabled = 1

; Live by default (D16, economy-direction step 3). Set billing=0 or
; dry_run=1 only to observe and log both settlement paths without moving
; money; live movement requires billing=1 AND dry_run=0.
billing = 1
dry_run = 0

panel_fuel_observer = 1
schedule_observer = 1
balance_log = 1
fuel_resource = fuel
min_payment = 0.01
log_cap_per_day = 400
ledger_capacity = 512
site_log = 1
census_log = 1
veh_scan = 1
veh_scan_log_per_day = 40
cargo_dump = 1

; Independent automatic-target assistance. This is not a billing prerequisite;
; settlement observers still register their load-epoch persistence handlers.
auto_targets_enabled = 1
auto_targets_dry_run = 0
auto_targets_log_limit = 80
auto_source_percent = 10
auto_destination_percent = 30

[b2b]
counterparty_settlement = 1
allow_buyer_overdraft = 1
buyer_overdraft_limit = 5000.0
