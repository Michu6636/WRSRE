; state_ledger - monthly accounting of every money movement. UTF-8, no BOM.
;
; Level 1. Watches currency's flow observer, tallies money in and out
; of the state treasury by category, and writes one row per complete
; month into a CSV beside the save.
;
; WHY A LEDGER AND NOT A HUD
;
; The overlay card shows the current month's totals, but the real value
; is the CSV: an accumulating record of every month in a save. A user
; who wants to know whether their VAT rate is raising revenue, or their
; wages are eating the budget, reads the CSV.

[state_ledger]

; 0 unloads the plugin. Money still moves; the ledger stops recording.
enabled = 1

; Write a CSV to the save directory, one row per complete month.
; Columns:
;
;   Year, Month,
;   Wages, Pensions, Welfare,
;   StateStoreSales, WholesaleB2B,
;   VAT, ProfitTax, PropertyTax,
;   Other,
;   NetTreasury,
;   TreasuryOpen, TreasuryClose
;
; v4 (unified global currency): the two treasury columns are suffixed
; with the active currency when a fresh file is created -
; TreasuryOpen_RUB/TreasuryClose_RUB, or ..._USD. Existing files keep
; the header they were started with; rows appended after a currency
; switch are in the new unit (rename csv_filename to separate histories).
csv = 1

; The file name, in the save directory. Changing it starts a fresh
; history; existing rows are not migrated.
csv_filename = tesmio_ledger.csv

; Draw the legacy F8 State Budget card on the ui_overlay column (disabled
; by default now that State Budget telemetry lives in Almanac). Set 1 to restore.
show_overlay = 0

; One line per month boundary in tesmioloader.log. 0 = off.
probe = 1

; Cross-check: compare the sum of flow-observer reports against the
; observed treasury delta, and log a line when they diverge.
;
; Default 0 - OFF. The check's premise is that every treasury change
; goes through the currency plugin, which fires a flow observer for
; each movement. **That premise is false.** The game's own economic
; simulation also writes the treasury directly: state shop revenue,
; state construction costs, the game's own taxes and expenses. Those
; changes never fire our observer, so the sum of our flows will differ
; from the total treasury delta on almost every month, in any save
; where the game is running its economy.
;
; Turn this on if you suspect a plugin of moving money behind the
; ledger's back and want a starting point for the investigation.
; Divergences of a few roubles on a ten-million treasury are ordinary
; game activity, not a bug.
cross_check = 0