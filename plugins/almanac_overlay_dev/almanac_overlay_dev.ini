; almanac_overlay_dev - the Almanac ImGui panel, drawn inside the game window.
; UTF-8, no BOM.
;
; Built and staged to build\plugins by:
;
;     build.bat
;
; which produces this file, tesmioloader.dll and every plugin DLL in one go.
; Copy build\plugins\* into the `plugins` folder of the runtime you are
; testing (the folder beside tesmioloader.dll, which is what the loader scans).
;
; No [plugins] entry is required: an absent key means ON. To switch the panel
; off without deleting it, either add
;
;     [plugins]
;     almanac_overlay_dev = 0
;
; to tesmioloader.ini, or set enabled = 0 below, which declines at Init.
;
; The panel draws into the game's own swap chain. It does not read or write the
; republic, does not capture input, and does not change the native sidebar.
; Once it has installed its hook the DLL cannot be unloaded:
;
;     [almanac_overlay_dev]
;     enabled = 0
;
; and restart the game.

[almanac_overlay_dev]

; 0 declines at Init, before anything is patched.
enabled = 1

; Show the panel once, unasked, on the first frame it can draw on. 0 means the
; panel waits for the first key press.
;
; Default 0: the key opens the panel. With 1 the panel appears on its own at
; startup, and the first F8 press you make then HIDES it - which reads as the
; key not working. Set 1 only for a screenshot run where nobody can press a key.
show_on_start = 0

; Virtual-key code for show/hide, hex or decimal.
;
;   0x77  F8   (default)
;   0x78  F9
;   0x79  F10
;
; Read as a physical press edge, so holding the key does not flicker. F8 is also
; the key ui_overlay uses for the native-text HUD; if that HUD is enabled, both
; toggle on the same press. The panel samples the key only while the game window
; is in the foreground, so pressing F8 in another application does not count.
toggle_key = 0x77

; Font size as a percentage of the 16px default. 75..250, clamped.
; Raise it if the panel text is hard to read on a high-DPI monitor.
font_scale_percent = 100

; 0 hides the panel while the game is not the foreground window, which is what
; keeps it from painting over other applications. Set to 1 only for a
; screenshot taken from a second monitor without focus.
draw_when_unfocused = 0
