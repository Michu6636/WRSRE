; ui_overlay - the HUD drawing and toggle service. UTF-8, no BOM.
;
; Every plugin that draws an overlay subscribes to this one. It owns the
; TerrainRender hook the whole project uses, the text primitives, and
; the hotkey. There is nothing about what any plugin draws in this file
; - only where the column starts and how the HUD is toggled.

[ui_overlay]

; 0 unloads the plugin. Any plugin that registered a drawer will then
; fail to load or log a warning on Start, depending on how it was
; written; either way nothing in the HUD will render.
enabled = 1

; Whether the HUD is shown when the game starts.
;
; 1 is what most players want - the overlay appears without a keypress.
; 0 is for a user who wants it hidden by default and turns it on when
; they need it.
show_by_default = 1

; The key that toggles the HUD. Virtual-key code, in hex or decimal.
;
;   0x77   F8   (the default the higher plugins have used)
;   0x76   F7
;   0x75   F6
;   0x74   F5
;   0x7A   F11  (would fight Steam's screenshot key)
;   0      disable the toggle entirely - the HUD is always visible if
;          show_by_default is 1, never visible if it is 0
;
; The key is checked for a *press edge*, not a held state, so holding it
; does not flip the HUD on and off at the frame rate.
toggle_key = 0x77

; The top-left corner of the HUD column, in layout units. Every drawer
; is handed this as its starting x, and this as its starting y, and is
; free to draw anywhere it likes from there - the y the drawer returns
; is where the next drawer's first line goes.
;
; These are multiplied by the display's DPI scalar before being used, so
; they do not need to change on a high-DPI monitor.
column_x = 28.0
column_y = 85.0

; One line of vertical advance, in the same layout units. A drawer that
; draws three lines of text at this spacing leaves the next drawer
; exactly three lines further down.
;
; 17.5 is what the existing overlays use and what the game's own panels
; use for the closest visual match. Larger makes the HUD airier and
; taller; smaller fits more on screen.
line_height = 17.5

; One line per HUD toggle, and one per faulted drawer, in
; tesmioloader.log. Useful when confirming the plugin is alive after a
; game update. 0 = off.
probe = 1