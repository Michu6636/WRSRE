; enterprise_base - private enterprises and the investment pool. UTF-8, no BOM.
;
; This plugin is what makes a building private. It owns the register of
; private enterprises, their capital, the accrual and period fields that
; a tax engine reads and writes, and the Victoria-3-style investment
; pool that funds private construction.
;
; Tax rates and schedules are NOT here. They live in plugins\taxes.ini,
; read by the separate `taxes` plugin. If taxes is not installed, no
; VAT is charged, no profit tax, no property tax.
;
; HOW A BUILDING BECOMES PRIVATE (v8.5)
;
; Open the building's window and click the PRIV tile - the same native
; square button style as City Hall's TAX header (ui_panels v3; a v2
; build degrades to a "[ Private Enterprise ]" checkbox). Clicking it
; again un-privatises; the capital stays held in reserve. The click
; writes the register directly and persists with the save (rebuilt on
; load by custom name, or by type name + position when the name is not
; readable) - no renaming, no memory scan.
;
; WHERE THE TILE APPEARS: on the building's OWN finished panel. The
; engine dispatcher routes a building that is still under construction
; (or stalled on materials, or ruined) to the construction/ruin panel
; instead of its shop/residence panel - those windows carry no PRIV
; tile. Finish the building first, then its normal panel shows the tile.
; With probe = 1 the log writes one "[PRIV TILE] provider reached" line
; per window opened; a window WITHOUT that line was routed elsewhere by
; the engine.
;
; The old rename-to-[P] method is retired: scanning building structs for
; the tag proved unreliable (names outside the scanned span were missed,
; and the v8.4 heap follow faulted on float-shaped pointers - 14,707
; access violations in one test session). A literal [P] tag now only
; matters for `all_enterprises_private`-style auto types and mod object
; names that carry one.
;
; ---------------------------------------------------------------- DO PRIVATISATION
;
; THIS COPY ENABLES PRIVATE DISTRIBUTION OFFICES. Two keys differ from the
; shipped file; everything else is byte-identical:
;
;   all_enterprises_private = 1        (was 0)
;   auto_private_types      = 43,44    (was 3,6,8)
;
; WHY THIS IS NEEDED: a DO window has no PRIV tile. The engine's window
; dispatcher never routes a distribution office through the five builders
; ui_panels post-hooks, so EnterpriseWidgetProvider is never reached and
; the tile is simply absent. Renaming the office "Depot [P]" does nothing
; either - the v8.5 hot path reads the OBJECT name from the type
; descriptor, not the custom name. The config route is the only way to
; make a DO private without new code.
;
; WHY THE TYPE LIST IS ONLY 43,44: `all_enterprises_private` does not
; make "everything" private - it only *arms* the auto-type test. Which
; buildings actually become private is decided entirely by
; auto_private_types. Listing only the distribution-office types
; therefore privatises DOs and leaves every shop, factory and field in
; state hands. Add 3,6,8 to the list only if you deliberately want the
; whole business map privatised (see the note at the key itself).
;
; WHAT IT DOES NOT TOUCH: buildings you have already privatised by
; clicking the PRIV tile stay private - the register persists and this
; setting is not consulted for them. Un-privatising a DO is not possible
; from its window either; set all_enterprises_private back to 0 and
; restart.
;
; ⚠ SUPERSEDED BY ui_panels 6.7, KEPT AS A FALLBACK.
;
; ui_panels v6.7 hooks the distribution-office window builder, so a DO now
; grows a PRIV tile like every other building - click it, and the office is
; registered with its normal starting capital through the supported path.
; When that build is installed and the tile is visible:
;
;     set all_enterprises_private = 0   (and auto_private_types back to 3,6,8)
;
; and privatise the office with the button. Leave this file as it is only
; while the tile does not appear.
;
; WHAT TO EXPECT IN THE LOG (probe = 1):
;   enterprise_base  registered "<name>" ($DISTRIBUTION_OFFICE) with
;                    10000.00 starting capital
; A DO registered this way gets a real company entry and the normal
; starting_capital, so capital-based code paths work on it immediately.

[enterprise_base]

; 0 unloads the plugin. Existing enterprise tags become inert.
enabled = 1

; One line per registered enterprise, per un-privatised one, per tax
; settlement (from the taxes plugin, this plugin only observes capital
; movements), per siphon, and per defaulted wage.
; M2 verification window: ON so [WAGE HIKE] / [AUSTERITY] lines are
; visible during the milestone-2 playtest (plus per-enterprise
; registration, rent and siphon lines). Set back to 0 when done.
probe = 1

; 0 = no overlay enterprise card since 2026-10-05: the in-window rows were
; verified in game (6 rows appended to the [P] shop window), so the HUD
; overlay is redundant. Set to 1 only if the overlay is wanted again - the
; aggregates stay readable through state_ledger and the monthly summary.
card = 0

; 1 registers the enterprise rows (owner, capital, month sales/wages/taxes,
; net profit and dividends, pool) with ui_panels, so every [P] building's
; own window shows its ledger. 0 leaves all windows byte-identical to
; vanilla. Rows appear only on private buildings; set ui_panels' max_rows
; to cap how many.
panel_rows = 1

; A fresh enterprise's starting capital.
starting_capital = 10000.0

; The multiplier a private shop applies on top of the state price for
; the same resource. 1.30 is "sell at 30% above the state price".
default_markup = 2.00

; Legacy STATIC wage multiplier - applies only when
; [private_market_wages] dynamic_bidding_enabled = 0 (the off-switch).
; With bidding on (the default), each firm's own wageBonusMult drives
; its payroll instead - see [private_market_wages] at the bottom.
private_wage_bonus = 1.00

; v5.4: residential rent in RUB per resident per month, collected from
; every private residential (type 2) building at the month boundary via
; currency's partial wallet take. Credited as TSM_CAP_RENT revenue.
;
; v8.0 (Task 1): that base is now scaled by the residence's environmental
; attractiveness (the engine's land-value heightfield, bld+0x11B0, 0..1):
;   tenant_rent = residential_rent x (min + (max - min) x attractiveness)
; Clean, quiet, park-rich streets push toward max; polluted industrial
; tenements sink toward min. A broke tenant still pays only what the
; partial wallet take allows, so the multiplier shapes revenue, never
; eviction. Currency-neutral: the multiplier rides on whatever currency
; residential_rent resolved to (RUB base or USD-scaled).
residential_rent = 10.0

; v8.0 (Task 1): the rent multiplier band over attractiveness 0..1.
;   0.50 = slum / industrial floor (50% of base at attractiveness 0)
;   2.00 = luxury / park ceiling (200% of base at attractiveness 1)
rent_attr_min_mult = 0.50
rent_attr_max_mult = 2.00

; v8.2 (Task 1): economic eviction & household relocation, evaluated for
; every private-residence tenant at the month boundary after the rent
; take. A tenant is staged when tenant_rent > rent_burden_threshold x
; wallet (pre-charge balance) OR the partial take covered < 95% of the
; rent; the wealth-band search (person+0xE4: poor < 0.40 -> state/cheap,
; wealthy >= 0.70 -> high-attractiveness private) runs inline while the
; native FUN_14083CA50 move dispatches after the loop with no lock held.
; No vacancy anywhere retains the citizen in place with a 0.05 arrears
; dent - never nullptr (vanilla would despawn them).
;   1 = evict burdened tenants and relocate households
;   0 = charge rent only (the pre-v8.2 behaviour)
eviction_enabled = 1

; Share of the tenant's wallet the monthly rent may take before the
; tenant counts as burdened (0.35 = 35%). Clamped to (0, 1].
rent_burden_threshold = 0.35

; Happiness (person+0xE8, 0..1) deducted on a forced relocation.
; Clamped to [0, 1]. The no-vacancy backstop always dents 0.05.
eviction_penalty_happiness = 0.15

; 1 caps the attractiveness premium by the dwelling count (storage-0
; capacity = flats: blocks declare 75..135, shacks 3..13), so planting
; trees beside a shack cannot charge penthouse rent. 0 keeps the raw
; v8.0 multiplier.
park_cap_enabled = 1

; ---------------------------------------------------------------- v4 USD scale
;
; Unified global currency (primary_currency in plugins\currency.ini).
; The flat figures above - starting_capital, residential_rent,
; starting_pool, legal_reserve_flat - are RUB-denominated. In USD mode
; each divides by usd_divisor at startup unless an explicit *_usd key
; exists (the *_usd key wins over the divisor):
;   starting_capital_usd, residential_rent_usd,
;   starting_pool_usd (section [investment_pool]),
;   legal_reserve_flat_usd (section [investment_pool])
usd_divisor = 50.0

; 0 means a private enterprise refuses to take on more debt once its
; capital has run out. 1 allows it to go negative.
allow_debt = 0

; ---------------------------------------------------------------- debug hotkeys
; 1 = OnTick polls Ctrl+F9 (manual rent & eviction pass) and Ctrl+F11
; (drain sample citizen wallets to 0.50 RUB) while the game window is
; foreground. Defaults to 1 so the stress tools work out of the box in dev.
debug_mode = 1

; When 1, every FINISHED building whose type is in auto_private_types is
; treated as private, without a [P] tag and without the PRIV tile.
;
; This is the switch that makes a distribution office private. It has to be
; 1 for the type list to be consulted at all - CheckBuildingHasTag is
;     (all_enterprises_private && type in auto_private_types) || object name has [P]
; so leaving this at 0 disables the auto-type route entirely.
;
; A building only counts once it is FINISHED: the engine routes an
; unfinished, material-stalled or ruined building to the construction/ruin
; panel, and the registration sweep skips it until it completes.
;
; = 1 was the workaround for the distribution office that had no button.
; The button exists now (ui_panels v6.8+, enterprise_base v9.15+), so the
; automatic route is OFF: it re-privatised a released DO 150-250 ms after
; every RELEASE click, which made the office impossible to return to state
; ownership. Set to 1 only for a deliberate all-private test.
all_enterprises_private = 0

; The building types all_enterprises_private treats as business-shaped.
;
;   43,44  distribution offices  <- what this copy is for
;
; Deliberately JUST the DO types. Listing 3,6,8 as well would privatise
; every shop, factory and field on the map in one step - a large economic
; change that is fine for a deliberate "all private" test but must not be
; left on by accident.
;
;   2  residence        3  shop            5  storage        6  factory
;   7  mine             8  field           9  farm          12  construction
;  14/15 depot        20  customs house  23  pub           39  city hall
;  43/44 distribution office
;
; (Type 23 is the pub whose service fee private_shops already charges; the
; list above is for reference only - nothing here needs it.)
; A type that does not exist in a given mod set is simply never matched.
;
; Shipped default was 3,6,8.
auto_private_types = 43,44


; ---------------------------------------------------------------- the pool
;
; The private investment pool is capital siphoned out of profitable
; enterprises, held in a single account, and available to private
; construction. It is NOT the state treasury.

[investment_pool]

enabled = 1

; What the pool starts with in a fresh game.
starting_pool = 5000000.0

; How much of an enterprise's "excess capital" is siphoned per month.
;   0.00   no siphon; enterprises keep their capital
;   0.50   half of everything over the reserve
;   1.00   everything over the reserve
siphon_rate = 0.50

; What an enterprise is allowed to keep before anything is siphoned.
;   reserve = legal_reserve_flat
;           + (last month's wages * payroll_buffer_months)
;           + (last month's wholesale * wholesale_buffer_months)
;
; The reserve is what the enterprise needs to keep operating through a
; normal month. Anything above it is treated as profit and subject to
; the siphon.
;
; "Last month's" is literal as of v3.0.1 - the two accumulator fields
; this multiplies reset at the month boundary, along with the rest of
; the monthly* group. Before that fix, they were lifetime totals and
; the reserve grew without bound.
legal_reserve_flat = 5000.0
payroll_buffer_months = 1.5
wholesale_buffer_months = 1.5

; ---------------------------------------------------------------- M2 wage market
;
; Victoria-3-style private wage bidding (Labor & Salary Overhaul,
; Milestone 2). Each [P] enterprise carries a wageBonusMult from 1.0 up
; to max_private_premium. At every month boundary:
;
;   - booming + understaffed  (net profit > 0, capital above the legal
;     reserve, staffing ratio < understaffed_threshold):
;     bonus +wage_bidding_step/month -> [WAGE HIKE] in the log (probe = 1)
;   - distressed  (net profit <= 0 or capital exhausted):
;     bonus -wage_bidding_step/month down to 1.0 -> [AUSTERITY] log
;
; Staffing ratio = workers present / building capacity. The final wage
; is always floored to citizen_labor's statutory minimum wage. The
; in-window "Wage" row shows the live rate and its market state, and
; the "Labor" row shows workers/capacity.

[private_market_wages]

; 0 turns the state machine off and restores the legacy static
; private_wage_bonus multiplier for every firm.
dynamic_bidding_enabled = 1

; Ceiling for the multiplier: 1.50 = a booming firm may pay up to
; +50% over the state sector rate. 1.00 disables hikes but keeps
; austerity cuts (floor stays 1.0).
max_private_premium = 1.50

; Staffing ratio below which a profitable firm starts bidding up
; (0.75 = fewer than 75% of the slots filled).
understaffed_threshold = 0.75

; Monthly wage adjustment step (default = 0.05 = +5% / -5% per month).
; Applied on top of the 1.0 baseline: a booming firm adds this each
; month until the premium cap, a distressed firm subtracts it down to
; 1.0 (effective pay never falls below minimum_wage - that floor is
; enforced at payroll). Clamped to 0.01 .. 0.50.
wage_bidding_step = 0.05

; ---------------------------------------------------------------- v8.0 phased insolvency (Task 3)
;
; Real commercial failure. A private firm that stays at capital <= 0
; advances one stage per month boundary:
;
;   Month 1 (Distressed)  hiring freeze - the insolvent-payroll path
;                         already poisons the workplace in citizen_labor,
;                         so no new staff are assigned. [DISTRESSED] log.
;   Month 2 (Insolvent)   the investment pool attempts a buyout auction at
;                         starting_capital x auction_buyout_cost_mult. If
;                         the pool covers it, the firm recapitalises and
;                         the counter resets; otherwise it faces ruin.
;                         [AUCTION BUYOUT] / [AUCTION FAILED] log.
;   Month N (Abandoned)   native FUN_14013FE70 (RVA 0x13FE70) collapses
;                         the building into physical 3D ruins, the [P] tag
;                         is stripped, and all economic loops skip it
;                         thereafter. [ABANDONED] log. Survives save/load -
;                         the engine's own persisted ruin flag (bld+0x1198)
;                         blocks re-privatisation in the registration pass.
;
; Returning to positive capital at any stage resets the counter.

[insolvency]

; 1 enables the full lifecycle. 0 leaves a negative-capital firm merely
; insolvent (no buyout, no ruin) - the pre-v8.0 behaviour.
abandonment_enabled = 1

; Months of sustained negative capital before physical abandonment.
; 3 is the spec default (freeze -> auction -> ruin).
months_to_abandon = 3

; Buyout cost as a multiple of starting_capital. 1.5 = a distressed firm
; costs the pool 1.5x a fresh enterprise's capital to rescue.
auction_buyout_cost_mult = 1.5


; ---------------------------------------------------------------- v9.1 destitute eviction (Task 7)
;
; Grounded in the absolute CPI survival basket
; (docs/CPI_Survival_Basket_Investigation.md). At every monthly rent pass
; a resident whose PRE-CHARGE wallet cannot cover ONE day of staple
; bread -
;
;   wallet < Pfood x bread_tons   (live food price x market multiplier,
;                                  in the active currency)
;
; is staged as an immediate relocation candidate REGARDLESS of whether
; the rent take succeeded - destitution, not rent arrears. The existing
; homelessness backstop is untouched: with no vacant flat anywhere the
; citizen stays in place with the small arrears happiness dent; nobody
; is ever relocated into nullptr (vanilla would despawn them).
;
; bread_tons should mirror resource_pricing's [cpi_basket]
; basket_food_tons (0.0020) so the eviction mark is the same "one day of
; bread" the citizen_retail runway classification implies. The price
; itself is read live from resource_pricing at rent time, so USD mode
; and market swings need no extra configuration here. Without
; resource_pricing installed the stage is inert (logged once at Start);
; the rent-burden and short-pay tests still govern.
;
; Requires eviction_enabled = 1 above as the master switch.

[destitute_eviction]

; 0 disables the bread-day stage (burden/short-pay eviction only).
enabled = 1

; Tons of staple food that make up "one day of bread".
; Mirror of resource_pricing [cpi_basket] basket_food_tons.
bread_tons = 0.0020
