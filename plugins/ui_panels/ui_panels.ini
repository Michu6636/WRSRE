; ui_panels - the in-window information layer.
; Rows appended to the bottom of the game's own building panels, in the
; game's font and colour. UTF-8 without BOM. Every hook's prologue bytes are
; verified by the loader before patching - a game update costs rows, never a
; crash. Hook byte sources: docs/17-ui-and-integration.md section 10.

[ui_panels]
enabled  = 1

; One log line per hook: the builder's bottom edge before and after it runs
; (proves it maintains window+0x250), then the first append. Keep on for one
; session after any game update.
probe = 1

; Rows per window. Hard cap is 14 (TSM_PANEL_MAX_ROWS, raised from 12 so
; the private-enterprise PRIV tile - 2 content rows in the fallback flow -
; fits beside a fully-loaded 11-row enterprise card.
max_rows = 14

; Built-in "ui_panels: row ok" smoke row. Off since 2026-10-05: the M2
; provider was verified in game (shop appended 6 enterprise rows, which
; fill max_rows and displace this row anyway). Set to 1 only when
; debugging the hook without a provider.
test_row = 0

; Label colour for appended rows. v4.0: 0xFF1A1A1A opaque native dark
; charcoal for parchment legibility (was 0xFF990000 dark red - strained
; on beige). Matches the TAX-tile BTN_LABEL_COLOUR family.
colour = 0xFF1A1A1A

; The C3D_FONT* the appended rows print with. Shop and residence rows use
; 0x994200; the mine panel uses 0x995220. Missing rva falls back to 0x994200.
font = 0x994200

; Which verified panel builders to hook:
;   shop      0x7272F0  (BUILDINGTYPE 3)
;   residence 0x761300  (BUILDINGTYPE 2)
;   pub       0x723950  (BUILDINGTYPE 23)
;   factory   0x799630  (BUILDINGTYPE 6, 97, 98, 17, 70 - factory/powerplant family)
;   cityhall  0x72DBF0  (BUILDINGTYPE 39 - City Hall / Party HQ, section 11.16)
; Prologues verified in docs/18 (G2/G3) for shop/pub/factory, docs/17 for
; residence, UI investigation section 11.13/11.16 for cityhall (17-byte
; register-only prefix; cookie load AFTER the steal). The cityhall hook is
; TYPE-FILTERED to City Hall (39) inside AppendRowsImpl, the builder's
; caller routes type 39 here via CMP ECX,0x27. Leave "cityhall" out of
; enable to drop the City Hall fiscal-policy panel.
; v6.7: "do" adds the DISTRIBUTION OFFICE (type 43) window. Unlike the six
; above it is a CALL-SITE hook, not an inline hook - the DO builder's
; prologue has never been read, so the plugin finds the `call 0x741170`
; inside the window dispatcher and retargets it. It verifies itself: if no
; such call exists, it logs that and installs nothing.
;
; This is what puts the PRIV tile on a distribution office, so a DO can be
; privatised with a click instead of all_enterprises_private in
; enterprise_base.ini.
; v6.11: storage adds the type-5 state-storage panel hook for per-building
; private-DO load permission widgets.
; v6.15: "warehouse" adds the window-kind-3 panel (builder 0x7FC880). The
; dispatcher is a TWO-LEVEL switch: it routes on the WINDOW's kind
; (window+0x34) first, and only falls through to the building's own type
; number on the kind==0 arm. Every hook above is kind==0 - which is why the
; warehouse panel carried no rows and no widgets at all, and why
; private_logistics could never draw its "Allow private DOs to load here"
; checkbox there: the provider only runs from AppendRowsImpl, and
; AppendRowsImpl only runs when a hook fires.
; Like "do", this is a CALL-SITE hook, not an inline hook: 0x7FC880 opens with
; MOV RAX,RSP and does not reach a clean boundary for 18 bytes. The plugin
; verifies the kind==3 CMP/JNZ/MOV/MOV/CALL cluster at 0x6EA5E3 byte-for-byte,
; then retargets the `call 0x7FC880` at 0x6EA5EF. If the guard does not match
; it logs "guard ... does not match" and installs nothing - a game update
; costs the warehouse panel its rows, never a crash.
; With probe = 1 the next log proves or refutes the model in one run: a
; kind==3 window prints "DEBUG hook=warehouse idx=8 ... wkind=3", and every
; pre-existing hook must print wkind=0.
enable = shop,residence,pub,factory,cityhall,citizen,do,storage,warehouse

; v6.8: WIDE BUTTON WIDTH.
;
; widgetWideButton (used by enterprise_base's privatisation control on
; non-residential buildings) draws a bar this many native units wide,
; multiplied by the UI scale at draw time. Its height is always two row
; pitches, so it occupies exactly the space the square tile did.
;
; At dpi 0.80 and the default 280 that is a 224-pixel bar - about eight row
; pitches. Clamped to 120..900.
;
; If the bar overflows the right edge of a panel, lower this. If a caption
; is clipped, raise it in steps of 20 and restart.
wide_button_width = 280

; Residence PRIV-tile dock calibration (engine units, before dpi). The
; tile size is fixed at 65 units (DAT_14090AAA8 - the natives' icon
; square per the v4.8 btn-probe calibration); these two keys place it in
; the panel. Pitch 70-73 overlapped or sat left of the natives' row; 80
; was the position the tester confirmed perfect. Row term 188 confirmed
; with it. Tune in small steps (+/-3 pitch, +/-5 rowDy) and restart -
; the live log prints the active values.
icon_tile_x_pitch = 80
icon_tile_row_dy  = 188

; Tab-row dock (the BIG tile - same size as the native tab icons):
; where TAX sits on the City Hall panel next to the "Domestic production
; & consumption" icon, and PRIV on shop/pub/factory panels. The X slot
; starts after (35+15+pitch*4) units; the natives advance at a 63-unit
; pitch, so 70 sat ~22px right of the 4th icon. Row top is
; W_Y+W_OFFY+dpi*rowDy; 175 sat ~8px above the tab row.
tab_tile_x_pitch  = 63
tab_tile_row_dy   = 180

; CON POSITION - TWO KNOBS, NOTHING ELSE MATTERS (v6.3):
;   Screen coords, origin top-left, 1 unit ~= 0.8px on screen:
;     toolbar_tile_x: BIGGER = right, SMALLER = left
;     toolbar_tile_y: BIGGER = DOWN,  SMALLER = up
;   "A little up and to the left" = DECREASE both numbers.
;   Steps of 5-10 are clearly visible; 1-2 is fine tuning.
;   No rebuild needed - edit, restart the game, done. The live log prints
;   the active values ("toolbar y .. size .. x ..") every session.
toolbar_tile_x       = 430
toolbar_tile_y       = -5
; CON SIZE (v6.1): 40 = the natives' own toolbar button square
; (FUN_1407838e0, constr_tbloop.asm:226-230). Do not touch unless the whole
; toolbar changes size.
toolbar_tile_size    = 40

