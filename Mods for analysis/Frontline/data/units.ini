; SRWar unit catalog.
; model/material are paths inside steamapps/workshop/content/784150 (the workshop item must be subscribed).
; Prototype combat model: single armor value + HP (no per-side armor).
; weapon = display name | role=<type> caliber=<mm; 0 if not applicable> projectile=<bullet|shell|rocket|guided|bomb|flame> kinetic=<0|1> sound=<WRD event|none> range=<m> ap=<armor piercing, 0 = none> he=<damage vs soft/HP> reload=<s> acc=<hit chance 0..1 at rest>
;          required role: mg|hmg|autocannon|aagun|gun|atgm|atlauncher|rocket|gl|aam|sam|artillery|bomb. No inference from display names.
;          optional: sound_distant=<0|1> aim=<s to lay on a new target> barrel=<N: weapons with the same N share one barrel> minrange=<m, artillery> salvo=<rounds per salvo> ammo=<rounds carried>
; tracks = 1|0: tracked (turns on the spot) or wheeled (turns while rolling, multi-point turns); default:
;          tracked for classes Танк, БМП, САУ, ПТ-САУ (2.13).
; slope = <degrees>: steepest terrain it climbs (2.15); default 30 wheeled, 35 tracked, 45 infantry. Roads always do.
; speeds in km/h; optics = detection range in metres against a normal-size target in the open.
; production_years = <from> <to>: purchase/production window for generated [FL] vehicles; separate from service.
; years = <from> [<to>]: in service (SPEC §5.2, eras.cpp). Units appear in NATO waves and tank HQs only in
;         those years (exceptions in eras.ini); the year is the one the variant entered service.
; turret = auto | none | <node>,<node>,... : nodes of the model that traverse as the turret, the first one
;          being the turret itself (its bbox centre is the axis). Default: auto for class «Танк» (a node named
;          turret, the gun, and what sits inside its footprint), none for the rest. Node list: tools/re/nmfnodes.py.
;          Wheels (nodes named wheel/tire/roller) spin with the ground run on every vehicle (3.5).
; pivot = <x> <z>: the turret axis in model space, when the turret node's bbox centre is off the ring.
; model = srwar/<folder>/main.nmf: a model of the mod's own in SovietRepublic\SRWar\models\<folder>, converted
;          from Wargame: Red Dragon (SRWar_WRD_Port next to this repo). Never shipped: where the files are missing
;          (the public build) the unit is left out of the catalog.

