; ===========================================================================
; PRESTIGE PROJECTS - what a republic builds when it has everything else
;
; Add these to the `list =` line in [institutions] to turn them on, and build
; the buildings under the object names below.
;
; THE POINT OF A CEILING-RAISER. A republic sitting at 100 standing has nothing
; left to want from this system - every further point it earns is thrown away,
; and the last fifty years of a game become bookkeeping. `raises_soviet_max`
; lifts the cap itself, so a monument that takes it from 100 to 120 makes twenty
; points of previously worthless work worth doing again. That is a different
; kind of reward from "earn faster", and it is the one the late game needs.
;
; They are institutions because that is exactly what they are - a building whose
; job is to change a number - so they need no separate system, and every field
; the institutions section documents works here too.
