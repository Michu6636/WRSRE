; Every `prices` line NAMES its resource - `prices = steel:3.5` - and the name
; is resolved against the player's own table when the event first fires. Indices
; still work but should not be used: index 31 is steel here and something else
; on an install with different DLC, and a mod that renumbers the table turns a
; steel shortage into an inexplicably expensive bag of cement.
;
; `prices = <name>:<mult>` moves both currencies; `<name>:<rub>:<usd>` moves
; them separately, which is what a war needs. F10 section 8d lists every name
; your install actually has.
