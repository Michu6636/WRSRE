; ===========================================================================
; DOCTRINE - because pleasing everybody should not be the optimal play
;
; The two standings rise independently, so the dominant strategy has always
; been to max both. Nothing is given up, so nothing is chosen, and a republic
; at 100/100 has answered no question about itself.
;
;   CTRL+SHIFT+F1   align East    soviet earnings x1.5, western x0.4
;   CTRL+SHIFT+F2   align West    western earnings x1.5, soviet x0.4
;   CTRL+SHIFT+F3   non-aligned   both x0.75, and decay halved
;
; Non-alignment is deliberately not the weak middle. It is slower to climb and
; CHEAPER TO HOLD - a republic that never courted anyone has less to lose when
; a bloc turns, which is exactly why states chose it.
;
; Only EARNINGS are scaled. Losses never are: a doctrine changes who rewards
; you, not who can hurt you. And switching is a public reversal - the side you
; leave takes it badly, and you cannot change course again for two years. That
; cost is what stops a player flipping doctrine every time the board rerolls.
; ===========================================================================

[doctrine]

enabled                  = 1
favoured_multiplier      = 1.5
other_multiplier         = 0.4
neutral_multiplier       = 0.75
neutral_decay_multiplier = 0.5
switch_cost              = 15
switch_wait_days         = 720


; ===========================================================================
; TREATIES - standing obligation for standing benefit
;
; A contract is a job: do the thing, be paid, it is over. A treaty is the other
; shape - it costs standing to sign, pays every day it holds, and demands a
; condition stay true for as long as you want the benefit.
;
; WHAT MAKES IT DIFFERENT FROM A BUILDING. A building's effects are yours while
; it stands and demolishing it is free. A treaty can be BROKEN, and breaking one
; costs far more than never signing it - and it is never offered again. That
; asymmetry is the whole mechanic: it is the only thing here that makes a past
; decision expensive to reverse, which is what turns standing from a score into
; a commitment.
;
; The obligation is deliberately something you can fail BY ACCIDENT - letting
; standing drift, demolishing an embassy for space. A treaty you can only break
; on purpose is not a risk, it is a menu.
;
; CTRL+T signs the first one you qualify for; the window lists them in order.
; ===========================================================================

[treaties]

list = comecon_accession, trade_normalisation_pact, comecon_price_protocol, most_favoured_nation, countertrade_protocol, friendship_treaty, non_proliferation, clearing_agreement, neutrality_pact, cultural_exchange, technical_protocol, transit_convention, shipping_agreement, arbitration_accord, mutual_assistance, plan_coordination, energy_protocol, scientific_exchange, border_regime, investment_protection, double_taxation, civil_aviation, standards_recognition, credit_guarantee_framework, socialist_labour_accord, joint_venture_statute, fuel_supply_guarantee, rail_gauge_convention, cultural_house_protocol, veterans_accord, youth_exchange_treaty, agronomy_convention, health_cooperation, river_navigation_pact, consular_convention, patent_convention, maritime_boundary, customs_simplification, banking_correspondence, scientific_publication, environmental_protocol, telecommunications_pact, sports_exchange, emergency_assistance, research_treaty
; ===========================================================================
; SIX MORE TREATIES
;
; A treaty is a standing obligation, not a purchase: signing costs standing,
; keeping it costs keeping standing, and breaking it costs more than it ever
; paid. The list order matters - CTRL+T signs the FIRST treaty you qualify
; for - so the list above is ordered by how much each one demands, hardest
; first, and one press always takes the most serious agreement available.
;
; THE TRAP THIS LIST IS WRITTEN AROUND: keep_standing is tested the morning
; AFTER costs has been taken. Every entry below leaves at least six points of
; margin between (needs - costs) and keep_standing, so a republic that signs
; the moment it qualifies does not lose the treaty overnight.
