; ===========================================================================
; ESPIONAGE
; ===========================================================================
;
; THE SPINE. Standing buys licences, contracts, grants and prices SLOWLY and
; SAFELY. An operation buys the same things NOW, for free, at the risk of the
; relationship that was buying them. The two halves are meant to argue.
;
; And the argument has a shape, which is the whole design: THE BEST TARGETS
; REQUIRE THE BEST RELATIONS. Look at `min_standing` below. You cannot run a
; mole inside a ministry that has never let you in the building. So the way to
; rob a bloc blind is to court it first - and every point you take out of them
; is a point off the access that made it possible. There is no safe farming
; loop in here, only a decision about how far to push a friendship you are
; spending.
;
; WHO IS HOSTILE. The bloc with the LOWER standing is working against you. If
; the two are within `gap_threshold` of each other you are in a DEAD HEAT: no
; patron, and BOTH services working against you. Non-alignment is a posture you
; pay for, not the obvious answer to everything else in the mod.
;
; THE POINTS. Intelligence accrues per day from the Espionage HQ, from any
; listening post, and - slowly - from your own embassies abroad. It caps, so it
; cannot be hoarded across a century; an operation is something you do, not
; something you save up for forever.
;
; THE RISK IS NOT A COIN FLIP. Every launch adds HEAT to that bloc, heat adds
; to the risk of everything aimed at them, and heat decays while you are quiet.
; Three operations back to back are far more dangerous than three spread over a
; year, and because heat is written into the save, reloading does not wash it
; off. What lowers risk: an Espionage HQ (to a floor - three is the most that
; helps), an ACTIVE TRADE CONTRACT with that bloc to hide the traffic inside,
; and a double agent if you ever turn one. What raises it: THEIR embassy in
; your republic, which is the same building that was helping your standing.
;
; BEING BLOWN DOES NOT CANCEL THE PAYLOAD. You stole the process; they merely
; know you stole it. What follows is an INVESTIGATION with a visible countdown
; - and that countdown is the window in which counter-espionage has something
; to do. Feed the investigation (`burns_investigation`) before it lands and the
; penalty never arrives; do it often enough and one of their officers becomes
; permanently yours.
;
; THE WINDOW. F7, or the Intelligence button on the reputation tab. Click a row
; to launch it. Points, heat and any running investigation are always on it.
;
; ---------------------------------------------------------------------------
; EVERY KEY AN OPERATION MAY CARRY
;
;   name, blurb           what the window shows
;   bloc                  who you are working AGAINST - soviet or west
;   days                  how long it runs
;   cost_int              intelligence points, spent at launch
;   risk                  base chance of being blown, BEFORE heat
;   heat                  what launching adds to that bloc's heat
;
;   gain_patron           standing with the OTHER bloc - you sell them the
;                         product. This is the payload that matters.
;   gain_standing         standing with the bloc you are working against
;   gain_rub, gain_usd    money, paid on completion
;   gain_army             army standing (needs [army] enabled = 1 - and note
;                         that nothing reads army standing yet, so this is
;                         flavour until the coup event exists)
;   gain_research         an [unlocks] id, granted outright. It is marked as
;                         YOURS rather than as a plugin grant, so a later fall
;                         in standing can never quietly take it back.
;   burns_investigation   1 = ends one running investigation against that bloc
;   reveals_days          opens the THREAT BOARD for N days - every event that
;                         can roll against this republic, with its real odds
;
;   stand_cost            standing with the target, paid even when it goes clean
;   caught_stand          standing with the target, paid when the investigation
;                         lands
;   on_caught             an event id, started when the investigation lands
;   investigate_min/max   days between being blown and the reprisal
;
;   needs_building        an object that must be standing (matched on the part
;                         after the last "/", like everything else here)
;   needs_op              an operation that must have completed at least once
;   min_standing          standing with the TARGET at or above this. Access.
;   max_standing          ...and at or below this
;   min_year, max_year
;   repeatable, cooldown
; ---------------------------------------------------------------------------

[intel]

enable               = 1

; The points. An HQ is the service; the embassies are what a republic hears
; without one. post_building is a hook for a small listening-post asset - it
; costs nothing while no such building exists, and none does yet: there is no
; [listening_post] section anywhere in this file, so per_post_per_day is
; reserved, not live. Write the section and it starts paying.
;
; ---------------------------------------------------------------------------
; AN OPEN QUESTION, LEFT OPEN ON PURPOSE: WHAT IS A DOLLAR WORTH?
;
; The mirrored operations below pay roubles in the east and dollars in the
; west, and the rate they imply is not the same one twice:
;
;     bank             4,400,000 : 700,000     = 6.29
;     market_sabotage  2,000,000 : 300,000     = 6.67
;     courier          2,000,000 : 400,000     = 5.00
;     trade_secrets    1,500,000 : 350,000     = 4.29
;     mole             9,000,000 : 2,500,000   = 3.60
;
; So the eastern mole pays about 43% less, in real terms, than the western one
; for the same points, the same year of work and the same risk.
;
; This was NOT normalised, because there is no rate to normalise to: the base
; file disagrees with itself as well (its contract payouts imply about 3.0,
; its action costs about 6.7), and picking one silently would be re-pricing a
; third of the espionage table on a guess. Pick a number, put it here, and
; multiply the rouble column by it - the dollar column is the one tuned
; against what dollars actually buy, so it is the better anchor.
; ---------------------------------------------------------------------------
per_hq_per_day       = 1.0
per_post_per_day     = 0.35
per_embassy_per_day  = 0.15
; 150, so a 75-point recruit landing on a part-full store is not thrown away -
; and there is still headroom above the 80 the mole costs.
cap                  = 150
hq_building          = espionage_hq
post_building        = listening_post

; The posture. Within 12 points of each other is a dead heat.
gap_threshold        = 12
gap_hysteresis       = 4

; The pressure. heat_to_risk = 0.01 means ten points of heat is ten points of
; risk; heat_decay = 0.4 means a quiet month sheds twelve.
;
; THE UNITS ARE WHOLE POINTS, not fractions: an operation's `heat` line is 8
; to 25, added as a lump the day it launches, and the bar in the window is
; scaled to 40. So one loud operation is two months of quiet, and three back
; to back genuinely cannot be cleared inside a year. Do not read 0.4 as small.
heat_decay           = 0.4
heat_to_risk         = 0.01
risk_cap             = 0.85

; What moves the risk.
hq_risk_bonus        = -0.04
hq_risk_floor        = -0.12

; THE OTHER END OF THE SAME CLAMP, and the one that was missing. Every bonus
; above is negative and they STACK: three HQs, an active trade contract, a
; turned agent and a veteran team come to about -0.31, which is more than the
; base risk of most of the table. Without a floor, a developed republic ran
; the whole board at 1% and the espionage screen became a vending machine.
;
; It is a FRACTION of each operation's own printed risk, not a flat number, so
; nothing is silently overruled: `listen` says 0.06 and floors at 0.024, `mole`
; says 0.35 and floors at 0.14. 0.40 means no amount of stacking takes more
; than 60% off. Set it to 0 for the old behaviour.
risk_min_fraction    = 0.40

; And an absolute floor under that, so risk_min_fraction = 0 cannot be read as
; "certainty in your favour". Nothing in the plugin divides by this; it is a
; design minimum, and it is clamped to risk_cap on read.
risk_min             = 0.01

; How many Foreign Espionage HQs count. [espionage_hq] max = 1 stops the GAME
; placing a second, but it does not stop an edited ini or an older save, and
; before this the intelligence income and the training slots multiplied off
; the raw count while the risk bonus was already capped at three. One answer
; to "what is an HQ worth", not three.
hq_max               = 3
their_embassy_risk   = 0.05
cover_bonus          = -0.06
agent_bonus          = -0.08
turn_chance          = 0.25

; WHAT THEY RUN AT YOU. The chance is per hostile bloc, per day, and it is
; multiplied by YOUR heat with them and by how many of THEIR embassies you
; let in - both things you chose, which is what keeps it from feeling like
; weather. A Foreign Espionage HQ, or a watch running on that bloc, turns
; the first you hear of it from the day it lands into a countdown you can
; spend points to stop. Set enemy_operations = 0 and the game only ever
; points one way.
enemy_operations     = 1
enemy_chance         = 0.0016
enemy_heat_mult      = 0.03
enemy_embassy_mult   = 0.25
enemy_warn_min       = 12
enemy_warn_max       = 45
enemy_block_cost     = 30
enemy_events         = enemy_sabotage, enemy_agitators, enemy_defection, enemy_smear, enemy_bribery, enemy_blockade, enemy_research_theft

; THE POSTURE, PRICED. Without these two the dead heat was a line of text
; that nothing read. dead_heat_risk is what it costs to have no patron;
; patron_risk is what it costs to rob the side that trusts you - which is
; exactly the side min_standing pushes you towards.
dead_heat_risk       = 0.05
patron_risk          = 0.08

; ---------------------------------------------------------------------------
; OFFICERS - the thing you can lose that is not a number.
;
; Heat decays. Standing recovers. Money comes back. Every other cost in this
; file is reversible, and a system whose every cost is reversible is one the
; player stops reading after an hour. So operations spend PEOPLE as well as
; points: a small pool, named, trained one at a time by the Foreign Espionage
; HQ, tied up for an operation's whole duration, and sometimes lost.
;
; The pool is deliberately small. Scarcity is the mechanic - at ten officers
; every launch is a decision, at twenty-four it is a formality.
;
; Experience matters. A veteran team is measurably safer than a fresh one, so a
; service that has been running a decade is worth something a new one is not -
; and losing three veterans in one blown operation sets it back a decade.
;
; NO HQ, NO NEW OFFICERS, EVER. That is the third job the building does, and
; the one the player feels slowest and hardest.
officers             = 1
officer_cap          = 10
start_officers       = 2
train_days           = 120
train_cost_rub       = 400000

; THE FLOOR THE SCHOOL WILL NOT DIG BELOW. Training runs on its own - no click,
; no confirmation - and over a long game it takes 400,000 roubles out of the
; treasury eight or ten times, in instalments a player who has never opened
; this tab cannot connect to anything. The service stops hiring while the till
; is at or below this, and says so once when it does. Set it to 0 if you would
; rather the school spend the last rouble in the republic.
train_reserve_rub    = 1500000
veteran_ops          = 3
veteran_risk         = -0.05
rookie_risk          = 0.06
officer_loss_chance  = 0.35

; Where an operation is said to have gone, for the dispatch lines. "Halasz did
