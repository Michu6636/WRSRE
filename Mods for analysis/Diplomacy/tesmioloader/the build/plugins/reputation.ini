; ===========================================================================
; THE NOTIFICATION BAR
;
; The strip of little icons along the bottom of the screen - the fire, the
; power cut, the train stuck at a signal. Every event this mod starts now
; appears there too, with its name, its blurb, and one line saying what it
; actually does: the same line the Events page shows.
;
; The mod does not draw any of this itself. It builds one of the GAME'S own
; notification objects and hands it to the game's own code, so it looks like
; a fire, behaves like a fire, is clicked and dismissed like a fire, and is
; saved with the republic like a fire.
;
; IF THEY NEVER APPEAR, reputation.log says which of four reasons it is: the
; feature is off, the game is refusing notifications for a moment, the day's
; ration is used up, or the addresses in [sites] are wrong for your build.
; ===========================================================================
[notify]

; The whole feature. 0 and the plugin never touches the game's bar at all.
enabled     = 1

; Events specifically. Everything the mod says still goes to the standing
; window's dispatch box and to reputation.log whatever this is set to.
events      = 1

; Contracts (step 212): a big one when it reaches the board, a medium or
; big one when it is met or failed - see notify_offer / notify_result in
; [sizes]. 0 keeps contracts off the bar entirely.
contracts   = 1

; WHICH ICON. The game keeps one picture per warning type and picks it with
; this number. The mod borrows one rather than shipping its own:
;
;    1  people        policy, unemployment, crime
;    2  railways      signals
;    3  buildings     electricity
;    4  traffic       jams and collisions
;    7  services      heating, power, rubbish
;    8  mood          happiness and loyalty          <-- the default
;    9  health        illness, ambulances
;
; ANY NUMBER IS SAFE HERE. The game checks it against its own live list before
; drawing anything, so a number it does not recognise costs you the picture
; and nothing else. 0 means no icon.
icon        = 8

; WHICH COLOUR - and this one is not cosmetic. The game has four notification
; colours with a separate on/off switch for each in ITS OWN settings, so a
; colour whose switch the player has turned off is built, posted, and never
; drawn. That looks exactly like the feature being broken.
;
;    0  yellow    what most of the game's own notifications use   <-- default
;    1  red       the game keeps this for the serious ones
;    2  green
;    3  blue      the game never uses it, so it stands out as clearly not one
;                 of the game's own - but it is also the switch most likely
;                 to be off, so check before you trust it
colour      = 0

; HOW MANY A DAY. The game writes every notification into the save file whole,
; and one of them is seventeen kilobytes, so this is a limit on the size of
; your save as much as on the number of interruptions. Anything past it still
; reaches reputation.log and the dispatch box. 0 = no limit.
max_per_day = 6

; ONE ON EVERY SAVE LOAD, so you can find out whether the bar works on your
; machine without waiting years of game time for an event to roll. Turn it
; back off once you have seen it.
test        = 0


[trace]

enabled = 0
days    = 200



; ===========================================================================
; WHAT STANDING UNLOCKS - new in 1.43
;
; MORE TOURISTS, done in the game's own terms.
;
; The world carries one byte per research: the game sets it when the research
; completes, and everything downstream reads the byte rather than re-checking
; the research. The whole block was found by disassembling the routine that
; sets them, so these are the game's offsets and not a guess:
;
;   0x1175C hardening            0x11761 increase_natality
;   0x1175D vitanims             0x11762 decrease_natality
;   0x1175E vaccination_citizen  0x11763 alcohol_standards
;   0x11764 fertilizing          0x11765 woodcutting_planting
;   0x11767 tourist_visa_west    0x11768 tourist_visa_east
;   0x11769 advert_campaign_west 0x1176A advert_campaign_east
;   0x1176B pollution_filters    0x1176C fire_prevention_industry
;   0x1176D fire_prevention_civil 0x1176E fire_prevention_residential
;   0x11770 waste_separation_2   0x11771 newrailtrack
;
; A republic the west is pleased with gets its visa and its advertising, and so
; gets its tourists. One that has fallen out does not. That is a real increase
; in visitor numbers, produced by the game's own tourism system rather than by
; writing a number into a field nobody has found.
;
; IT ONLY EVER GRANTS WHAT IT GAVE. If a flag is already set the first time the
; plugin looks, you researched it yourself and it is yours - the plugin will
; never clear it, whatever happens to standing. Only a flag this plugin set is
; one this plugin may take back.
;
;   offset        world+, from the table above. Anything outside
;                 0x11000..0x12000 is refused as a typo - a stray 1 written
;                 into the world is not something to debug from a save file.
;   bloc          which standing is tested
;   needs         at or above this, it is granted
;   revoke_below  and below this it is withdrawn again. Defaults to needs-10,
;                 so there is a band where it neither arrives nor leaves and
;                 standing wobbling across a threshold does not flicker it.
;   mode          grant   (default) standing hands you a research you have not
;                         done. A research you HAVE done is never touched.
;                 require the reverse, and the one to reach for if what you
;                         want is "you must have standing 40 to get the visa":
;                         the research is yours, you spent the points, but it
;                         does nothing until the diplomacy allows it. The flag
;                         is only ever held DOWN, never cleared for good, and
;                         it is released the moment the standing is earned or
;                         the republic is closed.
;                 both    grants it early AND holds it if you fall too far.
;
; The two natality flags are listed and commented out. They work exactly the
; same way, and whether a diplomacy mod should be setting your birth rate is a
; decision rather than an oversight.
[unlocks]

list = visa_west, advert_west, visa_east, advert_east, science_first_aid, science_vitanims, science_fertilizing, science_alcohol_standards, science_hardening, science_vaccination, science_forestry, science_rail, science_filters, science_waste

; THE LADDER, and one number worth thinking about before you play with it.
;
; The game gives three rungs and no slope: no visa is ZERO tourists from that
; bloc, the visa is the normal number, the advertising campaign doubles it.
; That is the whole of the game's own tourism control - read out of the routine
; at RVA 0x185100, which returns 0 outright if the visa byte is clear.
;
; So standing drives the ladder:
;
;     below `needs` on the visa   no tourists from that bloc at all
;     at or above it              the normal number
;     at or above the campaign    twice that, for as long as you hold it
;
; MODE = REQUIRE on the visas is what was asked for - "you should need 40 to
; get the visa". Be aware of what it means: a republic starts on 20, so with
; needs = 40 there are NO western tourists until diplomacy earns them, and they
; stop again if standing falls back. If you would rather the starting republic
; had its normal tourists and standing only ever ADDED, set needs = 20 here, or
; change mode to grant and let the research tree gate it as it always did.
;
; SINCE STEP 209 A HELD VISA IS ENFORCED AT THE BORDER - see [tourism]
; visa_hook. Before that it was a byte the game put back every midnight,
; and tourists kept coming.
;
; The campaigns sit well above the visas on purpose, so the two rungs are a
; real progression rather than two thresholds you cross in the same season.
[visa_west]
offset       = 0x11767
bloc         = west
mode         = require
needs        = 40

[advert_west]
offset       = 0x11769
bloc         = west
needs        = 60
revoke_below = 45

[visa_east]
offset       = 0x11768
bloc         = soviet
mode         = require
needs        = 40

[advert_east]
offset       = 0x1176A
bloc         = soviet
needs        = 55
revoke_below = 42

