; ===========================================================================
; CHEATS
;
; Openly a cheat menu, and that is the point. This mod is a simulation of slow
; relationships; somebody who wants to see the late-game content, test an ini
; of their own, or recover a save a bad run ruined should not have to play
; forty hours to get there.
;
; Everything pressed on it is written to reputation.log and marked in the save,
; so a bug report from a cheated republic is not mistaken for a bug in the
; simulation. Set enable = 0 and the Cheats entry on the strip goes grey and
; stops responding.
;
; THE CITIZEN ROWS AT THE BOTTOM ARE DIFFERENT, and worth reading before they
; are pressed. They do not move a number the plugin owns - they write the nine
; per-person statuses straight into every citizen in the republic, twenty
; thousand people at a time. They exist so that "the Espionage HQ raises
; loyalty and puts down crime" can be seen working before it is wired to the
; building, and so that the nine bars on the population page can be named by
; raising one and watching which one moves.
;
; They do nothing at all unless [debug] citizen_fingerprint = 1 has found the
; citizens in memory in THIS session, on a save that was LOADED - they never
; use an address remembered from before a load. The window says which array it
; is pointed at and whether that array has been seen to move on its own, which
; is how a live republic is told from the leftover copy of the save file the
; loader may have left lying about.
;
; The last row puts every value back as it was, from a copy taken before the
; first write - and if that copy could not be made, the write does not happen.
; Even so: use a save you would not mind losing.
[cheats]

enable = 1


; ===========================================================================
; EVENTS, PART FIVE - THE PEOPLE
;
; The first events gated on the population itself rather than on the date,
; the blocs or a chain. min_loyalty, max_loyalty, min_crime and max_crime are
; fractions, so 0.45 is 45%, and they are read from the same two numbers the
; Standing page shows.
;
; A REPUBLIC LIKE THIS ONE runs at about 53% loyalty and 4% crime, and that is
; ordinary rather than good. Every threshold below is set against those two,
; so nothing here fires in a normal year. They are what a republic earns by
; letting things slide, or by holding them unusually tight.
