; ===========================================================================
; THE TRACE
;
; reputation.log records what happened. The trace records WHY, in enough detail
; that somebody who is not sitting at this machine can find a bug in it.
;
; Every number the plugin derives is written down next to the numbers it came
; from: the raw vector reads, the price used for each tons-to-roubles
; conversion, each contract's target and exactly what today added to it, the
; decay before and after every multiplier, and every contract the board
; REJECTED with the test that rejected it. That last one matters - a board full
; of `locked` used to look like the plugin being broken, when it was one
; condition failing quietly.
;
; It writes reputation-trace.txt beside the log. Verbose on purpose: expect
; roughly ten to forty lines a game day. Capped at `days`, after which it stops
; by itself rather than filling the disk - delete the file and reload to start
; again.
;
; Turn it on when something looks wrong and you would rather send a file than
; describe the symptom.
; ON while the trade code is new. TURN THIS OFF BEFORE PUBLISHING - it is a
; development instrument, and a subscriber gets nothing from it but a file that
; grows all game.

; ===========================================================================
; ALLIANCES - new in 2.1
