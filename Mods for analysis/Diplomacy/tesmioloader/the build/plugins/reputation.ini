; ---------------------------------------------------------------------------
; GRANTS
;
; The other direction of the currency. A licence turns standing into access; a
; grant turns it into money. Both are permanent spends - what stops a grant
; being an infinite tap is `cooldown`, so a republic can lean on its friends
; occasionally without living off them.
;
; Asked for in the F9 window: hold CTRL and SHIFT and press the number.
;
;   bloc       soviet | west - whose standing pays, and in whose currency
;   cost       standing it takes, and does not give back
;   pay_rub    what arrives in the treasury
;   pay_usd
;   cooldown   days before that bloc will hear the same request again
;
; The rate matters more than the numbers: at 8 standing for 1.5m roubles, a
; year of good trading buys about one grant. Raise `cost` if your republic is
; living on them.
; ---------------------------------------------------------------------------

[grants]

list = fraternal_aid, development_credit, currency_swap, reconstruction_loan, clearing_balance, technical_assistance, machine_tool_credit, comecon_settlement, plan_advance, grain_credit, supplier_credit, export_credit_guarantee, eurodollar_syndication, imf_standby, solidarity_fund, barter_settlement, friendship_transfer, correspondent_account, bond_placement, bridge_facility, plan_overfulfilment, comecon_investment_bank, friendship_pipeline_advance, gosbank_overdraft, commodity_advance_east, military_aid_offset, export_import_bank, commercial_paper, syndicated_term_loan, trade_finance_line, sovereign_placement, dollar_swap_line, union_budget_transfer, ministry_discretionary, five_year_plan_reserve, fraternal_disaster_relief, rouble_clearing_advance, heavy_industry_allocation, agricultural_subsidy_east, technology_transfer_fund, strategic_stockpile_loan, party_solidarity_levy, merchant_bank_facility, private_placement_notes, buyer_credit_line, revolving_credit, project_finance_package, commodity_prepayment, development_agency_grant, consortium_bridge, reinsurance_facility, central_bank_deposit
; ===========================================================================
; TEN MORE WAYS TO TURN STANDING INTO MONEY
;
; The four above are the obvious ones. These are the instruments a small
; planned economy actually had, and they differ on three axes rather than
; one: what they cost in standing, what they pay, and how long they are gone
; for afterwards. There is no best grant on this list - there is a cheap one
; you can take again soon, and an expensive one that pays properly and then
; shuts the door for three years.
;
; Soviet money is plentiful, cheap in standing, and roubles. Western money is
; dearer, worth more per point spent, and dollars.
; ===========================================================================

