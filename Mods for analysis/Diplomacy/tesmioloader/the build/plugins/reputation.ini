once                   = 1
category               = war

; Steel, chemicals, fuel - what the war eats. Astronomical to import.
; Replace 31/12/25 with the real indices from F10 section 8d.
prices                 = steel:3.5:9.0, chemicals:3.0:8.0, fuel:2.5:7.5

; ...and no reputation cost for selling weapons. Everyone is doing it.
arms_penalty_mult      = 0.0

; Diplomacy is not the priority. Standing stops decaying.
decay_multiplier       = 0.0

; Contracts pay what they have to.
contract_pay_mult      = 2.5
contract_standing_mult = 1.5

birth_rate             = 0.55
emigration             = 1.8
happiness_per_day      = -0.002


