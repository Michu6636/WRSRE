; ===========================================================================
; [people] - WHAT THE POPULATION DOES TO THE REPUBLIC
; ===========================================================================
;
; [population] above is the mod writing to the people. This is the people
; writing back. Until this section existed, loyalty and criminality were
; numbers the Espionage HQ moved and nothing whatsoever followed from where
; they ended up.
;
; EVERYTHING HERE IS MEASURED AGAINST THE REPUBLIC'S OWN BASELINE - the
; average it had before anything was done to it, measured once and kept in
; the save. A republic that simply happens to run at 48% loyalty is not a
; republic in trouble; one that has fallen eight points from where it started
; is. An absolute threshold would punish one map's starting conditions and
; reward another's, and the player could do nothing about either.
;
; EVERYTHING HERE IS ZERO WHEN THERE IS NO READING. Until the citizens have
; been found - a new republic, a save loaded before the hunt has run, a list
; that went away - every number below does nothing at all.
;
; enabled = 0 turns the whole feedback off and leaves the reading on screen.

[people]

enabled = 1

; CONTRACTS. Loyalty above baseline adds to what contracts pay; crime above
; baseline takes off it, because pilferage is not a metaphor - goods walk off
; a siding and the consignment arrives short. Only crime ABOVE baseline
; counts: below it the republic is merely normal, and normal is not a bonus.
;
; At ten points of loyalty over baseline: +3%. At three points of crime over
; it: -6%.
loyalty_to_pay  = 0.30
crime_to_pay    = 2.00
pay_floor       = 0.80
pay_cap         = 1.12

; MOSCOW. A republic whose people believe in it is a better ally and is
; treated as one. At ten points over baseline this is +0.003 a day, against a
; passive decay of 0.01 - about a third of the drift, and it runs backwards
; just as readily.
loyalty_to_soviet = 0.030

; THE WEST. They do not care whether your people love you. They care whether
; their consignments arrive, so it is crime that moves this one - and only
; upward crime. At three points over baseline, -0.006 a day.
crime_to_west = 0.200

; THE OPERATIONS. A republic with a black market in it has people who will
; carry a message for money, and some of them carry it both ways. At three
; points of crime over baseline, every operation is 3 percentage points
; riskier.
crime_to_risk = 1.00

; THE HEAT. What the other side is looking at cools faster in a republic
; where nobody wants to talk to them, and lingers in one where everybody
; does. At ten points of loyalty over baseline, heat cools 15% quicker.
loyalty_to_heat = 1.50


; ===========================================================================
; EVENTS, PART SIX - THE PEOPLE ARRIVE, AND THE PEOPLE CHANGE
;
; Everything below writes the nine per-person statuses through status_bonus.
; The value is DISTANCE FROM THIS REPUBLIC'S OWN AVERAGE, not an absolute:
; happiness:-0.08 aims eight points under whatever this republic's happiness
; was on the day the citizens were found, and every citizen takes one step a
; day towards it for as long as the event runs.
;
; WHEN IT ENDS the mod walks that status back towards the baseline for
; [population] recovery_days and then lets go. Without that, a good summer in
; 1988 would have left the republic permanently devout, because nothing in
; this plugin knows whether the game re-simulates religion sympathy on its own.
;
; THE NINE, and this republic's averages, for scale:
;   happiness 89.5   satiated 94.9   health   89.7
;   loyalty   50.4   alcohol   3.7   culture  91.5
;   sports    93.3   religion 14.7   clothing 86.3   criminality ~4.0
;
; So there is five to fourteen points of room upward on most of them and a
; great deal downward, and the reverse on loyalty, alcohol and religion. The
; target is clamped to 0..1, so asking for satiated:+0.10 on a republic at
; 94.9% quietly gets 5.1 of it. Nothing here asks for more room than there is.
; ===========================================================================


; ---------------------------------------------------------- PEOPLE ARRIVING
;
; THE HONEST PART FIRST: the mod cannot put a person into a running game.
; There is no way to spawn a citizen - they are individually allocated objects
; the game owns through a pointer array, and adding one means calling the
; game's own constructor and registering it in a dozen places, which is a
