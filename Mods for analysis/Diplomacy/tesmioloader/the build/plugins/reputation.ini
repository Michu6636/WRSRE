; reputation 1.26 - LIVE
;
; UTF-8 without a BOM. Never write this file with PowerShell's -Encoding UTF8:
; 5.1 adds a BOM, the first section header stops matching and every setting
; silently falls back to its default.
;
;
; THIS BUILD WRITES TO THE GAME. `dry_run = 0` below.
;
; What it writes: the first-available YEAR on vehicle type records, and money
; where a contract, a grant or an event says so.
;
; Vehicle type records are built from each vehicle's script.ini when the game
; starts and are NOT part of a save. So every write there is session-only -
; restarting the game restores all of them no matter what state they are left
; in, and leaving to the menu restores them too. Nothing can be permanently
; damaged by the gate.
;
;
; WHAT THIS MOD ADDS, IN ONE PLACE
;
;   STANDING     two numbers, soviet and western, running -50 to 100 and both
;                starting at 20. Earned by importing and by buying vehicles,
;                lost slowly every day, and SPENT - a currency, not a score.
;                Below zero that bloc's border closes.
;
;   LICENCES     vehicles are grouped into tiers, and a tier is bought, not
;                reached. Holding the threshold is what gets you offered it;
;                buying it takes that standing permanently. The Soviet light
;                tier is granted at the start so a new republic can move.
;
;   BLUEPRINTS   a single named vehicle, licensed on its own for standing AND
;                money together, on its own key with its own paged window.
;
;   GRANTS       standing turned back into money, on a cooldown.
;
;   CONTRACTS    a board of offers that rotates monthly unless taken, and runs
;                its full term once accepted. 47 of them across 16 kinds.
;
;   EMBASSIES    two buildings in media_soviet\workshop_wip\9900000101. Each
;                slows its own bloc's decay, up to three, and no bloc offers
;                contracts to a republic with no mission of its.
;
;   INSTITUTIONS any other building, declared in [institutions], changing decay,
;                contract payouts, export income or tourism. This is how the
;                Foreign Relations HQ and the Espionage HQ arrive - as content,
;                not as code.
;
; Building credits, in full, are in
;   Workers And resources Program\BUILDINGS-MANIFEST.txt
; Every borrowed model is listed there with its author and the conditions the
; permission was given under - including Shotkey's, which REQUIRES that
; https://boosty.to/shotkey is credited on the Steam page.
;
;   EVENTS       dated or rolled, with per-day effects on standing and money.
;
;
; SEEING IT - three windows, all rebindable in [keys] immediately below.
;
;   F9   standing, contracts, licences, grants. Cycles full - compact - off.
;   F10  six diagnostic pages, and writes reputation-debug.txt.
;   F11  the vehicle blueprint list, paged.
;
;   Every row of a vehicle purchase list also gains its bloc and what the next
;   unbought licence for that bloc would cost, and reputation-status.txt beside
;   this file is rewritten every in-game day.


; ---------------------------------------------------------------------------
; FOR OTHER MODDERS
;
; Nobody has to edit this file. Anything dropped into
;     tesmioloader\build\plugins\reputation.d\*.ini
; is read exactly like this one - same sections, same keys - and is not touched
; when this plugin updates. An id another file already defined is refused
; rather than overridden, and the loader log names the file that was ignored.
; See example-mod-events.ini in that folder.
; ---------------------------------------------------------------------------

; ===========================================================================
; KEYS - change any of these; 0 disables that binding entirely
;
; Values are Windows virtual-key codes in hex. The ones you are most likely to
; want:
;
;   F1..F12   0x70 0x71 0x72 0x73 0x74 0x75 0x76 0x77 0x78 0x79 0x7A 0x7B
;   1..8      0x31 0x32 0x33 0x34 0x35 0x36 0x37 0x38
;   A..Z      0x41 is A, 0x42 is B ... 0x5A is Z
;   CTRL 0x11   SHIFT 0x10   ALT 0x12
;   PAGEUP 0x21   PAGEDOWN 0x22   HOME 0x24   END 0x23
;   INSERT 0x2D   DELETE 0x2E   TAB 0x09   BACKSPACE 0x08
;
; HOW THE ACTION KEYS COMBINE
;
;   modifier + slot1..8            accept the contract on that row
;   modifier + grant_modifier + slot1..8       ask for that grant
;   modifier + blueprint_modifier + slot1..8   buy that blueprint
;   modifier + licence1..8         buy that vehicle licence
;   modifier + rescan_embassies    look for newly finished embassies
;
; The bare number keys are never taken - they belong to the game, and accepting
; a contract by accident while driving the camera would be worse than having no
; shortcut at all.
; ===========================================================================

[keys]

; The three windows. Each toggles on its own; page_up / page_down turn pages in
; whichever of them is open, with no modifier held.
window     = 0x78      ; F9  - standing, contracts, licences, grants
debug      = 0x79      ; F10 - the six diagnostic pages, and writes the report

; THE NAME OF THIS KEY CHANGED. It used to be written "blueprints" here, which
; the plugin never read - the setting looked editable and was a silent no-op.
; There are two blueprint windows now, one per bloc, so there are two keys.
blueprints_soviet = 0x7A   ; F11 - eastern vehicles
blueprints_west   = 0x7B   ; F12 - western vehicles

sign_treaty       = 0x54   ; T, with CTRL - signs the first treaty you qualify for
contracts         = 0x77   ; F8  - what every running contract needs, and how far along it is
intelligence      = 0x76   ; F7  - operations, heat, and the threat board
                           ;       Plain F7. CTRL+F7 is licence7 and stays licence7.

; The vehicle window's cursor. No modifier to MOVE it - scrolling a list is
; not an action that spends anything - but CTRL is held to buy, because that
; one does.
cursor_up    = 0x26    ; UP
cursor_down  = 0x28    ; DOWN
buy_selected = 0x0D    ; ENTER, with CTRL - buys the row the > is on

page_up    = 0x21
page_down  = 0x22

modifier           = 0x11    ; CTRL, held for every action below
grant_modifier     = 0x10    ; SHIFT, held as well, to ask for a grant
blueprint_modifier = 0x12    ; ALT, held as well, to buy a blueprint

rescan_embassies   = 0x45    ; E

slot1 = 0x31
slot2 = 0x32
slot3 = 0x33
slot4 = 0x34
slot5 = 0x35
slot6 = 0x36
slot7 = 0x37
slot8 = 0x38

; The licence keys double as the doctrine keys when SHIFT is also held:
; CTRL+SHIFT+F1 east, F2 west, F3 non-aligned. That needs no bindings of its
; own, so remapping licence1..3 remaps the doctrine keys with them.
licence1 = 0x70
licence2 = 0x71
licence3 = 0x72
licence4 = 0x73
licence5 = 0x74
licence6 = 0x75
licence7 = 0x76
licence8 = 0x77


[reputation]

enabled = 1

; DOES RESEARCH MEAN ANYTHING IN THIS REPUBLIC?
;
; A republic started WITHOUT "need research to issue visa for tourists"
; skips every research effect in the game: the visas cannot keep tourists
; out, the advertising campaigns cannot double them, and birth_rate cannot
; move the natality research. That is one byte, world+0x14453, and 47
; places in the game read it.
;
;    1  turn it ON, so the diplomacy actually bites   <- the default
;   -1  leave the rule exactly as you chose it
;
; ON by default, because with it off three of this mod's features are
; silently no-ops on most republics and there is no way to tell from
; inside the game.
;
; YOUR SAVE IS NOT CHANGED. Only the live byte at world+0x14453 is
; written - never world+0xC851, which is the SAVED setting behind the
; checkbox and would ride out in your next autosave and outlive the mod.
; The live byte is put back when the world closes, and uninstalling
; leaves the republic exactly as it was.
;
; WHAT YOU WILL NOTICE: tourists stop arriving from a bloc until you hold
; the standing its visa asks for - 40 by default, see [unlocks]. If your
; republic lives on tourism and your standing is low, set this to -1 or
; lower the visa thresholds.
research_rules = 1

; 1 = compute everything, write nothing. Leave this at 1 for the first run.
dry_run = 0

; 1 = the daily report. 2 also logs every file opened under media_soviet\save,
; which is only worth turning on if standing is not surviving a save.
probe = 0

persist = 1

; CONFIRMED, so leave it at 1. The world saver at 0x42CC70 writes the save
; header with `movsd xmm0,[rdi+0x580]` and `movsd xmm1,[rdi+0x588]` - movsd is
; a scalar double, so both balances are doubles and nothing needs testing.
money_double = 1
; HOW TRADE IS COUNTED. 1 reads the game's own import and export
; vectors, which is exact. 0 falls back to watching the treasury
; move, which is what older builds did and what to try if trade
; contracts never make progress on a modded build.
trade_vectors = 1

; A blunt experiment: set this to a year and EVERY gated vehicle's first
; available year is forced to it, tiers ignored. If the purchase list then shows
; that year, writing the record is reaching the interface; if it does not, the
; vector is still wrong. 0 disables it. This is a diagnostic, not a feature.
test_year = 0

; SEEING IT
; There are now three ways.
;
;   1. An OVERLAY in the game. F9 cycles full window / compact / off.
;   2. Every row of a vehicle purchase list gains its bloc and the cost of the
;      cheapest licence for that bloc you have not bought - "USA - west,
;      licence 20".
;   3. reputation-status.txt, rewritten in this folder every in-game day, with
;      the last 48 things that moved standing. Leave it open beside the game.

; STANDING RUNS -50 TO 100, and both sides start at 20.
;
; Below zero is not just a small number - it is a state. A bloc at or under zero
; closes its border:
;
;   * it sells you no vehicles at all, licences bought or not. The licences are
;     not lost; they simply cannot be used until you are back above the line.
;   * it pays you nothing for your goods. Exports to that bloc earn no money.
;   * the only contracts it offers are the ones for getting back, which pay
;     almost no money and a great deal of standing - and which do NOT need an
;     embassy, so a republic that has burned everything still has a road out.
;
; Decay stops at zero and never pushes you under on its own. Getting there takes
; something you did: a failed contract, an event, or selling arms to the other
; side once that industry exists.
min = -50
max = 100
soviet_start = 20
west_start   = 20


; --- passive loss, and the embassy ------------------------------------------
;
; Standing decays every day unless something holds it up, but only DOWN TO ZERO
; - decay never takes a republic into the red by itself. An embassy divides the
; loss: with relief 1.0, one embassy halves it, three quarter it.
;
; Each bloc's decay is slowed by ITS OWN embassies, so a republic that builds
; only Soviet missions keeps its standing in Moscow and still bleeds it in the
; west. That is the whole reason there are two buildings.
;
; THE EMBASSIES ARE FOUND BY THEIR OBJECT NAME.
;
; Both are $TYPE_ATTRACTION, which puts them in the same bucket as every art
; gallery in the game, so a type number cannot tell them apart. What can is the
; name - but NOT the one on the building's title bar.
;
; A building type descriptor holds its OBJECT name in a plain character buffer
; at offset 0: the folder name, the one $OBJECT_BUILDING declares. The debug
; report shows exactly this - "zoll_air_soviet", "DLC3_customs_small",
; "civ_kostolik". The $NAME_STR display name is nowhere in the descriptor, and
; the title bar shows the CITY as well ("Chichita Soviet Embassy"), so neither
; was ever going to match.
;
; WORKSHOP CONTENT IS PREFIXED WITH ITS ITEM ID. The real object names are
; "embassy_soviet" and "embassy_west", the same way every
; other workshop building in the report reads "3744819159/HOUSE2". The plugin
; accepts either the whole name or just the part after the last slash, so the
; short form below works and keeps working if that item id ever changes.

decay_per_day   = 0.01

; WHERE DECAY STOPS. It used to stop at zero, which sounds harmless and is not:
; a republic that never touches diplomacy ends up a pariah, and what is being
; modelled is two blocs not thinking about you much either way. Below the floor
; standing moves only because of something you did - a failed contract, an
; event, arms sold to the other side.
;
; 10 is deliberately below the 20 both sides start you on, so neglect still
; costs you the opening credit. decay_floor = 0 restores the old behaviour.
decay_floor     = 10

; A CEILING ON THE LOSS, the mirror of max_gain_per_day below.
;
; This exists because of a real bug: the plugin numbered days as year*400+day,
; so the step from 1924-364 to 1925-000 measured 36 days instead of 1 and
; charged thirty days of decay in a single tick - the -0.600 that appeared in
; the ledger every new year. The arithmetic is fixed, but a single tick should
; never be able to undo a season's work whatever goes wrong upstream, so the
; ceiling stays.
max_decay_per_day = 0.10

; Each embassy divides the loss: with relief 1.0, one halves it, two thirds it,
; three quarters it. THREE IS AS MUCH AS IT HELPS - without a ceiling the right
; play is simply to keep building them, which is not a decision, and a fourth
; would be buying almost nothing anyway.
embassy_relief  = 1.0
embassy_max     = 3
embassy_soviet  = embassy_soviet
embassy_west    = embassy_west

; Counting embassies is cheap; going looking for a type never seen before is
; not, so the search stops as soon as it succeeds and does not repeat. After
; finishing a new embassy, press CTRL+E in the F9 window to look again.

; No mission, no contracts from that bloc. Set to 0 to have contracts offered
; on standing alone.
;
; THE ENTRY-LEVEL CONTRACTS ARE EXEMPT, since 1.41. A new republic starts on 20
; and 20 with no buildings, which used to mean an empty board and every line
; reading `locked` - not hostile enough for the pariah waiver, not established
; enough to have a mission. A contract that asks for no standing is the way in,
; so it does not also get to ask for a building. Everything above zero standing
; still needs the embassy.
contracts_need_embassy = 1

; The old type-number path, kept for anyone pointing this at a stock building
; instead. -1 is off, 20 is the customhouse.
embassy_type   = -1


; --- what earns standing ----------------------------------------------------
;
; You are liked by whoever you BUY from. Exporting earns money, not friends,
; so the export coefficients are zero on purpose - set them if you disagree.
;
; SINCE 1.41 THIS IS THE REAL FIGURE, per resource and per direction.
;
; It used to be the day's net treasury change, which meant a republic that
; imported two million roubles of steel and sold three million of tractors
; registered no imports at all. Every `kind = import` contract sat at zero, and
; buying from the east earned nothing.
;
; The game keeps import and export as std::vectors of (resource, tons) hanging
; off its statistics record - which is why watching memory for a counter never
; found one. The offsets came out of SOVIET64.exe's own save loader, which is a
; chain of "is this key $Resources_ImportRUB? then parse into +0x38". Roubles
; are trade with the east, dollars with the west, and tons are priced at what
; you are actually paying, so an event that makes steel dear also makes buying
; it worth more standing.
;
; trade_vectors = 0 goes back to the treasury approximation. There is no reason
; to do that except a future game build moving the record, and the log says so
; loudly if it ever cannot read it.
;
; Standing is meant to be the work of years, not of an afternoon - which is
; what the ceiling below is really enforcing.

; THE CEILING THAT MAKES THE RATES SAFE.
;
; On 1924-334 the republic spent $8.4m in one day. At the old rate that was
; worth +844 standing: west went from 45 to the cap of 100 in a single tick and
; the currency stopped meaning anything at all. Turning the rate down far enough
; to survive that day would have made an ordinary day worth nothing, so the
; ceiling lives here instead: earn at a rate that suits a normal week, and no
; single day can ever be worth more than this however large the transfer.
;
; Contract payouts and event effects are NOT capped - those are authored
; numbers, and a contract that promises 7 points pays 7 points.
max_gain_per_day = 1.5

; --- PEOPLE, not money ---------------------------------------------------
;
; Trade says you are a useful market. Letting your citizens meet foreigners -
; and letting foreigners in to be met - is a political statement, and both
; blocs read it as one. So visitors and guest workers earn standing in their
; own right, per head, per day.
;
; Tourists count towards whichever side they arrived from: the record separates
; those paying in dollars from those paying in roubles. Guest workers count
; east, because that is who sends them.
;
; These are per HEAD and deliberately generous relative to the trade rates - a
; hundred western tourists in a day is worth about as much as a quarter of a
; million roubles of imports, and it should be: one is a transaction and the
; other is a country deciding you are somewhere its people may go.
;
; Institutions scale the tourist half through tourism_mult, so a Foreign
; Relations HQ makes visitors worth more as well as more numerous.
west_per_tourist        = 0.0025
soviet_per_tourist      = 0.0015

; A permanent immigrant, counted from the record's own migration figures.
soviet_per_immigrant    = 0.0040

; GUEST WORKERS, which are a different thing and arrive a different way.
;
; In this game a foreign worker is bought like any other commodity: `workers`
; is a resource, and a customs house set to import it brings people across the
; border by the lorryload. The trace from Daniel's own save shows 1953 of them
; arriving in one day at 9.88 roubles each.
;
; So the trade vectors already count them, exactly, and already know which side
; they came from - roubles bought them from the east, dollars from the west. No
; separate mechanism, no new offset. It is the customs house doing what it
; already does, finally being noticed.
;
; Per worker, so keep these small - a thousand arrivals a day at 0.00015 is
; about a sixth of a point, which over a year of open borders is substantial
; without being free.
worker_resource         = workers
soviet_per_guest_worker = 0.00015
west_per_guest_worker   = 0.00025

; Divided again in 1.8. With the ceiling above doing the work of catching
; outliers, these only set how quickly an ordinary week approaches it.
soviet_per_rub_import  = 0.0000004
west_per_usd_import    = 0.0000040

; Vehicles counted on top, from the game's own Vehicles_Import counters.
soviet_per_rub_vehicle = 0.0000020
west_per_usd_vehicle   = 0.0000200

soviet_per_rub_export  = 0.0
west_per_usd_export    = 0.0

; A day that moved a balance by less than this is treated as no movement.
deadband = 1

; How many vehicle records to print in full at world load, and whether to
; report the statistics fields that moved each day.
dump_vehicles = 12

; reputation-vehicles.txt - every object name in your installation,
; with its bloc and years. That is what somebody writing blueprint
; entries needs, and it was being rebuilt on every world load whether
; anyone wanted it or not. Turn it on for ONE load when you need the
; names; the file stays behind after you turn it off again.
write_vehicle_index = 0
dump_stats    = 1


; --- the sites --------------------------------------------------------------
;
; Read off SOVIET64.exe v1.1.1.9, stamp 0x6A3EB6AD, by string cross-reference.
; Here rather than in the source so a game update is an edit, not a rebuild.
;
; The vehicle record offsets are compiled in because they were derived
; together: cost USD +0x85BC, cost RUB +0x85C0, available-from year +0x9B50,
; day +0x9B54, available-to year +0x9B58, day +0x9B5C, lifespan +0x9EF4,
; record size 0x9F08.

[sites]

build_stamp    = 0x6A3EB6AD

; The world is a static object living INLINE in .data - there is no pointer to
; it. The per-frame update at 0x30D1A0 is called from one place, 0x105F45, and
; the instruction before that call is `lea rcx,[rip+0x8cefcb]`, which resolves
; here. Four builds of this plugin searched for a pointer that never existed.
; Set world_is_pointer = 1 only if a future build makes it one.
world          = 0x9D4F10
world_is_pointer = 0

; The C3D_LANGUAGE object, also inline in .data. 5656 of the 6539 calls to
; GetString do `lea rcx,[rip -> here]` first.
language       = 0x997590
; AN OFFSET INSIDE THAT OBJECT, not an address. The vector of custom
; strings - the ones workshop authors mint for their own country names,
; and the ones this mod adds for its own labels. CustomStringAdd pushes
; onto it and GetString reaches entry i by the id ~i, so the id of a
; string is decided by where it lands in here and nothing else. The mod
; reads the length to learn the id of the label it just added.
language_custom_strings = 0x26720

; The font manager is inline in .data, the font is a pointer, and the DPI scale
; is a float - all three from the building-panel row in docs/02-findings.md.
font_manager   = 0x996FB0
font           = 0x995220
; world_ptr is the OLD NAME for `world` above, from v0.4. It is still
; read, and `world` overrides it, so an ini written for v0.4 keeps
; working. Set `world`, not this.
;world_ptr     = 0x9D4F10
; The resource table, used to name what a contract is asking for.
; Wrong here means resources print as numbers and nothing worse.
resource_vector = 0x9E11C0
dpi            = 0x992088

; --- the notification bar -------------------------------------------------
;
; THE ONLY THREE VALUES IN THIS FILE THAT ARE CALLED RATHER THAN READ. Every
; other address here is dereferenced behind a readability test; these are cast
; to function pointers and jumped to, so a typo is a jump into nowhere rather
; than a wrong answer. They are checked against the size of SOVIET64.exe when
; the plugin loads and restored to these values if they fall outside it.
;
; game_new is the game's own operator new, and it has to be the GAME'S: the
; game writes notifications into the save file and frees them with its own
; deleter, so a pointer from any other heap is a crash in somebody else's
; code an hour later.
game_new           = 0x84DECC
notification_new   = 0x4C4880
notification_push  = 0x4C49E0
; These two are OFFSETS INSIDE THE WORLD OBJECT, not addresses. The gate is a
; number the game sets while it is busy: its own push refuses to add anything
; unless it reads -1, and this plugin makes the same test first - because the
; game's push returns without taking the pointer it was given, so calling it
; at the wrong moment leaks rather than fails.
notification_gate  = 0x13178
notification_list  = 0xD1F0
; THE BORDER'S OWN QUESTION (step 209). Every customs house asks this
; routine how many tourists to let in, and it is where the game tests the
; visa bytes itself. [tourism] visa_hook hooks it; the hook refuses unless
; the first fourteen bytes there are exactly this build's.
tourist_count      = 0x185100
; THE CUSTOMS BLOCK (step 211). Each is checked byte for byte before it
; is hooked - or chained over another mod's standard jump - at the first
; frame, once every plugin has started. See [borders].
;   border_trade    every building: a customs house selling what is in its
;                   storage, or anything buying from abroad
;   customs_people  a customhouse's tourists and guest workers
;   building_tail   what that routine ends in, still run at a shut border
;   power_border    electricity across the border, either way
;   pipe_border     the foreign pipeline, either way
border_trade       = 0x173320
customs_people     = 0x1854E0
building_tail      = 0x1C7F60
power_border       = 0x1B9A40
pipe_border        = 0x1B7D50
off_day        = 0x590
; THE NATALITY RESEARCH FLAGS. One byte each, inside the world object.
; exe+0x834C65 is the whole birth system and it reads exactly these two:
; the first multiplies a citizen's daily birth chance by 1.22, the second
; by 0.70, on top of a base of 0.667, until the accumulator reaches 10 and
; a child is born. An event's birth_rate moves these and nothing else,
; because the three constants are POOLED float literals shared with
; hundreds of unrelated calculations - 0.70 has 463 references.
; The whole run of research flags, first byte. Twenty-two of them,
; 0x1175C..0x11771, proved by the reset at exe+0x2F6CA1. The mod
; watches these to know which research was finished most recently -
; that, and only that, is what research_loss is allowed to take.
; THE GAME RULE THAT DECIDES WHETHER RESEARCH MEANS ANYTHING AT ALL.
; Live at world+0x14453, copied by exe+0x337431 out of the republic's
; own settings byte at world+0xC851. When it is 0 the game jumps past
; the visa tests (exe+0x185152), past the advertising campaigns
; (0x18547F) and past the natality research (0x834C63) - so the whole
; tourism unlock feature and birth_rate do nothing. The log says so
; once per republic rather than leaving you to wonder.
rule_research        = 0x14453
rule_research_source = 0xC851
research_first = 0x1175C
research_natality_up   = 0x11761
research_natality_down = 0x11762
; WHERE THE BIRTH ACCUMULATOR SITS, relative to a citizen's nine statuses.
; exe+0x834C8F reads it at [rbx+0xD0] and the nine are at [rbx+0xD8], so
; it is eight bytes in front of the block this mod already holds the
; address of. That is a DISTANCE, not an address - the citizens move
; every load and are found fresh each time.
;
; THE MOD DOES NOT TRUST THIS NUMBER. It reads this offset and six of
; its neighbours on 256 real citizens, waits five days - the game only
; moves the field on one day in four - and reads the same people again.
; The birth accumulator holds exactly -1 for everybody the game has not
; put in the running and 0..10 for the rest (nobody over 48 is moved),
; climbs, and drops back to zero when a child is born. A status wanders and a
; proportion never passes 1, so neither is mistaken for it.
;
; ONLY THIS OFFSET IS EVER WRITTEN. The neighbours are measured and
; each gets a line in the log; if one of them behaves like the
; accumulator and this one does not, the log names it and you decide.
citizen_birth_offset = -8
; The republic's running totals of the dead and of those who left,
; incremented at exe+0x83628C and 0x8362AF. Read only - they are the
; outcome, not the dial. There IS no emigration dial: citizens leave when
; their happiness reaches nothing, so status_bonus = happiness is what
; drives them out.
count_dead     = 0x11574
count_escaped  = 0x11578
off_year       = 0x594
; SWAPPED from the loader's notes, confirmed against the game's own HUD:
; with the corner showing  P 2,065,950  and  $ 8,839,756,  the plugin reading
; +0x580 got 8,839,932. So +0x580 is dollars and +0x588 is roubles. This was
; not cosmetic - it meant every day's trade fed the wrong bloc's standing.
off_usd        = 0x580
off_rub        = 0x588

; The vehicle-type vector the game fills and draws from. The parser hands each
; finished record to a push_back whose vector arrives as `lea rcx,[rip -> here]`.
;
; 0x9E7750, and nothing else. world (0x9D4F10) + 0x12840 lands exactly here.
;
; This line said 0x9E7B50 for five builds, on the strength of a comment I wrote
; claiming 0x9E7750 was "a different vector" - it was not, it was an arithmetic
; slip of mine (0x3F03CE + 0x5F7382 is 0x9E7750, not 0x9E7B50). The plugin's own
; failure log settled it: the raw qwords it printed at +0x12840 were
; 0x13BD1F90060 and 0x13BE4290398, a span of 305,136,440 bytes, which is 7495
; records of 0x9F08 with nothing left over. A wrong base does not divide evenly.
; While this said 0x9E7B50 the array never validated, every tier held 0 vehicles
; and ApplyGating had nothing to write to - which is why every vehicle stayed
; purchasable even though the purchase-list tags were correct.
vehicle_types  = 0x9E7750

vehicle_vector = 0x12840
vehicle_stride = 0x9F08

; Read straight out of section 8b/8c of the debug report: a building type keeps
; its object name in a plain buffer at descriptor+0x000, and a vehicle record
; keeps its own at record+0x200. Both are how those things are matched by name.
type_object_name    = 0x000
vehicle_object_name = 0x200

stats_begin    = 0x9E6638
stats_end      = 0x9E6640


; ---------------------------------------------------------------------------
; VEHICLES
;
; Every vehicle carries its bloc already: of the 356 vanilla vehicles, 62 are
; dollar-priced and 294 rouble-priced, and not one carries both. So the
; currency is the bloc, exactly, with nothing to tag by hand.
;
; A tier takes:
;   bloc         soviet | west - which standing is tested, and which vehicles
;   needs        the standing that opens it
;   from_year    only vehicles whose own first year falls in this range
;   to_year
;   mode         block  - below the threshold the vehicle is hidden
;                shift  - below the threshold its year moves later instead,
;                         above it, earlier. Nothing is ever denied outright
;   shift_years  how many years `shift` moves it
;
; The year gate always still applies. Nothing here can make a 1970 lorry
; appear in 1940 - reputation moves a vehicle within history, it does not
; overrule it.
;
; Thresholds assume the 0..100 scale and a start of 20: your own bloc's basic
; kit is already open on day one, the good equipment is not, and the other
; side's anything takes real work.
; ---------------------------------------------------------------------------

; --- which bloc a vehicle belongs to ---------------------------------------
;
; NOT the price. v0.7 read $COST_USD / $COST_RUB and classified 2440 of 7491
; vehicles as western, which was noise: those fields hold a declared price
; OVERRIDE, and the modding docs say cost is normally generated from engine
; power and weight, so most vehicles leave them at zero - and a denormal zero
; is still "greater than zero".
;
; $COUNTRY is the honest tag. Across the 356 shipped vehicles every country id
; uses exactly one currency, with no exceptions, and workshop vehicles declare
; it too. These two lists are that mapping, derived from the shipped files.
;
; A country not listed here is left completely alone - never gated, never
; shifted. The log prints every id it actually sees and marks unknown ones, so
; adding a country a mod introduced is a matter of pasting its number in.

[countries]

; Resolved from sovietEnglish.btf, so these are the game's own names:
;
;   38998 Domestic product   38999 Unknown country
;   39000 Czechoslovakia     39001 Czechia          39002 Slovakia
;   39003 Germany            39004 East Germany     39005 West Germany
;   39006 Poland             39007 Hungary          39008 Bulgaria
;   39009 Romania            39010 Yugoslavia       39011 Soviet Union
;   39012 Lithuanian SSR     39013 Latvian SSR      39014 Byelorussian SSR
;   39015 Ukrainian SSR      39016 France           39017 Italy
;   39018 USA                39019 Belarus          39020 Ukraine
;   39021 Russia             39022 Sweden           39023 Spain
;   39024 South Korea        39025 Serbia           39026 Bosnia
;   39027 Croatia            39028 Albania          39029 North Korea
;   39030 Japan              39041 United Kingdom   39042 China
;   39043 Belgium            39044 Switzerland
;
; Two are judgement calls rather than facts, and they are yours to make:
;
;   39042 China  - communist, but after the Sino-Soviet split hardly Moscow's
;                  friend. Listed as soviet here; move it to `west`, or to
;                  neither list, if you would rather Chinese kit annoyed both.
;   39003 Germany - the undivided entry, used by pre-war and post-1990
;                  vehicles. Listed as west, which is right for both ends of
;                  the century and wrong for 1939-1945.
;
; 38998 "Domestic product" is deliberately in NEITHER list: something you built
; yourself should not earn or cost you standing with anyone.
;
; A country in no list is left completely alone - never gated, never shifted.
; Workshop vehicles that mint their own country name get a NEGATIVE id (the
; game's runtime custom-string table) and cannot be listed here; they are
; simply left alone too.

; ALL vehicles, mods included
; -------------------------------
; About 700 workshop vehicles do not use one of the game's countries at all -
; their author typed their own name, which the engine stores as a runtime
; custom string with a NEGATIVE id. Those cannot be listed as numbers.
;
; So the plugin asks the game itself: C3D_LANGUAGE::GetString resolves any id,
; negative included, to the string the player would see. If that name appears
; in soviet_names or west_names below, the vehicle is blocced by name. The log
; prints every country with its resolved name, so anything still unmatched is
; readable rather than a bare number.
;
; `unknown` is the backstop, and it is what makes "every vehicle" literal:
;   none    leave unmatched vehicles completely alone   (default, safest)
;   soviet  treat them as Soviet bloc
;   west    treat them as Western
; Set it to soviet or west only once the log shows you what is actually landing
; there - it is a blunt instrument.

unknown = none

soviet_names = Soviet Union, Czechoslovakia, Czechia, Slovakia, East Germany, Poland, Hungary, Bulgaria, Romania, Yugoslavia, Lithuanian SSR, Latvian SSR, Byelorussian SSR, Ukrainian SSR, Belarus, Ukraine, Russia, Serbia, Bosnia and Herzegovina, Croatia, Albania, North Korea, China, USSR, CCCP
west_names   = Germany, West Germany, France, Italy, USA, United States, Sweden, Spain, South Korea, Japan, United Kingdom, Great Britain, Belgium, Switzerland, Austria, Netherlands, Denmark, Norway, Finland, Canada, Australia

soviet = 39000, 39001, 39002, 39004, 39006, 39007, 39008, 39009, 39010, 39011, 39012, 39013, 39014, 39015, 39019, 39020, 39021, 39025, 39026, 39027, 39028, 39029, 39042
west   = 39003, 39005, 39016, 39017, 39018, 39022, 39023, 39024, 39030, 39041, 39043, 39044


[vehicles]

