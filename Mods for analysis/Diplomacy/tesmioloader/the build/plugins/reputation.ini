; ===========================================================================
; EVENTS, PART THREE - THE HISTORY
;
; Ten dated events and five rolled ones. Add their ids to the `list =` line in
; [events] to turn them on - they are written here rather than there so the
; shipped set keeps working while these are read and argued with.
;
; A NOTE ON `prices`. Every line below names its resource - `prices = steel:3.5`
; - rather than numbering it. An index is only correct on the machine it was
; read from: install a DLC or a resource mod and index 31 stops being steel,
; and an event that made steel dear silently makes concrete dear instead.
; Names are resolved against the player's own table when the event first fires,
; and a name this install does not have is skipped with a line in the log while
; the rest of the event runs. F10's section 8d lists every name your install
; actually has.
;
; A NOTE ON DATES. `start_day` is the day of the year, 1..365. Events fire AT
; OR PAST their date rather than exactly on it, so a save loaded years later
; still gets everything it should have had, and being a day out costs nothing.
;
; A NOTE ON THE PEOPLE. birth_rate and emigration below are real since step
; 208 (see "WHAT AN EVENT CAN DO TO THE PEOPLE" further up); only
; happiness_per_day is still parsed and not applied.
; ===========================================================================


