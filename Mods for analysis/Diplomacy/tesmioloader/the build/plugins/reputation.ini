; ===========================================================================
; THE DEBUG WINDOW
;
; F10 opens it, PAGEUP and PAGEDOWN move between six pages, F10 closes it.
; Everything on it is read-only. None of it runs while the window is shut -
; not the frame timer, not the page code - so leaving this section configured
; costs nothing in normal play.
;
;   1  SITES      every address this build depends on, and whether each one
;                 still validates. This is the page that catches a game update:
;                 an offset that has moved shows up here as DOES NOT VALIDATE
;                 instead of as a feature that quietly stopped working.
;   2  COST       what the plugin spends per frame - this frame, the rolling
;                 mean, and the worst ever - plus what actually runs and how
;                 often. If the game stutters, this page says whether it is us.
;   3  WATCH      any address, decoded as int, float, double and raw hex all at
;                 once. This is the tool that names an unknown field: point it
;                 somewhere, do the thing in game that should move it, and read
;                 which decoding moved sensibly.
;   4  VEHICLES   the gate per tier, with one live record read back off the
;                 array the game itself draws from.
;   5  CONTRACTS  all of them at once with the number each is really reading,
;                 which is how a contract that will never complete gives itself
;                 away. HOME and END scroll.
;   6  STATE      standing, today's earnings against the daily ceiling, and the
;                 last twelve things that moved either number.
; ===========================================================================

[debug]

; 0x79 is F10. 0 disables the window entirely.
key = 0x79

open_at_start = 0

; --- FINDING THE GAME SIDEBAR PANEL -------------------------------
;
; Selecting a sidebar entry makes the game draw a panel. To put our
; own content inside one we need its rectangle, and guessing at an
; address did not work. So this watches instead: every time the
; selected entry changes it snapshots the range below and reports
; which offsets MOVED. An offset that moves on every single change,
; and holds a plausible screen coordinate, is the panel geometry.
;
; HOW TO USE IT: [ui] sidebar must be 1. Click two or three different
; sidebar buttons - Economy and trade, Population statistics, ours -
; then press F10 twice and read section 8d of reputation-debug.txt.
;
; IF IT FINDS NOTHING: read the readable-page count it prints first.
; All pages unreadable means the range is wrong. All readable with no
; hits means the geometry is somewhere else - most likely on the
; heap, which this cannot reach. Either way move panel_scan_at and
; restart: the range is read once, at startup.
;
; The default brackets everything the sidebar is known to use: g_ui
; at exe+0x9D4F10, the entry vector at 0x9E1518, the selection
; pointer at 0x9E1560. Read-only, probed page by page so one bad
; page costs one page, and it costs nothing until a selection moves.
panel_scan       = 0

; --- THE SHORT VERSION OF THE SAME QUESTION -----------------------
;
; A disassembly note says the panel-width chain ends in a float store
; to g_ui+0xAE54 for a name the game does not recognise - which ours
; is. This prints that float and its neighbours to reputation.log
; every time the selected sidebar entry changes, tagged with whose
; panel it is.
;
; Economy and trade is visibly wider than ours. If one of these
; numbers is wide for Economy and narrow for ours, it IS the width,
; and making our panel the right size becomes a single store. If none
; of them move, the note is wrong about the base and panel_scan above
; is the fallback.
;
; panel_width_at is relative to g_ui (exe+0x9D4F10). 0 turns it off.
panel_width_at   = 44628        ; 0xAE54
panel_width_span = 10           ; floats printed either side

; WHAT THE PROBE FOUND, 17 September:
;
;   trade      (Economy and trade)   -4:184.0   +0:385.0   +4:916.8
;   reputation (ours)                -4:184.0   +0:785.0   +4:916.8
;
; +0 is g_ui+0xAE54 and is the ONLY value that differs between two
; panels, so it is the panel geometry. -4 and +4 are identical for
; both, which makes them the shared left edge and the height.
;
; panel_width_set writes a value there every frame while OUR panel
; is open, and never touches anyone elses. Set it to something
; obviously different - 1400 - and look at what moves: that settles
; whether it is a WIDTH or a RIGHT EDGE, and whether the game
; recomputes it every frame. 0 = read only, the shipping value.
panel_width_set  = 0

; A WRITE DID NOT STICK, AND MORE SAMPLES KILLED THE FIRST READING.
;
; Across several clicks +0 came back 385 for Economy once and 785
; the next time, 785 for ours then 385 - so it does NOT identify
; the panel. But 785 - 385 = 400 exactly, and a value flipping
; between two endpoints is what an animating panel looks like when
; you only sample it on a click.
;
; panel_width_trace = N logs that float and its neighbours once
; every couple of frames, N times, while our panel is open. Read
; the shape:
;   a smooth ramp  -> the panel animates, and our content can be
;                     drawn inside it by following this per frame
;   a square jump  -> a toggle, not a size
;   a flat line    -> wrong field, and the scan above is the way
panel_width_trace = 0
panel_scan_at    = 9961472      ; 0x980000, exe-relative
panel_scan_bytes = 524288       ; 0x80000 = 512 KB, the buffer size

; THE CITIZEN SWEEP. How the plugin finds the population vector when
; the shipped address does not match this build. It walks a bounded
; range once, at load, and stops at the first vector that decodes
; sensibly. Off costs you the population-linked numbers on the
; standing page and nothing else.
citizen_sweep       = 1
; How far it may walk, in bytes. Bigger finds more and costs a
; longer pause at load; the default is what every 1.4x build has
; needed so far.
citizen_sweep_bytes = 2097152

; The watch list. Comma separated, each one  world+0xOFF  or  stat+0xOFF,
; optionally followed by a colon and a note to print underneath it.
;
; Worked example - finding the population field:
;   1. set   watch = world+0x600, world+0x608, world+0x610
;   2. open F10 page 3 and let a few citizens be born
;   3. whichever line's int32 climbs by ones is the field
;   4. put it in a contract:   kind = world_int   field_offset = 0x608
;
; The four below are the known-good ones, so the page has something correct on
; it to compare against.
watch = world+0x590:day of the year, world+0x594:year, world+0x580:dollars, world+0x588:roubles


; --- THE REPORT FILE --------------------------------------------------------
;
; The window is for playing; the file is for diagnosing. It writes everything
; the plugin can see into
;     tesmioloader\build\reputation-debug.txt
; in one pass, as plain text meant to be read by someone who is not sitting at
; the machine. Send that file when something is wrong.
;
; It is written on every F10 press - opening OR closing, so it still arrives on
; a machine where the overlay never appears - and whenever a world opens.
; Set report_daily = 1 to also get one every in-game day; that is for hunting a
; specific bug, not for normal play.
; BOTH OF THE NEXT TWO COST FRAMES. report_daily writes a quarter of a megabyte
; every in-game day; hunt_timers scans 12KB of the world and writes what moved.
; Neither belongs in normal play - turn them on to chase something, then off.
report_daily = 0

; Report every world field that moves by exactly one per in-game day. That is
; the signature of a countdown, and it is how the advertisement campaign's
; 40/50 day timer - and the tourism figure beside it - get found. See [tourism].
; Off by default: it scans 12KB of the world once a day and writes what it finds.
hunt_timers = 0

; Section 8 of the report dumps the customs houses field by field. That is how
; the tourist and foreign-worker fields get found: take a report, change a
; customs house's tourist or worker setting in game, take another, and compare -
; only the relevant offsets will differ.
;
; customs_type is the engine's $TYPE_CUSTOMHOUSE number. dump_from/dump_to bound
; how much of each building record is printed; rows that are all zero are
; skipped, so widening this is cheaper than it looks.
; ---------------------------------------------------------------------------
; FINDING THE CITIZEN LIST, AND THROUGH IT LOYALTY
;
; The Espionage HQ is supposed to raise loyalty across the whole republic and
; push it past the ceiling the monument system stops at. Monument loyalty is
; radius-based, caps out around half, and misbehaves - so the number has to be
; written directly, and that means finding where citizens live in memory.
;
; Guessing at a float is hopeless. But a list has a LENGTH, and the population
; is on screen in the top bar. A vector of fourteen thousand pointers is not
; going to be mistaken for anything else in the world object.
;
;   1. Nothing. `auto` reads the population out of the statistics record and
;      works out what it is looking for - the record carries it as four counts
;      (small children, medium children, parents, other adults) and 1.42 adds
;      them up. Set a number here only to override it.
;   2. Load the save. The log reports every list in the world of about that
;      length, with its offset.
;   3. Put the most likely offset - a list of 8-byte pointers - into
;      dump_list_at and load again. The log then prints every float between 0
;      and 1 in the first few entries.
;   4. Open one citizen in game. Whichever offset matches their loyalty is the
;      field. Tell me the offset and the plugin writes it.
;
;   -1  the easy way: report EVERY large list in the world. No number needed
;       from you - just load the save and send me reputation.log. The citizen
;       list is whichever count matches the population on the top bar, and I
;       read that off the log rather than asking you to.
;    0  off
;    N  look for a list of about N entries only
;
; It runs ONCE per load and then switches itself off, so leaving a number here
; costs one scan, not one per day.
;
; NOTE: build-reputation.bat COPIES THIS FILE over the installed one, so edit it
; here in reputation-src, not in the plugins folder - an edit there is lost on
; the next build. That is why the last attempt read 0.
; The sidebar dump: what every one of the game's own panels is made
; of. It is how the sidebar layout was worked out and it ran on every
; world load ever since, mid-frame, for nobody.
dump_sidebar_items = 0

find_vector_count = auto
find_vector_slack = 0.02
; THE FIELD HUNT. Set to the same offset as [population] list_offset
; and the log prints a table: every offset inside a citizen where all
; six sampled people hold a number between 0 and 1, with a note
; saying whether they all hold the SAME number. The ones that vary
; are loyalty, health, happiness and the rest; open a citizen in game
; and the column whose spread matches is the one to put in
; [population] loyalty_field. Set it back to 0 once you have it.
dump_list_at      = 0
; The same stride as [population] list_stride. 0 = a list of pointers.
dump_list_stride  = 0

; ---------------------------------------------------------------------
; citizen_probe - WHICH FIELD INSIDE A CITIZEN IS WHICH
; ---------------------------------------------------------------------
; Needs [population] list_offset. Runs once, on the first day tick,
; and writes nothing ever - it is a read and an average.
;
; It looks for runs of six floats that are all strictly between 0 and
; 1. Nothing in a world looks like that except a person: coordinates
; are unbounded, tonnages are large, counts are whole numbers. The
; DISTANCE between two consecutive runs is the size of one citizen -
; measured, not guessed - and the first run's position modulo that
; size is where the stat block sits inside one.
;
; Then it averages every field over every living citizen and prints
; the averages. The game shows the republic's average loyalty on its
; own population screen; the field whose average matches that number
; is loyalty, and a field cannot fake that across twenty thousand
; people. Put the offset in [population] loyalty_field and set this
; back to 0.
citizen_probe     = 0

; ---------------------------------------------------------------------
; find_value - THE NUMBER ON THE SCREEN, FOUND IN MEMORY
; ---------------------------------------------------------------------
; Structure hunting asks where the citizens are. This asks a different
; question: the game already PRINTS the republic's average loyalty on
; its own population screen, so that number is in memory in a form
; something can print - and finding it needs to know nothing at all
; about how citizens are stored.
;
; Put the number the screen shows here. It is looked for as a
; proportion (0.53), a percentage (53.0) and a whole number (53), in
; the statistics record first and then two megabytes of the world.
;
; find_value2 IS THE WHOLE TRICK. One match is noise - a megabyte
; holds dozens of floats near any value you name. Two named numbers
; within a few hundred bytes of each other is a statistics block, and
; everything around it is then labelled by what the screen says. Put
; the average criminality - or any other figure off the same panel -
; in find_value2 and only pairs are reported.
;
; Runs once, reads only, writes nothing. 0 is off.
find_value        = 0
find_value2       = 0
find_value_slack  = 0.002    ; both values are known exactly

; ---------------------------------------------------------------------
; heap_census - HOW MANY LIVE OBJECTS OF EACH CLASS THERE ARE
; ---------------------------------------------------------------------
; Every other search here starts by guessing the SHAPE of a list and
; then looking for something that fits. This one has no shape in it.
;
; A C++ object with virtual functions begins with a pointer to its
; vtable. That pointer is identical for every instance of a class,
; different for every other class, and obvious to spot because it
; points into the exe or the engine DLL. Count how often each such
; address appears at an 8-byte boundary across every committed private
; page, and what comes back is a census: classes, and how many live
; objects each one has.
;
; A republic of 21086 people has a class with about 21086 instances,
; and nothing else in the process does. It also proves itself on the
; way past - it should show a class with about 5291 instances, because
; that is how many buildings this world has, established a completely
; different way. A census that finds the buildings we already know
; about can be believed about the people we do not.
;
; Then it finds every object of that class - by what they ARE, not by
; what holds them - and averages every proportion in them over all of
; them. The field matching the average the game shows is loyalty.
;
; 1 = the census and the averages.
; 2 = also hunt for the list they are held in, which dereferences as it
;     goes and roughly doubles the freeze.
;
; THE GAME FREEZES for a few seconds while it runs, once per session.
; Read-only throughout: it writes nothing, ever. Off by default.
heap_census       = 0
heap_census_gb    = 24.0     ; 3.0 was not enough - the first hunt hit the cap

; ---------------------------------------------------------------------
; citizen_fingerprint - FIND THE PEOPLE BY WHAT IS INSIDE THEM
; ---------------------------------------------------------------------
; The save file settled what a citizen IS. workers.bin is 21933 records
; of 1832 bytes behind a short header - measured two ways that agree,
; and confirmed against a second save three days older - and each one
; carries eleven per-person proportions at +0x448.
;
; So this stops looking for a shape and looks for a PERSON. It takes
; thirty-two citizens out of the save you just loaded and searches the
; heap for those exact eleven floats. Eleven specific proportions in a
; row do not occur by accident, so every hit is a citizen - and the
; distance between them is the record size IN MEMORY, which need not be
; the 1832 it is on disk and this is the only way to find out.
;
; It also looks back from each hit for the pointer every C++ object
; begins with; the distance that holds for all of them is the block's
; offset inside a citizen.
;
; NEEDS A LOADED SAVE, not a new republic - it reads workers.bin from
; the folder the save came from. Reads a file and reads memory; writes
; nothing. Freezes the game for a moment, once.
citizen_fingerprint = 0    ; moved to [population] find_citizens

; THE FIELD PROSPECTOR. Off. Turn it on when you want to know what
; ELSE the game keeps on a citizen.
;
; Every citizen is one object. The nine statuses sit at a known place
; inside it and this mod already holds their address for everybody in
; the republic. Whatever else is in that object - a counter of
; miserable days, an age, a timer, the birth accumulator - is a few
; bytes away, because that is how the object was laid out.
;
; So: read a window either side of the nine on sixty-four real
; citizens, wait five days, read the SAME sixty-four again, and print
; what each four-byte slot did - as a float AND as an integer, because
; a day counter is not a float. It writes NOTHING. It is a report, it
; runs once per republic, and it costs two sparse passes.
;
; HOW TO READ IT. The nine statuses are at citizen+0..+32 and the
; report marks them - they are the calibration, and if they do not
; come out as "a proportion 0..1" then the citizens were not found
; properly and nothing else in the report means anything. Lines marked
; <<< are the finds: something that climbs 0..10 and resets is an
; accumulator (citizen-8 is the birth one), something that counts up
; in whole numbers and resets is a counter of something going wrong,
; and something counting down is a timer.
field_report = 0

; THE WINDOW, in bytes either side of the nine statuses, rounded to
; four. Sixty-four slots at most - ask for more and you get the first
; sixty-four. The default reaches eight bytes in front of the block
; (which is where the birth accumulator lives) and a hundred and sixty
; past it.
field_report_from = -64
field_report_to   = 160

; WHERE THE PLUGIN'S TIME GOES. Any single call into this plugin that
; takes longer than this many milliseconds is written to the log as a
; PERF line: the time of day to the millisecond - the same clock the
; loader's profiler prints, so the two logs line up - and the named
; steps inside it with what each cost. Nothing is written when nothing
; is slow, and it stops after 400 lines. 0 turns it off.
;
; If the game stutters and there is NO PERF line at that moment, the
; stutter was not this plugin.
perf_log_ms = 25

customs_type = 20
dump_from    = 0x0000
dump_to      = 0x0C00


; ===========================================================================
; SINGLE BLUEPRINTS
;
; A tier licences a whole class at once. A blueprint licences ONE vehicle, and
; costs standing AND money together - which is what makes a single prestige
; machine a decision rather than a side effect of a tier you already bought.
;
; Bought in the F9 window: hold CTRL and ALT and press the number.
;
;   object     the vehicle's OBJECT name - see below. This is what matches.
;   vehicle    optional: what to call it in the window. Defaults to `object`.
;   bloc       soviet | west - whose standing pays, and in whose currency
;   needs      the standing you must hold to be offered it
;   cost       the standing it takes; defaults to `needs`
;   price_rub  the money it takes as well
;   price_usd
;
; WHERE THE OBJECT NAME COMES FROM
;
; A vehicle record holds "vehicles/<object>" at offset 0 and the bare "<object>"
; at +0x200 - "bust_f2472", "bust_skd_14Tr". It does NOT hold the display name
; the purchase list shows; that comes from the language file. So a blueprint
; matches on the object name, and every one in this installation is written to
;     tesmioloader\build\reputation-vehicles.txt
; each time a world opens. Search that file for a word you recognise and the
; object name is in the first column, beside its bloc and years.
;
; The two below are almost certainly wrong until you look them up - they are
; there to show the shape.
; ===========================================================================

; ===========================================================================
; INDIVIDUAL VEHICLE PURCHASE
;
; Two windows, one per bloc, on their own keys - F11 Soviet, F12 Western. Every
; vehicle in the game is listed with the year it would unlock on its own and the
; licence tier that covers it. CTRL + the row number buys the row you can see.
;
; This is ADDITIVE to the tier licences: buying one vehicle opens that vehicle,
; and never closes anything a licence already opened.
;
; allow_before_unlock = 0 is the important one, and 0 is deliberate. A licence
; bought in 1930 that hands you a 1975 lorry is not diplomacy, it is a cheat -
; standing decides WHETHER a bloc will sell to you, not what year it is. With
; this off the window still lists everything, but a row whose year has not come
; shows the year instead of a price and refuses the sale. Set it to 1 if you
; would rather standing bought time as well as access.
; ===========================================================================

[blueprints]

allow_before_unlock = 0

; --- the window itself, reworked in 1.46 ----------------------------------
;
; It used to show sixteen rows and number them 1 to 16 - but there are only
; eight number keys, so rows 9 to 16 were drawn, priced, and impossible to buy.
; A cursor fixes that: UP and DOWN move the `>`, CTRL+ENTER buys whatever it is
; on, and CTRL+1..8 still works for the first eight rows.
;
;   rows              how many vehicles a page shows. 0 fits the screen, which
;                     is about 50 on a 1080p display and more on a 4K one.
;                     Set a number to override.
rows = 0

; THE ONE THAT KILLS THE PAGE COUNT.
;
; 4895 Soviet vehicles is 306 pages at sixteen a page, and almost every row on
; almost every page reads "not until 1987" - because with allow_before_unlock
; = 0 a vehicle cannot be bought before the year it was designed, so listing
; the other four thousand is listing things you cannot do anything about.
;
; 1 hides them, and the window becomes the handful you can actually buy today.
; The footer says how many are hidden so nothing disappears silently. Set 0 to
; see the whole catalogue, which is useful for planning and useless for buying.
hide_unavailable = 1

; What one vehicle costs. Its own $COST_RUB / $COST_USD times money_multiplier,
; and standing scaled from that price - so a tractor is cheap and an airliner is
; not, without a line per vehicle. Most vehicles declare no price at all (the
; field is a modder's override, not the real cost), and those fall back to the
; figures below rather than being free.
money_multiplier    = 3.0
standing_per_1000   = 4.0
standing_min        = 1.0
standing_max        = 25.0
fallback_price_rub  = 250000
fallback_price_usd  = 40000


; These two are real, taken out of reputation-vehicles.txt. The horse-drawn
; vehicles are DLC3 content and are named DLC3_h_<something> - nothing in the
; object name resembles the words "Horse ambulance" that the purchase list
; shows, which is exactly why the file exists.
list = horse_ambulance, horse_wagon

[horse_ambulance]
object    = DLC3_h_ambulance
vehicle   = Horse ambulance
bloc      = soviet
needs     = 8
cost      = 5
price_rub = 40000

[horse_wagon]
object    = DLC3_h_bus1
vehicle   = Horse passenger wagon
bloc      = soviet
needs     = 8
cost      = 5
price_rub = 60000


; ===========================================================================
; TOURISM
;
; The game already has the lever, and it is already split the way this mod is.
; From media_soviet\research\research.ini:
;
;   tourist_visa_east            cost 3200   opens the campaign below
;   adverstiment_campaign_east   cost 4050   $LOCK_AFTER_DAYS 50
;   tourist_visa_west            cost 6400   opens the campaign below
;   adverstiment_campaign_west   cost 6800   $LOCK_AFTER_DAYS 40
;
; Two researches at the Political University, one per bloc, each raising the
; tourists that bloc sends for a fixed run of days. So "more standing, more
; tourists" needs no new concept - only the address of the number those
; campaigns move, and this section is where it goes once it is known.
;
; FINDING IT
;
; Set  hunt_timers = 1  in [debug]. A fifty-day campaign has a counter that
; falls by one an in-game day, and almost nothing else in a world does that, so
; the plugin reports every field that moves by exactly one per day. Then:
;
;   1. hunt_timers = 1, load the save, let a few days pass - note what the log
;      already reports as one-per-day counters, so they can be discounted.
;   2. Research Eastern Advertisement at the Political University.
;   3. Watch the log: a NEW counter starting near 50 and falling is the
;      campaign. The tourism figure it governs is usually within a few dozen
;      bytes of it - press F10 either side of the research and section 8d will
;      show both.
;   4. Put the tourism figure's offset below.
;
; NOTHING HERE DOES ANYTHING UNTIL AN OFFSET IS SET. Both are 0, so the whole
; feature is inert and cannot misbehave while it is still being looked for.
;
;   soviet_offset  world offset of the eastern tourism figure
;   west_offset    world offset of the western one
;   kind           float | int - whichever the debug window's watch page shows
;                  moving sensibly
;   per_standing   scale added per point of standing. 0.01 means 100 standing
;                  doubles it and 0 standing leaves the game's own value alone
;   min_scale      floor. Below zero standing this is what it falls towards,
;                  which pairs with the closed border: a bloc that will not
;                  trade with you is unlikely to send its holidays either
;   max_scale      ceiling, so a maxed republic is not overrun
; ===========================================================================

[tourism]

soviet_offset = 0
west_offset   = 0
kind          = float
per_standing  = 0.01

; --- WHAT VISITORS ARE WORTH, AND WHY IT STOPS ------------------
;
; Tourist standing used to be visitors x per_tourist, flat. Twice
; the hotels, twice the standing, for ever - so a republic that
; solved tourism never had to do diplomacy again. And it paid the
; same whether visitors had a wonderful time or a miserable one.
;
;     gain = cap * raw / (raw + half)  x  rating
;
; You get HALF the cap at raw = standing_half, and the curve
; approaches the cap without ever reaching it. There is no number
; of tourists that wins the game.
;
; standing_cap_* is the most a day of visitors from that bloc can
; ever be worth. 0 takes tourism out of standing entirely; a very
; large standing_half gets you back something close to linear.
standing_cap_soviet = 0.60
standing_cap_west   = 0.60
standing_half       = 0.30

; THE RATING is the game's own tourism score for that bloc - the
; number on the statistics screen - divided by rating_ref. Under
; rating_ref your visitors are earning you less than expected;
; over it, more. Clamped, so a bad season is not worth nothing and
; a good one is not worth everything.
;
; If the score cannot be read the rating is 1.0 - a missing offset
; costs you nothing rather than costing you all of it.
rating_ref          = 1.0
rating_min          = 0.25
rating_max          = 1.50
min_scale     = 0.0
max_scale     = 2.0

; --- A CONTINUOUS HAND ON TOURIST NUMBERS, new in 1.45 ---------------------
;
; The game's own tourism control has three rungs and no slope. But the routine
; that decides how many tourists arrive does not read a stored rate - it builds
; a score by walking the last fifteen statistics records and reading
; ToursitEnded and ToursitScore out of each.
;
; So there IS a continuous input, and it is an ordinary field in a record this
; plugin already opens. Adding to the live record's score in proportion to
; standing feeds the game's own formula and comes out as more visitors,
; smoothly - one write a day, no code hook, no per-frame cost. Performance is
; not the question here; honesty is:
;
;   THE COST. The tourism score on the statistics screen goes up too, because
;   it is the same number. The mod is claiming your diplomacy improved how
;   visitors fared here. That is arguable rather than obviously true, which is
;   why this ships OFF.
;
;   UNVERIFIED. The formula was read out of the exe, not tested in play. The
;   trace prints the score before and after every write, so one session with
;   this on settles whether arrivals actually follow.
;
; It only ever ADDS, and only above `score_from` - a republic that has done
; nothing wrong cannot have its tourism wrecked by this, and falling standing
; simply stops the bonus rather than reversing it.
;
;   score_per_standing  added to the score per point of standing above
;                       score_from. 0 is off. Try 0.05 first.
;   score_from          the standing at which the bonus starts. 20 is where a
;                       republic begins, so 20 means "normal at the start,
;                       better as you earn it" - which is the shape asked for.
;   score_max_per_day   a ceiling, so a republic at 100 cannot run the score
;                       away in a fortnight.
score_per_standing = 0.0
score_from         = 20
score_max_per_day  = 4.0

; --- THE VISA AT THE BORDER (step 209) --------------------------------
;
; The visa unlocks in [unlocks] (visa_west, visa_east, mode = require)
; used to hold the game's visa byte down once a day. The game rebuilds
; every research byte at each day change, so the byte was only ever held
; for part of a day - and the save of 21 Sep shows tourists from both
; blocs entering on the days both visas were held.
;
; So the border is asked now. The routine every customs house calls to
; learn how many tourists to let in ([sites] tourist_count) is hooked,
; and while a bloc's visa is held it lets nobody in from that bloc. The
; log says every ten days how many were turned back, and a visa opening
; or closing goes on the notification bar. Tourists already in the
; republic finish their stay.
;
; 0 goes back to the once-a-day byte, which lets some through.
visa_hook = 1


; ===========================================================================
; THE CUSTOMS BLOCK AND CLOSED BORDERS  (step 211)
;
; An event's `block_import` / `block_export` now STOP GOODS AT THE BORDER,
; and `close_border` SHUTS IT - which for a long time they only claimed to
; do: once the embargo replaced the old withholding, the two keys printed
; "imports blocked" and nothing stopped anywhere. Every border building is
; in one of two modes, chosen in its purchase window: SELLING to a bloc, or
; BUYING from one.
;
;   block_export = west   customs houses selling to the west take none of
;                         your goods - they wait in storage - and the power
;                         line and the pipeline stop selling west too
;   block_import = west   customs houses buying from the west, and anything
;                         else set to buy from abroad in dollars, buy
;                         nothing; the game's own switches for buying
;                         resources for dollars are held off, which also
;                         stops dollar-paid construction deliveries
;   close_border = west   both of those, and nobody crosses: no tourists,
;                         guest workers or invited immigrants from there,
;                         and none of that bloc's vehicles or blueprints
;                         (`people` and `purchases` below). Refugees an
;                         event brings still come - they are what a war
;                         sends over a border.
;
; A contract a stopped border makes impossible is FROZEN, not failed, as
; under an embargo. A bloc you are below zero with keeps the old rule: your
; goods cross and nothing is paid - reparations in kind - because the
; contracts that bring you back from zero are export contracts to it.
;
; The game SAVES its permission switches, so these are only ever held for
; the session: a save always gets the republic's own settings, and so does
; a world that closes. A save made mid-war and loaded without this mod has
; nothing left shut.
;
; OTHER MODS. The hooks go in at the first frame, after every plugin has
; started. Where another mod already has its standard jump on the same
; function - the resources plugin does on the customhouse tick - this one
; is chained over it rather than refused: both run, and the log says so.
; ===========================================================================
[borders]

; THE SWITCH. 0 turns ALL of the above off: no hook goes in, no switch of
; the game's is touched, and these events move prices (their embargo) and
; standing and nothing else.
customs_block = 1

; What a CLOSED border also stops.
;   people     tourists and guest workers at its customs houses, and
;              immigrants invited from that bloc
;   purchases  that bloc's vehicles and blueprints
people    = 1
purchases = 1

; Technical. hooks = 0 keeps only the game's switches (imports, immigrants,
; vehicles, blueprints) and stops no goods at a customs house;
; permissions = 0 leaves the game's switches alone and keeps the hooks.
hooks       = 1
permissions = 1


; ===========================================================================
; POPULATION - loyalty and crime, per head
;
; The Espionage HQ lifts loyalty across the whole republic past the ceiling the
; monument alone reaches, and pushes crime down. The game keeps both per
; citizen, and this plugin has to be TOLD where: an offset into a struct nobody
; documented is not something to guess at, and a float written into the wrong
; place in a citizen is how a save gets quietly ruined.
;
; So the two addresses live here rather than in the code. Once they are written
; down a game patch that moves them is an ini edit, not a rebuild - which
; matters a great deal for something on the workshop.
;
; HOW TO FILL THESE IN (two runs, and then never again):
;
;   1. Set [debug] find_vector_count = auto, load a save, quit, open
;      reputation.log. The scan now knows the population - it reads it out of
;      the statistics record - so it can say which row is the right length
;      rather than asking you to check against the top bar. The line that says
;      "---- BEST: world+0xNNNNN ----" is the citizen list. Put it in
;      list_offset below.
;   2. Set [debug] dump_list_at to that same number and load again. It prints
;      every float between 0 and 1 in the first three citizens, with offsets.
;      Open one of those citizens in game, read their loyalty off the panel,
;      find the offset whose value matches, and put it in loyalty_field.
;   3. Set apply = 1.
;
; Until BOTH offsets are set the whole section is inert and the HQ still does
; everything else it does. With them set but apply = 0 it reads and logs and
; writes nothing, which is the safe way to check the numbers are right.
;
; It also checks itself before the first write: the field is sampled across the
; republic, and if the values fall outside 0..1 or are all identical - a column
; of 1.0f is a flag array, not loyalty - it disables itself and says so in the
; log rather than filling thirty thousand people with 0.65.
; ===========================================================================

[population]

; world+X. 0x11728 came out of [debug] find_vector_count = auto on a
; 21086-person republic: the scan reported 21164 entries there, which
; is the population plus the slots the game keeps spare.
list_offset   = 0x11728
; HOW THE PEOPLE ARE LAID OUT. 0 means the vector holds POINTERS to
; citizens; anything else means the records themselves are in the
; vector, that many bytes each. This build is the second kind, and
; assuming the first is why the scan looked like it had failed.
list_stride   = 0
; HOW BIG ONE CITIZEN IS, which is not the same question as how far
; apart two of them are. Inline, they are the same number and this can
; be left at 0. By POINTER the stride is 8 and the record is whatever
; the allocator handed out, which the probe measures from the spacing
; of the pointers themselves.
;
; This is what bounds the write. loyalty_field and crime_field are
; refused outright until it is set, because without it there is no way
; to know a write lands inside a citizen rather than in the next one -
; and, for the last record, past the end of the list entirely.
record_bytes  = 0
loyalty_field = 0        ; byte offset inside one citizen
crime_field   = 0        ; leave 0 until loyalty is confirmed working

; crime_offset - WHERE CRIMINALITY REALLY IS, and how it was found.
;
; Bytes past the first of the nine statuses. It is NOT one of the nine.
;
; Status 4 averages 3.7% and is exactly zero for a third of the republic,
; which is crime-shaped, and it was taken for criminality on that likeness
; for days. Setting it did nothing the game could see. Then the game named
; the field itself: its own debug menu has "Increase citizens' crime level",
; so a kilobyte around sixty-four citizens was remembered, that button was
; pressed, and what moved was FIFTY-TWO BYTES past the block - 0.17% to
; 11.46%, in forty-one of the sixty-four. Status 4 did not move at all.
;
; The two FIND A FIELD rows in the Cheats window do that, and will name any
; other field the same way if the game ever moves this one.
crime_offset  = 52

; ---------------------------------------------------------------------------
; EVERYTHING ABOVE THIS LINE IS THE OLD WAY, AND IT IS NO LONGER NEEDED.
;
; The citizens are found now, and found rather than configured. [debug]
; citizen_fingerprint takes forty-odd people out of the save's own
; workers.bin, finds those exact bytes in memory, and from there finds the
; array of pointers the game keeps them in. It knows which of the nine
; per-person statuses is loyalty (the fourth) and which is criminality (the
; fifth) because the save says so, and it checks the republic's own averages
; before it believes any of it. Nothing above has to be right for that.
;
; So leave list_offset, loyalty_field and the rest alone. They are the
; fallback for somebody who has worked out their own offsets by hand; the
; found list is preferred whenever it is there.
; ---------------------------------------------------------------------------

; apply - WHETHER THE INSTITUTIONS MAY ACTUALLY MOVE THE PEOPLE
;
; 0 reads and shows. The Standing page gets a line saying what the
; republic's loyalty and criminality are, the log records them, and nothing
; is written. That half is worth having on its own and it is what ships.
;
; 1 lets the Espionage HQ do what it was always written to do: one small
; step per citizen per day, loyalty towards a ceiling the institutions
; raise, crime towards a floor they lower. Both are measured from the
; republic's OWN average on the day the list is found - and remembered in
; the save's sidecar, so reloading does not measure the mod's own work and
; lift the population off that instead.
;
; TWO THINGS IT WILL NOT DO. It writes nothing at all unless something is
; actually lifting loyalty or holding down crime, so a republic with no
; secret police in it is left exactly alone. And it writes nothing until
; the list has been seen to change on its own between two day ticks,
; because a list that never changes might be a copy of the save rather
; than the republic.
;
; Turn it on once the Cheats window has shown you the population page
; moving.
; FINDING THE PEOPLE. On, and no longer a debug switch: the Espionage HQ,
; the population line on the Standing page and every event that asks about
; loyalty or crime all depend on it, so turning the debug section off must
; not turn half the mod off with it.
;
; It reads the save's own workers.bin, takes forty-odd real citizens out of
; it, and finds those exact bytes in the running game. THE GAME PAUSES for a
; moment while it does - once per load, never again until the next one.
;
; It needs a LOADED save. A brand new republic has no workers.bin to read,
; so the hunt waits, politely, until there is one.
; LET EVENTS MOVE THE BIRTH RATE. An event declaring birth_rate now sets
; the game's own natality research while it runs and puts it back after.
; Two steps rather than a free multiplier - above 1.10 asks for more
; children, below 0.90 for fewer - and research the player earned is kept
; whatever happens. 0 puts birth_rate back to doing nothing.
apply_birth_rate = 1

; AND THE FINE DIAL UNDERNEATH IT. apply_birth_rate above gives you the
; game's own two steps, x1.22 and x0.70. This one writes the per-citizen
; accumulator directly, so birth_rate = 1.35 means 1.35 rather than
; "round to the nearer of the two things the game can do".
;
; It costs nothing when no event is asking, and it is only ever used on
; a field the mod has PROVED is the accumulator - see
; citizen_birth_offset in [sites] for how. Until that proof lands, and
; if it never lands, birth_rate keeps working through the research above.
; Set to 0 to keep the research and never write the field.
apply_birth_field = 1

; THE CITIZEN HUNT ON EVERY CORE. Finding the people means reading all
; of the game's memory twice - twelve gigabytes each time on a heavily
; modded install - and the game waits while it happens. With this on,
; every core reads a share (up to eight), which turned a 5.4 second
; freeze into a fraction of that. The answer is identical either way.
; 0 goes back to one core, if a machine ever objects to the threads.
parallel_hunt = 1

; ---- PEOPLE WHO ARRIVE AND PEOPLE WHO LEAVE (step 208) -----------------
;
; ARRIVALS. An event with `refugees = N` brings N people over
; `refugee_days`, made by the game's own "Invite immigrants" routine -
; the one the buttons on a residential building call - into finished
; residential buildings with room: independent adults up to each
; building's capacity, ten to a building at a time, the emptiest first.
; Hostels take nobody, as the game gives them no invite buttons.
; As with the buttons, one in two from the Soviet bloc and one in three
; from the third world bring a child. They are counted in the game's
; statistics as immigrants, so they also earn soviet_per_immigrant like
; any other. Nobody is squeezed in: those with nowhere to go are turned
; away, and the log says how many. Build housing before an intake.
; Nobody arrives - and nobody is pushed to leave - in the tutorial or
; the map editor.
;
; With the Diplomacy panel open, CTRL+SHIFT+R brings ten from the Soviet
; bloc at once - one press of the game's own button, free - to check it.
apply_arrivals = 1
; The game's own border rule for immigrants (one switch for the Soviet
; bloc, one for everyone else) applies to arrivals too. 0 lets an event
; bring people through a closed border.
arrivals_respect_border = 1
; At most this many arrive in one day, whatever the events add up to.
; The rest are turned away, and the log says how many.
arrivals_max_per_day = 300
;
; EMIGRATION. The game keeps no emigration rate. Every day, as part of
; each citizen's own daily update, anyone under 3% happiness rolls to
; stay, with a chance of 20 x (loyalty + food + 3) per cent: a loyal,
; well-fed citizen always stays, a hungry, disloyal one leaves two times
; in five, and whoever stays is left at 10% happiness. So an event's
; `emigration = 2.0` puts (2.0 - 1) x emigration_push of the adults
; under that line each day, and the game's roll decides the next day who
; actually goes - and the ones it keeps are left unhappy, so a wave
; hurts the people who stay as well. Below 1.0 it works the other way:
; that share of whoever is under the line when the pass reaches them is
; lifted back above it - a border that is harder to cross, though only
; partly, since the pass visits each citizen every fourth day and the
; game rolls every day. Children, visitors, guest workers and prisoners
; are never pushed, and nobody is written to unless their own home still
; lists them as a resident.
;
; The log says once a pass (every four days) how many were pushed, and
; the daily PEOPLE line how many left - compare the two to tune this.
apply_emigration = 1
; The share of adults pushed under the line each day per +1.0 of
; `emigration`. At 0.003, Mass Emigration (x2.5) pushes 0.45% of the
; adults a day and, at a loyalty of 54% with full bellies, about one in
; eleven of those leaves: some five per cent of the republic over its
; two hundred days. Hunger and disloyalty make it worse, as they should.
emigration_push = 0.003

find_citizens = 1

; HOW LONG AN EFFECT TAKES TO WEAR OFF. When an event ends, nothing is asking
; for that status any more and the daily pass would simply stop writing to it
; - leaving the republic wherever the event left it. For this many days after
; the last thing asking for a status has gone, the pass walks it back towards
; the baseline it started from, and then lets go.
;
; 0 turns it off, which is right if you would rather the game's own
; simulation did all of the recovering. It does do some of it - happiness,
; satiation, health and clothing are recomputed from shops, heating and
; clinics every day - but whether it ever touches religion sympathy, culture
; or sports on its own is not something this plugin knows.
recovery_days = 120

apply         = 1        ; the institutions may move loyalty and crime

; The ceiling to lift from when the republic's own average is not known -
; only the fallback path uses it, since the found list measures the real
; one. Each Espionage HQ adds its loyalty_bonus on top.
base_ceiling  = 0.50

; How far one day may move one person. Small on purpose: the game recomputes
; loyalty from its own inputs and pulls back down, so the two settle somewhere
; above where the game alone would put it. That is the intended behaviour - a
; secret service that has to keep working, not a one-off poke of 0.65 into
; everybody.
step_per_day  = 0.01

; Never past this, whatever the institutions add up to.
hard_cap      = 0.95

; A citizen list longer than this is a misread list, and the pass refuses it.
max_citizens  = 300000


; ===========================================================================
; INSTITUTIONS
;
; An embassy is a building whose only job is to change a number. So is a Foreign
; Relations HQ, and so is an Espionage HQ - which means none of them needs new
; code, only a row here naming the building and what holding it changes.
;
;   object                  the OBJECT name, as reputation-debug.txt section 8b
;                           spells it. Workshop content is prefixed with its item
;                           id; the part after the last slash is enough.
;   bloc                    soviet | west | both
;   max                     buildings beyond this do not help
;   decay_multiplier        standing lost per day. 0.5 halves it
;   contract_pay_mult       money a completed contract pays
;   contract_standing_mult  standing a completed contract pays
;   export_bonus            a fraction ADDED to export income. 0.03 is 3%
;   tourism_mult            multiplies the tourism scale in [tourism]
;   arms_penalty_mult       scales the standing lost for selling arms
;   loyalty_bonus           ADDED to [population] base_ceiling, per building
;   crime_multiplier        multiplies crime DOWN, per building
;
; Effects multiply per building up to `max`, so two halvings are a quarter -
; except loyalty_bonus and export_bonus, which add.
;
; The last two need the citizen offsets in [population] before they do
; anything, and that section explains how to get them. Everything above them
; works now.
;
; BOTH BUILDINGS EXIST, in media_soviet\workshop_wip\9900000101.
; ===========================================================================

[institutions]

list = foreign_relations_hq, espionage_hq, monument_friendship, space_programme, grand_canal, international_academy, parade_ground

; Built on workshop item 3729636494, "House of the Soviets of the RSFSR" - the
; Moscow White House. 400 workers: a staffed ministry with a real wage bill,
; which is what these effects are paid for with.
;
; `max = 2` because two is already a 70% cut in decay and a 56% larger contract
; payout. A third would be buying almost nothing, and a mod where the answer is
; always "build another one" has stopped asking a question.
[foreign_relations_hq]
name                   = Foreign Relations HQ
object                 = foreign_relations_hq
bloc                   = both
max                    = 2
decay_multiplier       = 0.55
contract_pay_mult      = 1.25
contract_standing_mult = 1.20
export_bonus           = 0.03

; arms_penalty_mult WORKS as of 1.41 - per-resource export figures are real
; now, so a mission in the capital really does soften what selling weapons to
; the other side costs you.
arms_penalty_mult      = 0.80

; tourism_mult HALF works. It multiplies what each visitor is worth in standing,
; which is live. It also multiplies how many arrive, which is still inert: that
; needs an offset in [tourism] and the advertisement-campaign field has not been
; found. The half that works is the half most people will notice.
tourism_mult           = 1.15

; NEW in 1.42, and live. A trade mission negotiates. 0.95 means everything the
; republic imports effectively costs five per cent less, paid back as a rebate
; the following day rather than by rewriting the price table. With max = 2 two
; of these give 0.9025 - about a tenth off, which for a building this expensive
; is a real return without being the obvious dominant strategy.
import_price_mult      = 0.95

; Built on workshop item 2966197884, Shotkey's KGB headquarters "Raduga"
; (Leningrad, 1991), used with permission. THIS BUILDING IS $TYPE_WORKSHOP, not
; $TYPE_SECRET_POLICE, so none of the game's own secret-police behaviour applies
; to it and everything it does it does through this plugin. 250 workers.
;
; max = 1. A republic has one intelligence service.
[espionage_hq]
name                   = Foreign Espionage HQ
object                 = espionage_hq
bloc                   = both
max                    = 1
decay_multiplier       = 0.90

; The whole point of the building, and LIVE at last.
;
; This was inert from the day it was written, because loyalty and criminality
; live inside each citizen and citizens are the one part of this game not
; written to the save as named fields. They are found now - by taking people
; out of the save's own workers.bin, finding those exact bytes in memory, and
; following the array of pointers the game keeps them in.
;
; What this number does: every citizen's loyalty is nudged one step a day
; towards the republic's own average PLUS this. The average is measured on the
; day the citizens are found and remembered in the save, so the building lifts
; the population off where it actually sits rather than off a figure in this
; file. At 0.15 and an average of 53%, the ceiling is 68%.
;
; It is a nudge and not a poke, on purpose: a hundredth a day, so a citizen
; takes a fortnight to arrive and the secret police has to keep working.
loyalty_bonus          = 0.15

; Crime, multiplied down per building - and this is the half that was proven
; first. Pushing a citizen's criminality DOWN sticks: the republic went from
; 3.5% to 0.1% and stayed there through a save. Pushing it up does not - the
; game drives it back to the floor within a day - which is exactly the right
; way round for a building whose job is to put crime down.
;
; The floor is the republic's own average crime times this, measured once and
; remembered in the save. At 0.60 and an average of 3.8%, the floor is 2.3%.
; Two of these buildings make a lower floor, not a faster collapse.
crime_multiplier       = 0.60

; LIVE as of 1.41. A secret service is exactly the institution that makes an
; arms sale deniable, and per-resource export figures are real now, so this
; cuts the penalty by a third.
arms_penalty_mult      = 0.65


; ===========================================================================
; ARMY STANDING - a third axis.  FRAMEWORK ONLY, OFF BY DEFAULT.
;
; Soviet and Western standing measure what two markets think of you. Army
; standing measures what your own officer corps thinks, and that is a different
; kind of number: a market can refuse to trade, but a faction inside the
; republic can act.
;
; THE TENSION IT EXISTS FOR. A strong army is what turns a border incident into
; a footnote, and it is the only thing that holds a republic together while both
; blocs are hostile. But a high army standing beside a low population loyalty is
; the classic pre-coup arrangement. Neither number is a threat on its own, and
; that is the point - the thing that keeps you safe from outside becomes the
; danger when the inside rots.
;
; WHAT WORKS TODAY: the number. It clamps, saves, restores, logs, and can be
; moved by any event, contract or institution that says `bloc = army`.
; WHAT DOES NOT: nothing reads it to decide anything yet. A coup needs the
; loyalty field, which is still an unknown offset.
;
; Turning this on is therefore safe but currently pointless - it is here so the
; content can be written before the mechanism lands.
; ===========================================================================

[army]

enabled = 0
start   = 0
min     = -50
max     = 100


; ===========================================================================
; THE DETERRENT - a stockpile that changes which events can happen.
; FRAMEWORK ONLY, OFF BY DEFAULT, AND NOTHING PRODUCES A WARHEAD YET.
;
; A warhead is not a weapon here. There is no target and nothing to bomb. What a
; stockpile does is change your exposure, and what SELLING one does to the two
; blocs. Three things make that interesting:
;
;   1. It is a sink for everything at once - the arms chain's full output, an
;      enormous sum, and army standing. A republic that builds ten has chosen to
;      build nothing else.
;
;   2. Selling one is the most destructive act in the mod. The buyer pays a
;      fortune and thinks well of you; the other bloc hits the floor and shuts
;      its border. Not a penalty bolted on - that is simply what selling a
;      warhead to the other side means.
;
;   3. Testing one costs you both, permanently. It is the non-aligned
;      republic's expensive way of being taken seriously.
;
; `negates` is a list of event CATEGORIES and what one warhead multiplies each
; category's chance by. It compounds per warhead and is floored at 0.02 - a
; deterrent makes bad years rarer, it never makes them impossible. A stockpile
; that switched the event system off would be the opposite of the point.
;
; TO FINISH THIS you need: a silo building, a warhead as a resource or a counter
; the plugin owns, and the three actions above wired to keys. The multiplier
; lookup, the category matching and the event-roll hook are already in place.
; ===========================================================================

[deterrent]

; STILL OFF, and the reason has changed. It used to be off because there was no
; building; now there are two, and it is off because nothing PRODUCES a warhead
; yet. Turning it on today gives you a silo that suppresses events for free,
; which is not a mechanic, it is a cheat.
;
; THE TWO BUILDINGS, both permission-pending:
;
;   the silo   https://steamcommunity.com/sharedfiles/filedetails/?id=2098302141
;   the plant  https://steamcommunity.com/sharedfiles/filedetails/?id=3136263602
;
; WHAT IS STILL MISSING, in the order it has to be done:
;
;   1. Permission from both authors, and each listed in CREDITS.txt.
;   2. A `warheads` resource in plugins\resources.ini, cloned from eletronics
;      like the arms three - and cargo = none, for the reason written there.
;   3. The plant's building.ini: a factory consuming nuclearwaste, chemicals,
;      aluminium, explosives, ecomponents and mcomponents, producing warheads
;      very slowly and at enormous cost.
;   4. The silo's building.ini: pure COVERED storage for warheads, capacity a
;      handful, and no production at all.
;   5. Then set enabled = 1 and check the two object names below.
;
; `per_building` is how many warheads a silo holds, and each stored warhead
; compounds the multipliers in `negates` - so the fourth buys much less than
; the first, which is the intended shape. A republic with four warheads has
; bought itself out of most disasters; one with twelve has wasted the aluminium.
enabled      = 0
object       = missile_silo
plant        = warhead_plant
resource     = warheads
per_building = 4
negates      = disaster:0.75, war:0.6, unrest:0.8

; SELLING ONE. Sell a warhead to one bloc and the other drops to -50 and shuts
; its border.
;
; ITS BLOCKER IS GONE as of 1.41. This needed per-resource export detection,
; which did not exist; it exists now, is exact, and already drives the arms
; penalty in [arms]. The moment `warheads` is a real resource this is a handful
; of lines - the same shape as ApplyArmsPenalty, with a bigger number and a
; border slam instead of a nudge.
;
; What is left is therefore content, not code: permission, a resource, and two
; building.ini files.
sell_crashes_other = -50


; ===========================================================================
; WHAT AN EVENT CAN DO TO THE PEOPLE THEMSELVES  (rewritten for step 208)
;
; This block used to say these keys did nothing yet. All but one of them
; work now:
;
;   birth_rate         multiplier while the event runs. WORKS: every
;                      citizen's own birth accumulator, and past a tenth
;                      either way the game's natality research as well.
;   emigration         multiplier while the event runs. WORKS: above 1,
;                      adults are pushed under the 3% happiness line where
;                      the game's own roll lets people leave; below 1,
;                      they are lifted back over it. See [population].
;   refugees           people who arrive while it runs. WORKS: made by the
;                      game's own "Invite immigrants" routine, into
;                      housing with room, some with a child. With it:
;     refugee_origin   soviet (the default) or third_world - the game's two
;                      kinds of immigrant, who arrive differently fed,
;                      healthy and educated - or any.
;     refugee_days     spread over this many days from the start
;                      (default: the event's length, at most thirty).
;   research_loss      1 = lose the most recently completed research. WORKS.
;   happiness_per_day  added per day, -1..1. Still parsed and NOT applied -
;                      status_bonus = happiness:N is the way to move it.
;
; When an event carrying one of these cannot act - switched off in
; [population], or nothing yet for research_loss to take - the log says so
; once, rather than letting an author conclude the mod is broken.
; ===========================================================================


; ===========================================================================
; WHAT AN EVENT CAN DO AT THE BORDER  (step 211)
;
;   close_border   west | soviet (or east) | both. Shuts it while the event
;                  runs - see [borders]. Implies `embargo` for that bloc.
;   block_import   west | soviet | both. Nothing is bought from there.
;   block_export   west | soviet | both. Nothing is sold there.
;   warn_days      the player is told this many days ahead: a dated event
;                  that long before its date, a rolled one by waiting that
;                  long after its roll - LOOMING on the panel, and a
;                  notification. Give it to anything that shuts a border.
;   warning        what that notice says (the blurb if empty)
;   end_blurb      what the bar says the day it ends. An event that did
;                  something at the border says so anyway.
;
; A DATED EVENT ALREADY OVER when a republic starts is history and never
; fires - a republic founded in 1960 no longer gets the 1941 war on its
; first morning. One already under way starts with the days it has left.
; ===========================================================================


