; --- THE WAR ECONOMY -------------------------------------------------------
;
; This is the shape you asked for, and it is worth saying why it works as a
; game mechanic rather than just as a penalty.
;
; A war does not make you poor. It makes you poor IN ONE DIRECTION. Everything
; you must buy becomes ruinous, everything you can sell becomes lucrative, and
; the republic that survives is the one that was already producing what the war
; wants. A player who spent the thirties building an arms industry gets rich;
; one who spent them building housing pays for it. That is a decision made ten
; years earlier finally mattering, which is the best thing an event can do.
;
; The three levers, all real:
;   prices                  what things cost, per currency
;   arms_penalty_mult = 0   selling weapons costs no standing while it runs
;   decay_multiplier  = 0   nobody is counting your diplomacy during a war
;
[great_patriotic_war_economy]
