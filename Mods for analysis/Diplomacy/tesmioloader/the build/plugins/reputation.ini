; ===========================================================================
; WHAT AN INSTITUTION CAN DO, as of 1.42
;
; Every row in [institutions] may carry these. They multiply, so two Foreign
; Relations HQs with import_price_mult = 0.95 give 0.9025, not 0.90.
;
;   decay_multiplier      how fast standing bleeds. 0.5 halves it.
;   pay_multiplier        contract payouts
;   standing_multiplier   contract standing rewards
;   export_bonus          extra income on exports, added not multiplied
;   tourism_mult          BOTH how many visitors arrive AND what each is worth
;   arms_penalty_mult     the standing cost of selling weapons. 0 = free
;   crime_multiplier      per-citizen crime, once the citizen list is known
;   loyalty_bonus         per-citizen loyalty ceiling, same condition
;   import_price_mult     NEW. 0.95 means your imports effectively cost 5% less
;
; import_price_mult is paid as a REBATE rather than by rewriting the resource
; price table. Same economics - you paid less for what you imported - without
; touching a process-wide table that the events also write and that a bad value
; in would corrupt for the whole session. It arrives as money the day after,
; and the log says where it came from.

; ---------------------------------------------------------------------------
; SELLING WEAPONS
;
; Framework since 1.24, inert until 1.41 for want of a per-resource export
; figure. It has one now.
;
; The rule is the one the cold war actually ran on: whoever you sell to, the
; OTHER side notices. Ship munitions east and the west marks you down; ship them
; west and Moscow does. Sell to nobody and it costs nothing. Sell to both and it
; costs twice, which is the trap the mechanic exists to set.
;
; `resources` is resource NAMES, comma separated - the same names the resource
; table uses, which are the folder names under media_soviet/resources. Anything
; this install does not have is reported once in reputation.log and then
; ignored, so listing the arms resources here is harmless if you have not
; subscribed to the buildings that produce them.
;
; The rates are per TON, and they are meant to sting: a hundred tons of
; munitions sold east should cost real standing in the west, not a rounding
; error. Both are 0 by default so nothing changes for anyone who does not turn
; this on deliberately.
;
; An embassy softens it - that is what arms_penalty_mult on an institution is
; for, and why a republic that keeps missions in both capitals can get away with
; more than one that keeps none.
[arms]

; THE THREE WEAPONS RESOURCES (step 213). small_arms, large_arms and munitions
; are not in the base game; the arms factories name them, and a building that
; names a resource the game does not have crashes the build menu when you
; hover it. So at every start the plugin checks plugins\resources.ini and adds
; whichever of the three lines (and their `cargo = none` sections) is missing -
; nothing else in that file is touched, and the file as it was is kept once as
; resources.ini.before-diplomacy. Needs resources.dll.
;
; They are part of the save format: a republic started without them will not
; load with them. To keep playing one, put the old file back and set this to 0.
add_to_resources_ini = 1

enabled        = 0
resources      = munitions, small_arms, large_arms
soviet_per_ton = 0.004
west_per_ton   = 0.004


; ---------------------------------------------------------------------------
; CONTRACTS
;
;   kind   import    | value bought from that bloc while it runs
;          export    | value sold to it
;          vehicles  | spent on vehicles from it
;          buildings | how many finished buildings of building_type stand
;
; `buildings` is the shape your "build so many of these" contracts take;
; building_type is the engine's BUILDINGTYPE_ number, 20 for a customhouse.
; ---------------------------------------------------------------------------

; The board is redrawn every `offer_days`, taking up to `offers_per_bloc` from
; whatever the republic now qualifies for. Anything you did NOT accept goes back
; in the pool; anything you did runs its full term untouched. So an offer you
; ignore may not be there next month, and standing opens the board gradually
; rather than all at once.
;
; auto = 1 on a contract takes it automatically the moment it is offered.
; Everything ships with auto = 0 now - hold CTRL and press the number in the
; F9 window instead.

[contracts]

; TWO MONTHS. The board is cleared of everything you did NOT accept and redrawn
; from whatever you now qualify for - so an offer you ignore may genuinely be
; gone, and standing opens the board gradually rather than all at once. Anything
; you DID accept is untouched by the roll and runs its full term.
;
; 60 rather than 30 because a contract is a commitment of a year or more; a
; board that turned over monthly made the decision feel disposable, and a
; contract you were saving up for could vanish before you were ready for it.
offer_days      = 60
offers_per_bloc = 5

; ...AND HOW MANY GRANTS AND TREATIES COME WITH IT.
;
; Both used to be a standing list: everything visible from day one,
; waiting for your standing to reach it. That is a shopping list, not
; an offer - nothing is ever missed, so nothing is ever a decision.
; They are drawn now, and rerolled when the board is.
;
; A treaty you have SIGNED or BROKEN is always shown whatever this
; says. That is not an offer, it is something you hold or something
; you did.
;
; 0 on either line puts that list back to showing everything.
grants_per_roll   = 9
treaties_per_roll = 9

; EIGHTY-FOUR contracts, banded so a starting republic qualifies for only a
; handful and the rest arrive as standing grows. (This comment said "ten,
; five a side" for a long time after it stopped being true.)
;
; The six `build_*` ones are CONSTRUCTION contracts and every one of them
; carries `auto = 0` on purpose - see the note in their own section. `offers_per_bloc`
; caps how many of the qualifying ones reach the board in any one month, so
; even at high standing the board is a choice rather than a list of everything.
; One line. GetPrivateProfileString has no continuation character - a trailing
; backslash is read as part of the value, not as "continued below".
