; ===========================================================================
; DIPLOMACY - the other half of the argument
; ===========================================================================
;
; Espionage buys standing NOW, for free, at the risk of the relationship. This
; is the opposite trade, and it is the reason the espionage screen has any
; tension in it: standing bought SLOWLY, SAFELY, with money.
;
; AND EVERY ACTION IS SEEN BY THE OTHER SIDE. `rival_standing` is what a state
; visit to Moscow costs you in Washington. That one field is the whole design:
; without it this is a money-to-standing converter with no decision in it, and
; a republic simply buys its way to 90 with both. With it, diplomacy is a
; direction you are choosing, every time.
;
; Open it with the Diplomacy button on the reputation tab.
;
; ---------------------------------------------------------------------------
; EVERY KEY AN ACTION MAY CARRY
;
;   name, blurb, bloc     who it is aimed AT - soviet or west
;   days                  how long before it pays
;   cost_rub, cost_usd    taken at the moment you commit, not at the end
;   cost_standing         rare: an action that also costs the target
;
;   gain_standing         with `bloc`, on completion
;   rival_standing        with the OTHER bloc. Normally negative. The point.
;   gain_army             army standing (needs [army] enabled = 1)
;   cools_heat            takes espionage heat off `bloc` - the diplomatic
;                         answer to having been caught
;   gain_intel            intelligence points; an attache is an officer
;   gain_research         an [unlocks] id, handed over under the agreement
;   gain_licence          a [vehicles] tier id
;   on_done               an event id, started on completion
;
;   needs_building        an object that must be standing
;   needs_event           only while that event is RUNNING
;   needs_action          an action that must have completed first
;   min_standing          they will not receive us below this
;   max_standing          ...and above this there is nothing left to gain
;   min_year, max_year, repeatable, cooldown
; ---------------------------------------------------------------------------

[diplomacy]

enable = 1

; ONE LINE. GetPrivateProfileString reads to the end of the line.
list = sanctions_talks_west, sanctions_talks_east, state_visit_east, state_visit_west, cultural_exchange_east, cultural_exchange_west, trade_delegation_east, trade_delegation_west, foreign_aid_east, foreign_aid_west, expel_diplomats_east, expel_diplomats_west, arms_limitation_east, arms_limitation_west, technical_agreement_east, technical_agreement_west, olympic_bid, space_cooperation, crackdown, amnesty, party_congress, refugee_intake, westward_reception, labour_recruitment, repatriation


; --- THE WAY OUT, THROUGH THE FRONT DOOR. Slow, expensive, safe, and it costs
;     you with the other side - because asking the West to lift its sanctions
;     is a thing Moscow can read in the papers.
[sanctions_talks_west]
name              = Sanctions relief talks
blurb             = Eight months in Geneva. It lifts the embargo, and Moscow will notice.
bloc              = west
days              = 200
cost_usd          = 600000
needs_event       = western_embargo
; NO `min_standing`, DELIBERATELY. An embargo sets blocks_standing, which stops
; imports earning standing with that bloc at all - so a republic that was below
; the gate when the border shut could not climb back over it, and the one
; action written to end the embargo was locked for its whole 450 days by the
; embargo itself. Needing the event is gate enough.
gain_standing     = 3
rival_standing    = -4
ends_event        = western_embargo
repeatable        = 1
cooldown          = 400

[sanctions_talks_east]
name              = Fraternal consultations
blurb             = Eight months of meetings. It lifts the restrictions, and the West will notice.
bloc              = soviet
days              = 200
cost_rub          = 4000000
needs_event       = eastern_embargo
; See the western mirror: no gate, for the same reason.
gain_standing     = 3
rival_standing    = -4
ends_event        = eastern_embargo
repeatable        = 1
cooldown          = 400


; --- THE STAPLE. Expensive, slow, reliable, and visible from the other capital.
[state_visit_east]
