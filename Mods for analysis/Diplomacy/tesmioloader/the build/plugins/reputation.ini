; The doctrine was a stance: east, west, neutral, and a fee to change your
; mind. This is the commitment. You petition, you are put through stages that
; each demand something real and demand you HOLD it, and when you are finally
; admitted the whole republic runs differently - and walking out costs years.
;
; ONE AT A TIME, and leaving puts you in the wilderness for [factions]
; leave_days with both capitals cooling. That asymmetry is the point: an
; alliance you can drop on a whim is not an alliance.
