; ===========================================================================
; SIZES  (step 212)
;
; Every event and every contract is SMALL, MEDIUM or BIG. Say which in its
; own section:
;
;     size = big
;
; and without that line it is WORKED OUT FROM THE STAKES when the game
; starts - the log says how many of each it made ("SIZES events: ...").
;
;   an event    the standing it moves (once, and per day over its run), the
;               treasury it takes or gives, how far it moves prices, its
;               rule multipliers, the statuses it pushes, the people it
;               brings or drives away. Stopping trade counts heavily: an
;               embargo alone is big, and so is a border that shuts.
;   a contract  the standing it pays, half of what failing it costs, and
;               its money.
;
; WHAT A SIZE CHANGES
;
;   the tag     [Small] / [Medium] / [Big] in front of it on the panel and
;               in the title of every notification about it
;   the bar     big     warned ahead, told when it starts and when it ends
;               medium  told when it starts
;               small   the panel and the log only
;               A contract: big ones when they reach the board, medium
;               and big when they are met or failed.
;   how often   a rolled event is multiplied by its size's chance
;   the board   each bloc's places are dealt by size, by board_mix
;
; THE WARNING. A big event that names no warn_days of its own is announced
; big_warn_days ahead - a dated one that long before its date, a rolled
; one waits that long after its roll (LOOMING on the panel). warn_days = 0
; in its own section means it is never warned: a reactor fire or a death
; is not announced a month early, and the shipped ones say so.
;
; An event with listed = 0 (another plugin's long-running state) keeps the
; notices it always had, whatever its size.
; ===========================================================================
[sizes]

; THE SWITCH. 0: no tags, every event on the bar when it starts, no size
; warnings, the board drawn in plain shuffled order - as before sizes. The
; sizes are still worked out and logged.
enabled = 1

; The [Small]/[Medium]/[Big] tags. 0 keeps everything else and drops them.
tags    = 1

; WHERE THE SIZES ARE CUT, on the stakes. At these the 153 shipped events
; come out about a third each, and the contracts 35 / 51 / 43. Raise a
; number and fewer reach that size. list_each = 1 prints every event and
; contract with its size and stakes into reputation.log, to tune by.
event_medium_from    = 6
event_big_from       = 14
contract_medium_from = 11
contract_big_from    = 18
list_each            = 0

; HOW OFTEN each size is rolled: a multiplier on every rolled event's
; `chance`, 0..10. 0.5 halves them; 0 means that size never rolls (dated
; events still come on their date). The at_least_per_year floor in
; [events] is worked out after these, and when it lifts the rolls it
; lifts every size alike.
small_chance  = 1.0
medium_chance = 1.0
big_chance    = 1.0

; THE WARNING a size gives an event that names no warn_days, in days.
small_warn_days  = 0
medium_warn_days = 0
big_warn_days    = 30

; WHICH SIZES REACH THE NOTIFICATION BAR: this size and bigger. small,
; medium, big, or none. (all = small.)
;   notify_warning  an event's warning, when it has one
;   notify_start    an event starting
;   notify_end      an event ending, always. Below this, an event told at
;                   its start is also told at its end when it opened a
;                   border or has an end_blurb; a small one never is.
;   notify_offer    a contract reaching the board (or signing itself)
;   notify_result   a contract met or failed
notify_warning = medium
notify_start   = medium
notify_end     = big
notify_offer   = big
notify_result  = medium

; A COLOUR PER SIZE on the bar, the numbers [notify] colour uses (0 yellow,
; 1 red, 2 green, 3 blue); -1 is [notify] colour. Check the colour is
; switched on in the game's own settings before you trust it.
small_colour  = -1
medium_colour = -1
big_colour    = -1

; THE BOARD. Each bloc's offers_per_bloc places are dealt one at a time: a
; size is drawn by these weights - small, medium, big - from the sizes that
; still have a contract you qualify for, and the next of that size takes
; the place. 3, 2, 1 is a board of mostly small work with a big one now
; and then. A weight of 0 means that size is never offered. board_big_max
; caps the big ones per bloc per board (-1: no cap).
board_mix     = 3, 2, 1
board_big_max = 1

