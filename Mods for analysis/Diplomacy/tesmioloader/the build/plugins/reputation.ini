; ===========================================================================
; THE REPUBLIC
; ===========================================================================
;
; A name costs nothing and it is in front of you on every window and in every
; dispatch line. "Moscow has asked Bratislava about the delegation" reads like
; a cable; "the soviet bloc has asked the republic" reads like a form.
