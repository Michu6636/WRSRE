; The whole table is in docs/statistics-record.md. The ones worth aiming a
; contract at:
;
;   TOURISM      0x2EC generated USD   0x2F0 generated RUB
;                0x2F4 entered   USD   0x2F8 entered   RUB    <- headcounts
;                0x304 returned  USD   0x308 returned  RUB
