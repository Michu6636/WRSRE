; TWENTY-THREE BANDS A SIDE: five years each from 1900 to 2010, then one
; open-ended band for everything after it, and a free one before 1900.
;
; It was seven ragged bands - "sixties" ran 1960 to 1975 - which meant one
; purchase carried you across a decade and a half and stopped being a decision.
; Five years is short enough that the licence you hold is always nearly out of
; date, which is the whole point of having one.
;
; TIERS ARE YEAR BANDS, NOT VEHICLE TYPES. A 1924 locomotive and a 1924 lorry
; are both `pioneer` - the tier is chosen by the vehicle's own design year and
; nothing else. That is why trains appear unlocked without ever being bought:
; the pioneer licence is free and it covers everything designed before 1900.
