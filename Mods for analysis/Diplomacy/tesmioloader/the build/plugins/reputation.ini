; ===========================================================================
; EMBARGO
; ===========================================================================
;
; An embargo is not a flag on one event any more. It is a STATE the whole mod
; respects: prices climb on that side of the border, that bloc's contracts
; freeze (they do not fail - a closed border is not your fault), its vehicle
; licences and blueprints refuse, and buying from it stops earning standing,
; because you cannot buy your way back into favour with the people embargoing
; you.
;
; Any event can declare one: `embargo = west` (or soviet, or both). The shipped
; `western_embargo` and `eastern_embargo` do.
;
; WHY THE MULTIPLIER IS 3.5 AND NOT 12. A player with a standing order running
; on a customs house should not lose a republic overnight to a price that went
; up twelve times. So the design is survivable first and dramatic second:
;
;   - price_mult is modest, and it RAMPS over tighten_days rather than landing
;   - `resources` names STRATEGIC goods only. Nobody runs a bulk auto-buy on
;     uranium the way they do on gravel, so an embargo hits the things you were
;     buying deliberately and leaves the things you buy by the trainload alone.
;     Blank the line and it hits everything, which is the blunt version.
;   - the day it starts, the day it tightens and the day it lifts are all
;     dispatch lines on the standing window
;   - and for as long as you keep spending at embargo prices, it says so EVERY
;     DAY: "Still buying at embargo prices - something is on automatic."
;
; THE SURCHARGE is your flights-and-ships idea made concrete. While any border
; is shut, everything you import from anywhere costs this much more, because
; some of it is arriving the long way round through people who want paying for
; the trouble. It is why an embargo hurts even if you were not trading with
; them in the first place.
;
; AND THERE IS A WAY OUT, because an embargo with no exit is a punishment
; rather than a situation: sanctions talks in [diplomacy], or a smuggling
; operation in [intel]. Both name the event with `ends_event`.
[embargo]

enable            = 1

; 1.0 on the day it is announced, price_mult when fully tight.
price_mult        = 3.5
tighten_days      = 90

; On EVERYTHING imported, from anywhere, while any border is shut.
surcharge         = 0.18

blocks_standing   = 1
freezes_contracts = 1
blocks_licences   = 1

; Shout if more than this much is still being spent in the embargoed currency
; in a day. This is the line that saves a republic from its own auto-trade.
;
; KEEP IT LOW. This is a smoke alarm, not a budget: the whole point is to fire
; BEFORE the republic has spent serious money at embargo prices. At 250000 a
; day it would stay silent through most of a ruinous month.
warn_spend        = 60000

; ONE LINE. Strategic goods, not everything. Names must match resources.ini.
resources = eletronics, mcomponents, oil, uranium, steel, chemicals


; The eastern mirror of the shipped western_embargo. Moscow does this to
; republics that have got too friendly with the other side.
[eastern_embargo]
name           = Soviet trade restrictions
blurb          = Deliveries east have simply stopped being scheduled.
from_year      = 1950
to_year        = 2000
; 0.0005 AND 450 DAYS, not 0.0008 and 730. At the old numbers each bloc's
; embargo was live 37% of the time and at least one of the two was live 60% of
; the time - which is not a crisis, it is the weather. Now it is about 18%.
; The western mirror is patched to match, in main() below.
chance         = 0.0005
needs_west     = 60
duration       = 450
once           = 0
soviet_per_day = -0.004
embargo        = soviet
; No block_import / block_export: an embargo is prices, not a wall (see
; [embargo]). Since step 211 those two keys really stop goods.


; ===========================================================================
; CONSTRUCTION CONTRACTS
;
; `built_since` and `built_type` measure what you have BUILT since the day you
; accepted, not what you happen to have standing - which is the difference
; between "construct three hospitals" and "own three hospitals". The baseline
; is taken at the moment you sign and travels in the save.
;
;   kind = built_since    counts finished buildings whose object matches
;                         `building_name` (matched after the last "/")
;   kind = built_type     counts finished buildings of `building_type`,
;                         which is a $TYPE_ number - see the debug window
;
; EVERY ONE OF THESE IS `auto = 0`, AND THAT IS NOT OPTIONAL. The default is
; `auto = 1`, which is right for a trade contract - "sell them timber" is
; something the republic was doing anyway, so signing it costs nothing and
; noticing it later is a pleasant surprise. A construction contract is the
; opposite: it commits the player's CONSTRUCTION OFFICES for two or three
; years, and failing it costs standing (up to -12). A contract that spends
; your builders has to be one you chose. Do not remove these lines.
; ===========================================================================

