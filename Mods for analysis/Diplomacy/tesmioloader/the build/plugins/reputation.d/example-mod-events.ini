; ===========================================================================
;  EXAMPLE - adding events, contracts and vehicle tiers without touching the
;  reputation plugin's own file.
;
;  Drop any .ini into
;      tesmioloader\build\plugins\reputation.d\
;  and the plugin reads it exactly like its own reputation.ini. Nothing to
;  rebuild, nothing to merge, and an update to the plugin will not overwrite
;  your work.
;
;  Rename this file to whatever your mod is called. The file name does not
;  matter; only the section names do.
;
;  UTF-8 without a BOM. A BOM stops the first section header matching and
;  every setting in the file silently falls back to its default.
;
;  An id that another file already defined is REFUSED, not overridden - the
;  loader log says which file was ignored. That is deliberate: two mods should
;  not be able to quietly fight over one event.
; ===========================================================================


; --- EVENTS -----------------------------------------------------------------
;
; `list` names your sections. They are added to whatever the main file and
; other mods have already declared.
;
;   name            what the log calls it
;   start_year      fire on this exact date; omit for a rolled event
;   start_day       the game's own day of the year, 1..365
;   from_year       a rolled event may only land inside this window
;   to_year
;   chance          per day, 0..1. 0.0005 is about one year in five
;   needs_soviet    a roll only happens above these standings
;   needs_west
;   duration        days it runs; 1 is instant
;   once            1 to fire at most once per republic
;   soviet_per_day  standing paid (or charged) every day it runs
;   west_per_day
;   rub_per_day     money paid (or charged) every day it runs
;   usd_per_day
;   block_import    none | soviet | west | both
;   block_export
;
; Standing runs 0..100, so per-day figures are small. 0.01 a day for a year is
; three and a half points.

[events]
list = space_race, frontier_incident

[space_race]
name           = The space race
start_year     = 1957
start_day      = 277
duration        = 4000
once           = 1
soviet_per_day = 0.004
west_per_day   = -0.002

[frontier_incident]
name           = Border incident
from_year      = 1930
to_year        = 2000
chance         = 0.0005
duration       = 120
once           = 0
soviet_per_day = -0.02
west_per_day   = -0.02
block_import   = both


; --- CONTRACTS --------------------------------------------------------------
;
;   bloc           soviet | west - the currency it is measured and paid in
;   kind           import | export | vehicles | buildings
;   needs_soviet   the standing that unlocks the offer
;   needs_west
;   needs_event    only offered while that event runs (optional)
;   target         the amount that meets it
;   days           the deadline once accepted
;   building_type  for kind = buildings, the engine's BUILDINGTYPE_ number
;   pay_soviet / pay_west / pay_rub / pay_usd     paid on completion
;   fail_soviet / fail_west                       charged on a missed deadline
;   auto           1 takes it the day it unlocks

[contracts]
list = rocket_parts

[rocket_parts]
name         = Rocket component quota
bloc         = soviet
kind         = import
needs_soviet = 35
needs_event  = space_race
target       = 3000000
days         = 540
auto         = 1
pay_soviet   = 10
pay_rub      = 400000
fail_soviet  = -5


; --- VEHICLE TIERS ----------------------------------------------------------
;
; Optional. A tier gates a class of vehicle behind a standing.
;
;   bloc         soviet | west - which standing, and which vehicles. Every
;                vehicle is already tagged by its own price: a vehicle costed
;                in dollars is western, in roubles soviet, and none are both
;   needs        the standing that opens it
;   from_year    only vehicles whose own first year falls in this range
;   to_year
;   mode         block - hidden below the threshold
;                shift - its availability year moves instead, so nothing is
;                        ever denied outright
;   shift_years  how far `shift` moves it
;
; The game's own year gate always still applies on top. Nothing here makes a
; 1970 lorry available in 1940.
;
; Leave this section out entirely unless your mod really means to re-tier
; vehicles - the main file already covers the six default bands.

; [vehicles]
; list = my_special_tier
;
; [my_special_tier]
; bloc      = west
; needs     = 50
; from_year = 1960
; to_year   = 1980
; mode      = block
