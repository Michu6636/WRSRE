$ITEM_NAME "WRSR Reputation - diplomacy, espionage and the people"
 
$ITEM_DESC "A diplomacy mod for Workers & Resources: Soviet Republic, built as a TesmioLoader plugin.\n\nThe base game gives you two shops and no reason to care which one you use. You buy a Tatra from the east or a Volvo from the west, and nothing remembers. This mod makes the two blocs remember.\n\nSTANDING. Every rouble you spend in the east earns Soviet standing; every dollar in the west earns Western standing; selling to one costs you a little with the other. Standing decays on its own, so a republic that stops trading slowly stops being trusted, and one that trades with everybody is tolerated by nobody in particular.\n\nWHAT IT BUYS. Contracts appear on a board when your standing clears their threshold. Vehicle licences unlock whole tiers of the shop. Blueprints let you buy one specific vehicle years before its designers finished it. Fourteen grants turn standing into money, from a clearing-account balance to an IMF standby. Ten treaties are standing you spend now for standing you keep later - and breaking one is permanent.\n\nESPIONAGE. Thirty-two operations against either bloc, run by an officer corps you train and can lose. Heat, investigations, double agents, and enemy operations run against you in return.\n\nTHE PEOPLE. The mod reads your republic's actual citizens - their loyalty, their criminality, their happiness, their health, their sympathy for religion - and those numbers now do something. A loyal republic is a better ally and its contracts pay more; a lawless one leaks operations and loses the West. Eighty-nine events can move any of it, in both directions: the post-war crime wave, the closed session of 1956, a man in orbit, a hard winter, the atheist campaign, a thousand years of Christianity. Twenty-five diplomatic actions let you push back - a campaign against speculation, an amnesty, a party congress, or taking in refugees from a republic that is worse off than yours.\n\nNONE OF IT TOUCHES YOUR SAVE. The plugin keeps its own state in a sidecar beside the save, and if it ever loses its footing it switches itself off rather than write something it is not sure about.\n\nREQUIRES TesmioLoader, by Tesmio. This is a plugin and does not run without it. Launch through tesmiolauncher.exe, not Steam's Play button.\n\nTHE BUILDINGS ARE A SEPARATE ITEM - 'WRSR Reputation - Buildings'. The mod works without them, but the missions, the Foreign Relations HQ and the Foreign Espionage HQ are how most of it is reached.\n\nINSTALLING. Steam cannot put a loader plugin where it has to go. Copy the tesmioloader folder from this item into your SovietRepublic folder, say yes to merging, and paste the lines from ADD-TO-resources.ini.txt into plugins\\resources.ini. Full instructions are in README.txt.\n\nTHE CHEATS WINDOW IS A FEATURE. This mod is big and you may not want all of it - the Cheats page hands you standing, money, intelligence, licences, blueprints and research, and there is a real undo. Came for the spies and do not fancy grinding standing first? Take the standing. Play the parts you came for.\n\nAND IT IS MODULAR. Drop any .ini into the reputation.d folder and the mod reads it on top of its own: your events, contracts, grants, treaties and operations are ADDED, not substituted, and a mod update will not overwrite them. An event is about ten lines and needs no C++. Everything the mod does is in reputation.ini as editable text with a comment above every setting, and README.txt in this item explains all of it."
 
$END
